<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L10,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L10,3.2 L0,6.4 z" fill="#2e7d4f"/>
    </marker>
  </defs>
  <style>
    .asm   { fill:#f4f6f8; stroke:#3d4a57; stroke-width:1.8; rx:8; }
    .asmT  { font-size:14px; font-weight:700; fill:#1c2733; }
    .asmP  { font-size:10.5px; fill:#7b8794; }
    .new   { fill:#fdeaea; stroke:#c0392b; stroke-width:1.5; rx:5; }
    .exist { fill:#e8f4ea; stroke:#2e7d4f; stroke-width:1.5; rx:5; }
    .chg   { fill:#fff6e0; stroke:#c98a12; stroke-width:1.5; rx:5; }
    .t     { fill:#1c2733; font-size:12px; }
    .s     { fill:#5b6b7c; font-size:10.5px; }
    .ref   { stroke:#5b6b7c; stroke-width:1.6; fill:none; marker-end:url(#r); }
    .own   { stroke:#2e7d4f; stroke-width:1.8; fill:none; marker-end:url(#o); stroke-dasharray:6 3; }
    .k     { font-size:11px; fill:#5b6b7c; }
  </style>

  <text x="20" y="26" font-size="16" font-weight="700" fill="#1c2733">Where the shell, the registry and the data live — in EXISTING assemblies</text>
  <text x="20" y="45" class="k">grey arrow = project reference (points at the dependency) · green dashed = owns / constructs · red = new type · amber = changed · green = exists unchanged</text>
  <text x="20" y="62" class="k">Measured from the .csproj graph, 2026-08-20. ZERO new projects are required.</text>

  <!-- composition root -->
  <rect class="asm" x="300" y="82" width="580" height="120"/>
  <text x="316" y="104" class="asmT">Hrot.Editor  —  the COMPOSITION ROOT</text>
  <text x="316" y="120" class="asmP">Hrot/Subsystems/Hrot.Editor/EditorSubsystem.cs · already references BOTH sides below</text>
  <rect class="chg" x="316" y="130" width="256" height="56"/>
  <text x="326" y="149" class="t">EditorSubsystem</text>
  <text x="326" y="165" class="s">builds 4 × PerspectiveWorkspace (today 3)</text>
  <text x="326" y="180" class="s">registers every view descriptor</text>
  <rect class="new" x="586" y="130" width="278" height="56"/>
  <text x="596" y="149" class="t">Scenario/ view adapters</text>
  <text x="596" y="165" class="s">EntityComponentsView · MissionPlanView</text>
  <text x="596" y="180" class="s">the ONLY place that sees both sides</text>

  <!-- AiShared -->
  <rect class="asm" x="40" y="250" width="500" height="290"/>
  <text x="56" y="272" class="asmT">Hrot.Editor.AiShared</text>
  <text x="56" y="288" class="asmP">Hrot/Editor/Hrot.Editor.AiShared/ · the name is now a misnomer — see §1 note</text>

  <rect class="new" x="56" y="300" width="230" height="126"/>
  <text x="66" y="319" class="t" font-weight="700">Shell/  (new namespace)</text>
  <text x="66" y="337" class="s">DetailsContext            record</text>
  <text x="66" y="353" class="s">DetailsViewDescriptor     record</text>
  <text x="66" y="369" class="s">IDetailsViewInstance      iface</text>
  <text x="66" y="385" class="s">DetailsViewRegistry</text>
  <text x="66" y="401" class="s">PerspectiveWorkspace</text>
  <text x="66" y="417" class="s">DetailsWindow · DetailsViewWindow</text>

  <rect class="exist" x="298" y="300" width="226" height="62"/>
  <text x="308" y="319" class="t">Selection/EditorSelectionStore</text>
  <text x="308" y="336" class="s">built BEFORE any window (:626–:628)</text>
  <text x="308" y="352" class="s">focus latch · per-asset sub-selection</text>

  <rect class="chg" x="298" y="372" width="226" height="54"/>
  <text x="308" y="391" class="t">PerspectiveWorkspaceRegistrar</text>
  <text x="308" y="408" class="s">keeps its AI service bag; the generic</text>
  <text x="308" y="421" class="s">claim chain moves to PerspectiveWorkspace</text>

  <rect class="exist" x="56" y="440" width="468" height="46"/>
  <text x="66" y="459" class="t">Variables/VariableDetailsSection · Windows/AiDetailsWindow · BlueprintDetailsWindow (other asm)</text>
  <text x="66" y="476" class="s">become view descriptors — L3</text>

  <text x="56" y="512" class="s">Referenced by: Hrot.Blueprints.Editor · Hrot.BTree.Editor · Hrot.Hsm.Editor · Hrot.Utility.Editor · Hrot.Editor</text>
  <text x="56" y="529" class="s">⇒ the AI hosts already see the Shell namespace with no new reference.</text>

  <!-- Hrot.Presentation -->
  <rect class="asm" x="640" y="250" width="500" height="290"/>
  <text x="656" y="272" class="asmT">Hrot.Presentation</text>
  <text x="656" y="288" class="asmP">Hrot/Engine/Hrot.Presentation/ · does NOT reference AiShared, and must not</text>

  <rect class="exist" x="656" y="300" width="226" height="62"/>
  <text x="666" y="319" class="t">MissionPanel</text>
  <text x="666" y="336" class="s">792 lines · in-degree 14</text>
  <text x="666" y="352" class="s">wrapped by an adapter, not moved</text>

  <rect class="exist" x="894" y="300" width="230" height="62"/>
  <text x="904" y="319" class="t">ScenarioEditor/Systems/</text>
  <text x="904" y="336" class="s">SelectionInteractionSystem</text>
  <text x="904" y="352" class="s">WRITES the entity selection</text>

  <rect class="exist" x="656" y="376" width="468" height="52"/>
  <text x="666" y="395" class="t">SelectionRenderSystem · MissionPresentationGizmo · SelectionHighlightGizmo</text>
  <text x="666" y="414" class="s">READ the entity selection — three existing consumers, unchanged</text>

  <text x="656" y="452" class="s">⭐ Nothing here learns about the Details panel. The adapters live in the composition root,</text>
  <text x="656" y="469" class="s">which is the only assembly that already references both this and AiShared.</text>

  <!-- Fdp.Presentation -->
  <rect class="asm" x="40" y="566" width="1100" height="82"/>
  <text x="56" y="588" class="asmT">Fdp.Presentation  —  the common floor of both</text>
  <rect class="exist" x="56" y="596" width="330" height="42"/>
  <text x="66" y="614" class="t">WindowManager · ManagedWindow</text>
  <text x="66" y="631" class="s">IsVolatile · runtime RegisterWindow · layout save</text>
  <rect class="exist" x="398" y="596" width="330" height="42"/>
  <text x="408" y="614" class="t">ImGui/Panels/EntityInspectorPanel</text>
  <text x="408" y="631" class="s">570 lines — its private HashSet is DELETED (L6.3)</text>
  <rect class="exist" x="740" y="596" width="384" height="42"/>
  <text x="750" y="614" class="t">ImGui/Editing/ComponentEditWindow</text>
  <text x="750" y="631" class="s">the production precedent for a volatile spawned window</text>

  <!-- world -->
  <rect class="asm" x="40" y="670" width="1100" height="72"/>
  <text x="56" y="692" class="asmT">Hrot.Core / Fdp.Core  —  THE ENTITY SELECTION LIVES HERE, NOT IN ANY PANEL</text>
  <rect class="exist" x="56" y="700" width="540" height="34"/>
  <text x="66" y="722" class="t">Components/Map/SelectionState { IsSelected, IsPrimarySelection }</text>
  <rect class="exist" x="608" y="700" width="516" height="34"/>
  <text x="618" y="722" class="s">[ComponentId(GlobalComponentIds.SelectionState)] [DataPolicy(NoSave)] · registered globally · the ECS World is the store</text>

  <!-- reference arrows -->
  <path class="ref" d="M420 206 L 300 246"/>
  <path class="ref" d="M760 206 L 880 246"/>
  <path class="ref" d="M290 544 L 290 562"/>
  <path class="ref" d="M890 544 L 890 562"/>
  <path class="ref" d="M590 652 L 590 666"/>
  <text x="300" y="232" class="k">references</text>
  <text x="770" y="232" class="k">references</text>

  <!-- ownership arrow -->
  <path class="own" d="M316 158 C 200 190, 120 240, 150 296"/>
  <text x="150" y="240" class="k" fill="#2e7d4f">constructs, before any window</text>
</svg>
