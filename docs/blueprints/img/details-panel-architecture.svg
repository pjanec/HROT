<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#ffffff; stroke:#5b6b7c; stroke-width:1.4; rx:6; }
    .exist { fill:#e8f4ea; stroke:#2e7d4f; stroke-width:1.6; rx:6; }
    .gap   { fill:#fdeaea; stroke:#c0392b; stroke-width:1.6; rx:6; stroke-dasharray:5 3; }
    .part  { fill:#fff6e0; stroke:#c98a12; stroke-width:1.6; rx:6; }
    .t     { fill:#1c2733; }
    .s     { fill:#5b6b7c; font-size:11px; }
    .hdr   { font-size:15px; font-weight:700; fill:#1c2733; }
    .lbl   { font-size:11px; fill:#5b6b7c; }
    .ln    { stroke:#5b6b7c; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .lnx   { stroke:#c0392b; stroke-width:1.6; fill:none; marker-end:url(#ax); }
  </style>

  <text x="20" y="26" class="hdr">Details panel — one shell, N views, chosen by predicate over the context</text>
  <text x="20" y="45" class="s">green = exists today · amber = exists but on the wrong axis · red dashed = to build</text>

  <!-- ─────────── column 1: context sources ─────────── -->
  <text x="30" y="82" class="hdr" font-size="13">① CONTEXT SOURCES</text>

  <rect class="exist" x="30" y="94" width="230" height="46"/>
  <text x="42" y="113" class="t">FocusedSurface (latch)</text>
  <text x="42" y="130" class="s">EditorSelectionStore:116 · SelectionOrigin</text>

  <rect class="gap" x="30" y="150" width="230" height="60"/>
  <text x="42" y="169" class="t">Selection SET</text>
  <text x="42" y="185" class="s">today: ActiveSubSelection — ONE or null</text>
  <text x="42" y="200" class="s">3 bridges collapse Count != 1 → null</text>

  <rect class="exist" x="30" y="220" width="230" height="46"/>
  <text x="42" y="239" class="t">ActiveAsset + AssetKind</text>
  <text x="42" y="256" class="s">per-asset dict, keyed by AssetId</text>

  <rect class="exist" x="30" y="276" width="230" height="46"/>
  <text x="42" y="295" class="t">Perspective</text>
  <text x="42" y="312" class="s">WindowManager.CurrentPerspective</text>

  <rect class="exist" x="30" y="332" width="230" height="46"/>
  <text x="42" y="351" class="t">Mode (run state)</text>
  <text x="42" y="368" class="s">VariableRunState ← IDebugSessionRegistry</text>

  <rect class="exist" x="30" y="388" width="230" height="60"/>
  <text x="42" y="407" class="t">Entity selection = the ENTITY</text>
  <text x="42" y="423" class="s">ECS SelectionState { IsSelected,</text>
  <text x="42" y="438" class="s">IsPrimarySelection } — global, already built</text>

  <!-- ─────────── column 2: the context record ─────────── -->
  <rect class="gap" x="330" y="150" width="200" height="200"/>
  <text x="345" y="176" class="hdr" font-size="13">② DetailsContext</text>
  <text x="345" y="199" class="s">focus : SelectionOrigin</text>
  <text x="345" y="216" class="s">selection : IReadOnlyList&lt;…&gt;</text>
  <text x="345" y="233" class="s">entities : IReadOnlyList&lt;Entity&gt;</text>
  <text x="345" y="250" class="s">asset : IEditableAsset?</text>
  <text x="345" y="267" class="s">perspective : string</text>
  <text x="345" y="284" class="s">mode : VariableRunState</text>
  <text x="345" y="312" class="s" font-style="italic">one immutable record,</text>
  <text x="345" y="327" class="s" font-style="italic">rebuilt when the store fires</text>

  <path class="ln" d="M262 117 C 300 117, 300 190, 328 205"/>
  <path class="lnx" d="M262 180 L 328 218"/>
  <path class="ln" d="M262 243 C 300 243, 300 240, 328 240"/>
  <path class="ln" d="M262 299 C 300 299, 300 260, 328 258"/>
  <path class="ln" d="M262 355 C 300 355, 300 280, 328 276"/>
  <path class="ln" d="M262 418 C 300 418, 300 300, 328 294"/>

  <!-- ─────────── column 3: registry ─────────── -->
  <rect class="gap" x="600" y="120" width="250" height="260"/>
  <text x="614" y="146" class="hdr" font-size="13">③ VIEW REGISTRY</text>
  <text x="614" y="168" class="s">registered at the composition root,</text>
  <text x="614" y="183" class="s">the same pass as RegisterExtraWindow</text>

  <rect class="box" x="614" y="196" width="222" height="52"/>
  <text x="626" y="215" class="t" font-size="12">IDetailsView</text>
  <text x="626" y="231" class="s">Id · Title · Rank</text>
  <text x="626" y="244" class="s">AppliesTo(DetailsContext) : bool</text>

  <rect class="box" x="614" y="258" width="222" height="52"/>
  <text x="626" y="277" class="t" font-size="12">the PREDICATE ships with the view</text>
  <text x="626" y="293" class="s">the shell never learns about</text>
  <text x="626" y="306" class="s">missions, map drawing or hosts</text>

  <rect class="box" x="614" y="318" width="222" height="48"/>
  <text x="626" y="337" class="t" font-size="12">OFFER SET = views where AppliesTo</text>
  <text x="626" y="353" class="s">DEFAULT = highest Rank</text>

  <path class="ln" d="M532 250 L 596 250"/>
  <text x="540" y="242" class="lbl">asked once</text>
  <text x="540" y="266" class="lbl">per view</text>

  <!-- ─────────── column 4: the shell ─────────── -->
  <rect class="part" x="920" y="120" width="230" height="150"/>
  <text x="934" y="146" class="hdr" font-size="13">④ THE SHELL</text>
  <text x="934" y="168" class="s">today THREE candidates:</text>
  <text x="934" y="185" class="s">AiDetailsWindow (BTree/HSM)</text>
  <text x="934" y="201" class="s">BlueprintDetailsWindow</text>
  <text x="934" y="217" class="s">RuntimeInspectorWindow</text>
  <text x="934" y="240" class="s" font-style="italic">its pane registry keys on</text>
  <text x="934" y="255" class="s" font-style="italic">ASSET KIND — the wrong axis (R-112)</text>

  <rect class="box" x="920" y="284" width="230" height="96"/>
  <text x="934" y="308" class="t" font-size="12">toolbar = radio toggles</text>
  <text x="934" y="326" class="s">over the offer set (R-98)</text>
  <text x="934" y="349" class="t" font-size="12">empty ⇒ GREY TEXT (R-117)</text>
  <text x="934" y="366" class="s">"intentionally empty for the selection"</text>

  <path class="ln" d="M852 250 L 916 250"/>

  <!-- ─────────── three hosting modes ─────────── -->
  <rect class="box" x="600" y="404" width="550" height="140"/>
  <text x="614" y="428" class="hdr" font-size="13">⑤ THREE HOSTING MODES — one window class, one parameter</text>

  <rect class="exist" x="614" y="440" width="168" height="86"/>
  <text x="624" y="459" class="t" font-size="12">DOCKED</text>
  <text x="624" y="476" class="s">context: LIVE</text>
  <text x="624" y="491" class="s">in the shell, one at a time</text>
  <text x="624" y="508" class="s">no view applies ⇒ grey line</text>

  <rect class="gap" x="792" y="440" width="168" height="86"/>
  <text x="802" y="459" class="t" font-size="12">FLOATING — CONTEXTUAL</text>
  <text x="802" y="476" class="s">context: LIVE (same object)</text>
  <text x="802" y="491" class="s">own window, PERSISTED</text>
  <text x="802" y="508" class="s">predicate says no ⇒ grey line</text>

  <rect class="gap" x="970" y="440" width="168" height="86"/>
  <text x="980" y="459" class="t" font-size="12">FLOATING — PINNED</text>
  <text x="980" y="476" class="s">context: FROZEN at pin time</text>
  <text x="980" y="491" class="s">own window, IsVolatile</text>
  <text x="980" y="508" class="s">never stops applying</text>

  <path class="ln" d="M1035 384 L 1035 400"/>
  <text x="600" y="562" class="s">Mechanism already in production: ManagedWindow.IsVolatile · runtime RegisterWindow · Render() iterates a COPY ·</text>
  <text x="600" y="579" class="s">volatile windows skipped by the layout save — precedent: ComponentEditWindow (ComponentReflector:366)</text>
  <text x="600" y="600" class="s">⇒ a VIEW is a DESCRIPTOR + FACTORY, never a singleton: each host owns the instance it created.</text>

  <!-- ─────────── the scenario gap ─────────── -->
  <rect class="gap" x="30" y="470" width="500" height="130"/>
  <text x="44" y="496" class="hdr" font-size="13">⑥ SCENARIO IS INCONSISTENT — same mechanism, different contents</text>
  <text x="44" y="519" class="s">Measured: THREE registrars, THREE selection stores — Blueprint · BTree · HSM. The "Editor"</text>
  <text x="44" y="536" class="s">(Scenario) perspective has neither and takes a bespoke "scenario branch". Its KEY is inconsistent too.</text>
  <text x="44" y="558" class="s">The registrar fuses a GENERIC wiring hub (the claim chain) with an AI-authoring SERVICE BAG (21 params);</text>
  <text x="44" y="575" class="s">the generic half is trapped inside the specific one. ⇒ extract PerspectiveWorkspace; all four get one.</text>
  <text x="44" y="594" class="s">Renaming the key needs a layout migration — OwningPerspective is persisted.</text>

  <text x="20" y="628" class="s">Sources: EditorSelectionStore.cs · SelectionOrigin.cs · PerspectiveWorkspaceRegistrar.cs:600-685 · WindowManager.cs:112/571 ·</text>
  <text x="20" y="645" class="s">{Blueprint,BTree,Hsm}SelectionBridgeHelper.MapSelection · EntityInspectorPanel.cs:32 · EditorSubsystem.cs:626-628, 2241/2249/2292</text>
</svg>
