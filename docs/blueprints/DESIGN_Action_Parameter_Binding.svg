<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1180" height="660" fill="#ffffff"/>

  <!-- ── lane backgrounds ─────────────────────────────────────────────── -->
  <rect x="16" y="56" width="556" height="586" rx="10" fill="#f2f6fb" stroke="#c3d4e6"/>
  <rect x="608" y="56" width="556" height="586" rx="10" fill="#f6f3f8" stroke="#d6c8e0"/>

  <text x="34" y="84" font-size="15" font-weight="700" fill="#1d4e79">AUTHORING — the binding is a NAME</text>
  <text x="626" y="84" font-size="15" font-weight="700" fill="#5b3a75">RUNTIME — the binding is a BYTE OFFSET</text>

  <!-- ── the compile divider ──────────────────────────────────────────── -->
  <line x1="590" y1="56" x2="590" y2="642" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="516" y="18" width="148" height="30" rx="15" fill="#2f2f35"/>
  <text x="590" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">COMPILE (codegen)</text>

  <text x="34" y="30" font-size="18" font-weight="700" fill="#111">How an action node binds its parameters</text>

  <!-- ══ AUTHORING ════════════════════════════════════════════════════ -->

  <!-- node -->
  <rect x="40" y="106" width="300" height="112" rx="8" fill="#ffffff" stroke="#1d4e79" stroke-width="2"/>
  <text x="56" y="128" font-size="13" font-weight="700" fill="#1d4e79">BTree Action node</text>
  <text x="56" y="152" font-size="12.5" fill="#333">MethodFqn</text>
  <text x="184" y="152" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#0b6b3a">Ns.MoveTo</text>
  <text x="56" y="176" font-size="12.5" font-weight="700" fill="#333">ExpressionTargetField</text>
  <text x="56" y="196" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#b1420a">"_auto_7f3c…"</text>
  <text x="56" y="212" font-size="11" fill="#777">↑ the whole DTO, one variable</text>

  <path d="M340 162 L 398 162" stroke="#1d4e79" stroke-width="2" marker-end="url(#a1)"/>
  <text x="369" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4e79">by NAME</text>

  <!-- variable -->
  <rect x="398" y="106" width="160" height="112" rx="8" fill="#ffffff" stroke="#1d4e79" stroke-width="2"/>
  <text x="414" y="128" font-size="13" font-weight="700" fill="#1d4e79">Blackboard variable</text>
  <text x="414" y="150" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#b1420a">_auto_7f3c…</text>
  <text x="414" y="168" font-size="11.5" fill="#333">Type: MoveToParams</text>
  <text x="414" y="186" font-size="11.5" fill="#333">IsAutoManaged: true</text>
  <text x="414" y="206" font-size="11.5" fill="#333">DefaultValueJson: {…}</text>

  <!-- picker -->
  <rect x="40" y="248" width="518" height="86" rx="8" fill="#fffdf4" stroke="#c8a53a"/>
  <text x="56" y="270" font-size="12.5" font-weight="700" fill="#8a6d10">The picker is TYPE-FILTERED</text>
  <text x="56" y="292" font-size="12" fill="#5c4b12">It lists only variables whose type == the action's DtoType,</text>
  <text x="56" y="310" font-size="12" fill="#5c4b12">read from IActionSchemaExporter. No match ⇒ it offers</text>
  <text x="56" y="328" font-size="12" font-weight="700" fill="#8a6d10">“+ Promote to new variable”.</text>

  <!-- promote -->
  <rect x="40" y="352" width="518" height="152" rx="8" fill="#ffffff" stroke="#0b6b3a" stroke-width="2"/>
  <text x="56" y="374" font-size="13" font-weight="700" fill="#0b6b3a">PROMOTION — one gesture, three effects</text>
  <text x="56" y="398" font-size="12" fill="#333"><tspan font-weight="700">1.</tspan> creates a variable of the action's DtoType, named</text>
  <text x="76" y="416" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#b1420a">_auto_{node VisualId:N}</text>
  <text x="290" y="416" font-size="11" fill="#777">— unique + stable across saves</text>
  <text x="56" y="438" font-size="12" fill="#333"><tspan font-weight="700">2.</tspan> marks it <tspan font-family="ui-monospace,Consolas,monospace" fill="#b1420a">IsAutoManaged = true</tspan> — shown dimmed, read-only,</text>
  <text x="76" y="456" font-size="12" fill="#333">under “Node-Owned Allocations”, out of the main list</text>
  <text x="56" y="478" font-size="12" fill="#333"><tspan font-weight="700">3.</tspan> binds it: sets the node's <tspan font-weight="700">ExpressionTargetField</tspan></text>
  <text x="56" y="496" font-size="11.5" fill="#0b6b3a">Delete the node ⇒ the variable is removed and re-packed.</text>

  <!-- rejected -->
  <rect x="40" y="522" width="518" height="102" rx="8" fill="#fdf1f1" stroke="#b03030"/>
  <text x="56" y="544" font-size="12.5" font-weight="700" fill="#8c1f1f">⛔ REJECTED: per-field binding</text>
  <text x="56" y="566" font-size="12" fill="#6b2020">Target ← var A, Speed ← static, Destination ← var B</text>
  <text x="56" y="588" font-size="12" fill="#6b2020">would need a per-tick temp struct + field-by-field copy.</text>
  <text x="56" y="608" font-size="12" font-weight="700" fill="#8c1f1f">The kernel's zero-allocation guarantee forbids it.</text>

  <!-- ══ RUNTIME ══════════════════════════════════════════════════════ -->

  <!-- packer -->
  <rect x="632" y="106" width="512" height="94" rx="8" fill="#ffffff" stroke="#5b3a75" stroke-width="2"/>
  <text x="648" y="128" font-size="13" font-weight="700" fill="#5b3a75">The bin-packer resolves NAME → OFFSET</text>
  <text x="648" y="152" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#333">_auto_7f3c…  →  offset 24, size 16, MoveToParams</text>
  <text x="648" y="176" font-size="12" fill="#555">After this line the name does not exist. Nothing at</text>
  <text x="648" y="192" font-size="12" fill="#555">runtime looks a variable up by string.</text>

  <!-- blackboard strip -->
  <text x="632" y="232" font-size="12.5" font-weight="700" fill="#5b3a75">BrainBlackboard — one contiguous byte block</text>
  <rect x="632" y="242" width="104" height="46" fill="#e9e9ee" stroke="#8f8fa3"/>
  <rect x="736" y="242" width="150" height="46" fill="#d9c6ea" stroke="#5b3a75" stroke-width="2"/>
  <rect x="886" y="242" width="258" height="46" fill="#e9e9ee" stroke="#8f8fa3"/>
  <text x="684" y="270" text-anchor="middle" font-size="11" fill="#555">other vars</text>
  <text x="811" y="264" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f2555">MoveToParams</text>
  <text x="811" y="280" text-anchor="middle" font-size="10.5" fill="#3f2555">16 bytes</text>
  <text x="1015" y="270" text-anchor="middle" font-size="11" fill="#555">other vars</text>
  <text x="736" y="304" text-anchor="middle" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#b1420a">+24</text>
  <text x="886" y="304" text-anchor="middle" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#b1420a">+40</text>

  <!-- thunk -->
  <rect x="632" y="326" width="512" height="128" rx="8" fill="#ffffff" stroke="#5b3a75" stroke-width="2"/>
  <text x="648" y="348" font-size="13" font-weight="700" fill="#5b3a75">The emitted thunk, registered under MethodFqn@24</text>
  <text x="648" y="374" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#222">ref var dto = ref Unsafe.As&lt;byte, MoveToParams&gt;(</text>
  <text x="672" y="392" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#222">bb.BehaviorParameters[0] + 24);</text>
  <text x="648" y="412" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#222">return Ns.MoveTo(ref dto, ref st, ref ctx);</text>
  <text x="648" y="436" font-size="12" font-weight="700" fill="#0b6b3a">One reinterpret. No copy, no allocation, every tick.</text>

  <!-- supply -->
  <rect x="632" y="476" width="512" height="148" rx="8" fill="#f3faf5" stroke="#0b6b3a"/>
  <text x="648" y="498" font-size="12.5" font-weight="700" fill="#0b6b3a">Who WRITES those bytes</text>
  <text x="648" y="522" font-size="12" fill="#234"><tspan font-weight="700">STATIC</tspan> — ParseParams, ONCE at behavior assignment:</text>
  <text x="668" y="540" font-size="12" fill="#234">bake DefaultValueJson, then overlay the incoming JSON</text>
  <text x="668" y="556" font-size="12" fill="#234">by variable name. Runtime wins. Never re-applied per tick.</text>
  <text x="648" y="580" font-size="12" fill="#234"><tspan font-weight="700">DYNAMIC</tspan> — something else writes the same variable:</text>
  <text x="668" y="598" font-size="12" fill="#234">Approach A, whole-DTO aliasing — two places share one</text>
  <text x="668" y="614" font-size="12" fill="#234">variable, both hold a ref to the same bytes. Zero-copy.</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1d4e79"/>
    </marker>
  </defs>
</svg>
