<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/>
    </marker>
    <style>
      .ttl   { font-size:22px; font-weight:700; fill:#1f2733; }
      .sub   { font-size:13px; fill:#616b7a; }
      .hdr   { font-size:14px; font-weight:700; fill:#ffffff; letter-spacing:.4px; }
      .hsub  { font-size:11.5px; fill:#ffffff; opacity:.9; }
      .nodeb { font-size:13px; font-weight:700; fill:#1f2733; }
      .node  { font-size:12.5px; fill:#1f2733; }
      .small { font-size:11px; fill:#41495a; }
      .cap   { font-size:11.5px; fill:#616b7a; }
      .stg   { font-size:11px; font-weight:700; fill:#1f2733; }
      .stgn  { font-size:9.5px; fill:#6a7280; }
      .flow  { font-size:12px; font-weight:700; fill:#5a6472; letter-spacing:.3px; }
      .asm   { font-size:11px; font-weight:700; fill:#ffffff; letter-spacing:.3px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="780" fill="#f6f8fa"/>
  <text x="540" y="38" text-anchor="middle" class="ttl">Blueprint subsystem — end-to-end architecture</text>
  <text x="540" y="60" text-anchor="middle" class="sub">You draw a graph → it is compiled to C# by a reflection-free source generator → it runs per-entity, inside a tree, or as a plain function.</text>

  <!-- ============ AUTHOR TIME ============ -->
  <g>
    <rect x="30" y="86" width="1020" height="118" rx="12" fill="#ffffff" stroke="#e1e5ea"/>
    <path d="M30,98 a12,12 0 0 1 12,-12 h996 a12,12 0 0 1 12,12 v24 h-1020 z" fill="#7c5cff"/>
    <text x="48" y="110" class="hdr">AUTHOR TIME</text>
    <text x="1032" y="110" text-anchor="end" class="asm">Hrot.Blueprints.Editor · net8.0 · ImGui</text>

    <rect x="50"  y="138" width="238" height="50" rx="9" fill="#efeaff" stroke="#7c5cff"/>
    <text x="169" y="158" text-anchor="middle" class="nodeb">Palette discovery</text>
    <text x="169" y="176" text-anchor="middle" class="small">reflects Hrot/Fdp; bakes FQN strings</text>

    <rect x="300" y="138" width="238" height="50" rx="9" fill="#efeaff" stroke="#7c5cff"/>
    <text x="419" y="158" text-anchor="middle" class="nodeb">NodePinSchema</text>
    <text x="419" y="176" text-anchor="middle" class="small">projects pins · parity with Stage0</text>

    <rect x="550" y="138" width="238" height="50" rx="9" fill="#efeaff" stroke="#7c5cff"/>
    <text x="669" y="158" text-anchor="middle" class="nodeb">Wire-edit + Undo/Redo</text>
    <text x="669" y="176" text-anchor="middle" class="small">CommandHistory · drawers · Details</text>

    <rect x="800" y="138" width="230" height="50" rx="9" fill="#efeaff" stroke="#7c5cff"/>
    <text x="915" y="158" text-anchor="middle" class="nodeb">Debug session</text>
    <text x="915" y="176" text-anchor="middle" class="small">breakpoints · watch · step · hot reload</text>
  </g>

  <!-- artifact 1 -->
  <path d="M540,204 V228" stroke="#7b8494" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <rect x="360" y="230" width="360" height="34" rx="8" fill="#fdf3e2" stroke="#c98a1b"/>
  <text x="540" y="252" text-anchor="middle" class="node"><tspan font-weight="700">.bp.json</tspan> — saved projection-only (Pins:[]), links by GUID</text>

  <!-- ============ COMPILE TIME ============ -->
  <g>
    <path d="M540,264 V288" stroke="#7b8494" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <rect x="30" y="290" width="1020" height="150" rx="12" fill="#ffffff" stroke="#e1e5ea"/>
    <path d="M30,302 a12,12 0 0 1 12,-12 h996 a12,12 0 0 1 12,12 v24 h-1020 z" fill="#1f6feb"/>
    <text x="48" y="314" class="hdr">COMPILE TIME</text>
    <text x="1032" y="314" text-anchor="end" class="asm">Hrot.Blueprints.Compiler · netstandard2.0 · reflection-free — never loads game assemblies, emits baked FQN strings verbatim</text>

    <!-- stage strip (execution order L→R; legacy numeric tags) -->
    <g>
      <!-- 1 Parse -->
      <rect x="50" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="102" y="365" text-anchor="middle" class="stg">Parse</text>
      <text x="102" y="381" text-anchor="middle" class="small">JSON → asset</text>
      <!-- 0 Rehydrate -->
      <rect x="158" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="210" y="365" text-anchor="middle" class="stg">Rehydrate ⁰</text>
      <text x="210" y="381" text-anchor="middle" class="small">rebuild pins</text>
      <!-- 2 Validate -->
      <rect x="266" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="318" y="365" text-anchor="middle" class="stg">Validate</text>
      <text x="318" y="381" text-anchor="middle" class="small">diagnostics</text>
      <!-- 3 Normalize -->
      <rect x="374" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="426" y="365" text-anchor="middle" class="stg">Normalize</text>
      <text x="426" y="381" text-anchor="middle" class="small">canonicalize</text>
      <!-- 4 Types -->
      <rect x="482" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="534" y="365" text-anchor="middle" class="stg">TypeResolve</text>
      <text x="534" y="381" text-anchor="middle" class="small">pin → IrTypeRef</text>
      <!-- 5 Schedule -->
      <rect x="590" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="642" y="365" text-anchor="middle" class="stg">Schedule</text>
      <text x="642" y="381" text-anchor="middle" class="small">lower → IR</text>
      <!-- 6 Lower -->
      <rect x="698" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="750" y="365" text-anchor="middle" class="stg">Lower</text>
      <text x="750" y="381" text-anchor="middle" class="small">waits→phases</text>
      <!-- 7 Emit -->
      <rect x="806" y="344" width="104" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="858" y="365" text-anchor="middle" class="stg">Emit</text>
      <text x="858" y="381" text-anchor="middle" class="small">generate C#</text>
      <!-- 8 Roslyn -->
      <rect x="914" y="344" width="116" height="48" rx="8" fill="#e7f0ff" stroke="#1f6feb"/>
      <text x="972" y="365" text-anchor="middle" class="stg">Roslyn ⁸</text>
      <text x="972" y="381" text-anchor="middle" class="small">→ PE/PDB</text>

      <!-- chevrons between stages -->
      <g fill="#9fb2d6" font-size="14" font-weight="700">
        <text x="153" y="373">›</text><text x="261" y="373">›</text><text x="369" y="373">›</text>
        <text x="477" y="373">›</text><text x="585" y="373">›</text><text x="693" y="373">›</text>
        <text x="801" y="373">›</text><text x="909" y="373">›</text>
      </g>
    </g>
    <text x="50" y="418" class="cap">Numeric tags are legacy (Stage0 Rehydrate runs right after Parse, before Validate). Stage0 mirrors the editor's NodePinSchema — the two must stay in lockstep or wires render "unused".</text>
  </g>

  <!-- artifact 2 -->
  <path d="M540,440 V464" stroke="#7b8494" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <rect x="315" y="466" width="450" height="34" rx="8" fill="#fdf3e2" stroke="#c98a1b"/>
  <text x="540" y="488" text-anchor="middle" class="node"><tspan font-weight="700">Generated C#</tspan> (_Bp.g.cs) — shape depends on dispatch kind</text>

  <!-- ============ RUN TIME ============ -->
  <g>
    <path d="M540,500 V524" stroke="#7b8494" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <rect x="30" y="526" width="1020" height="216" rx="12" fill="#ffffff" stroke="#e1e5ea"/>
    <path d="M30,538 a12,12 0 0 1 12,-12 h996 a12,12 0 0 1 12,12 v24 h-1020 z" fill="#1a9c53"/>
    <text x="48" y="550" class="hdr">RUN TIME</text>
    <text x="1032" y="550" text-anchor="end" class="asm">Fdp.Toolkits.Blueprints · net8.0 · ECS systems</text>

    <!-- three dispatch columns -->
    <rect x="50" y="576" width="316" height="96" rx="9" fill="#e6f6ec" stroke="#1a9c53"/>
    <text x="208" y="597" text-anchor="middle" class="nodeb">Instance</text>
    <text x="208" y="616" text-anchor="middle" class="small">standalone, per-entity behavior</text>
    <text x="208" y="636" text-anchor="middle" class="small">ticked by <tspan font-weight="700">BlueprintTickSystem</tspan></text>
    <text x="208" y="654" text-anchor="middle" class="small">State = Variables, in a blackboard slot</text>

    <rect x="382" y="576" width="316" height="96" rx="9" fill="#e6f6ec" stroke="#1a9c53"/>
    <text x="540" y="597" text-anchor="middle" class="nodeb">AiPrimitive</text>
    <text x="540" y="616" text-anchor="middle" class="small">hosted inside a Behavior Tree / HSM</text>
    <text x="540" y="636" text-anchor="middle" class="small">registered as action/guard <tspan font-weight="700">thunks</tspan></text>
    <text x="540" y="654" text-anchor="middle" class="small">state = WorkingState (host-provisioned)</text>

    <rect x="714" y="576" width="316" height="96" rx="9" fill="#e6f6ec" stroke="#1a9c53"/>
    <text x="872" y="597" text-anchor="middle" class="nodeb">Library</text>
    <text x="872" y="616" text-anchor="middle" class="small">stateless helper</text>
    <text x="872" y="636" text-anchor="middle" class="small">each Function graph → static method</text>
    <text x="872" y="654" text-anchor="middle" class="small">called synchronously; no per-entity state</text>

    <!-- shared services strip -->
    <rect x="50" y="686" width="980" height="42" rx="9" fill="#f2faf5" stroke="#bfe3cc"/>
    <text x="540" y="712" text-anchor="middle" class="small"><tspan font-weight="700">Shared runtime:</tspan>  Blackboard tiers 1024 / 4096 / 16384  ·  BlueprintSharedState (per-field, fail-safe)  ·  FdpEventBus custom-event dispatch  ·  hot reload via ALC swap + StructureHash guard</text>
  </g>
</svg>
