<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="Segoe UI,Arial,sans-serif">
  <title>Blueprint node maturity — compiler vs authoring front door</title>

  <text x="12" y="24" font-size="15" font-weight="600" fill="#1a1a1a">50 node kinds — where the gap actually is</text>
  <text x="12" y="42" font-size="11" fill="#666">Audited 2026-08-04. Compiler = validated + lowered + emitted. Authorable = a designer can place AND configure it.</text>

  <!-- Bar -->
  <g>
    <rect x="12"  y="60" width="403" height="46" fill="#2e7d32" rx="3"/>
    <rect x="415" y="60" width="187" height="46" fill="#ef6c00" rx="3"/>
    <rect x="602" y="60" width="106" height="46" fill="#c62828" rx="3"/>

    <text x="213" y="82"  font-size="13" font-weight="600" fill="#fff" text-anchor="middle">28 — usable</text>
    <text x="213" y="98"  font-size="10" fill="#dfe9df" text-anchor="middle">compiler + authoring</text>

    <text x="508" y="82"  font-size="13" font-weight="600" fill="#fff" text-anchor="middle">13 — no front door</text>
    <text x="508" y="98"  font-size="10" fill="#fce6d2" text-anchor="middle">runs, can't be configured</text>

    <text x="655" y="82"  font-size="13" font-weight="600" fill="#fff" text-anchor="middle">9 — broken</text>
    <text x="655" y="98"  font-size="10" fill="#f7d5d5" text-anchor="middle">unlowered / bad emit</text>
  </g>

  <!-- Detail columns -->
  <g font-size="10.5" fill="#333">
    <text x="415" y="132" font-weight="600" fill="#ef6c00">Compiler ✅ · authoring ❌</text>
    <text x="415" y="150">Cannot be placed at all:</text>
    <text x="425" y="166" fill="#555">Compare, BinaryOp, BooleanOp, Not, GetParameter</text>
    <text x="415" y="186">Placeable, key field uneditable:</text>
    <text x="425" y="202" fill="#555">Return(Status), Cast, CallCustomEvent(EventId),</text>
    <text x="425" y="216" fill="#555">CallPeerBlueprint, WaitForChannel(ChannelType),</text>
    <text x="425" y="230" fill="#555">ScoreDecision(AssetId), ReadRankedResult(Rank)</text>
    <text x="415" y="248" fill="#555">When — drawer exists, 4 mode forms are stubs</text>

    <text x="12" y="132" font-weight="600" fill="#c62828">Compiler broken</text>
    <text x="12" y="150">Silent wrong value (worst):</text>
    <text x="22" y="166" fill="#555">ArrayMake, ArrayGet — emit default(), no diagnostic</text>
    <text x="12" y="186">Unlowered no-op (BP4004):</text>
    <text x="22" y="202" fill="#555">CallDispatcher, BindDispatcher — superseded</text>
    <text x="22" y="216" fill="#555">PartitionElements, AssignRoles, AdvancePhase,</text>
    <text x="22" y="230" fill="#555">AcquireSlot — squad quartet, abandoned by design</text>
    <text x="12" y="248" fill="#555">WaitForEvent — no EventTypeId passes both stages</text>
  </g>
</svg>
