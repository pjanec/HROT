<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="1120" height="560" fill="#f7f8fa"/>

  <text x="560" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Where each collection physically lives</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#6b7280">all three are inline blittable bytes — the collection is embedded, never a separate heap object</text>

  <!-- ===== Container 1: ECS component ===== -->
  <text x="40" y="98" font-size="12.5" font-weight="700" fill="#1e40af">Component collection — packed in the entity's ECS component (archetype chunk)</text>
  <rect x="40" y="106" width="1040" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="52" y="116" width="150" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="127" y="140" text-anchor="middle" font-size="11" fill="#6b7280">other fields…</text>
  <rect x="214" y="112" width="560" height="46" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="224" y="126" font-size="10.5" fill="#1e40af">FixedList (inline)</text>
  <rect x="224" y="130" width="58" height="22" rx="3" fill="#bfdbfe" stroke="#3b82f6"/><text x="253" y="145" text-anchor="middle" font-size="10" fill="#1e3a8a">Count</text>
  <g fill="#ffffff" stroke="#60a5fa"><rect x="290" y="130" width="26" height="22" rx="2"/><rect x="320" y="130" width="26" height="22" rx="2"/><rect x="350" y="130" width="26" height="22" rx="2"/><rect x="380" y="130" width="26" height="22" rx="2"/><rect x="410" y="130" width="26" height="22" rx="2"/><rect x="440" y="130" width="26" height="22" rx="2"/></g>
  <text x="620" y="145" font-size="10.5" fill="#1e40af">Items[N] — the N slots</text>
  <rect x="786" y="116" width="282" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="927" y="140" text-anchor="middle" font-size="11" fill="#6b7280">more fields…</text>

  <!-- ===== Container 2: blueprint blackboard ===== -->
  <text x="40" y="216" font-size="12.5" font-weight="700" fill="#5b21b6">Blueprint variable collection — a field in the blueprint instance's blackboard state slot</text>
  <rect x="40" y="224" width="1040" height="58" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <rect x="52" y="234" width="110" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="107" y="258" text-anchor="middle" font-size="10.5" fill="#6b7280">cursor (16 B)</text>
  <rect x="174" y="234" width="120" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="234" y="258" text-anchor="middle" font-size="11" fill="#6b7280">scalar var…</text>
  <rect x="306" y="230" width="560" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="316" y="244" font-size="10.5" fill="#5b21b6">FixedList (inline)</text>
  <rect x="316" y="248" width="58" height="22" rx="3" fill="#ddd6fe" stroke="#7c3aed"/><text x="345" y="263" text-anchor="middle" font-size="10" fill="#4c1d95">Count</text>
  <g fill="#ffffff" stroke="#a78bfa"><rect x="382" y="248" width="26" height="22" rx="2"/><rect x="412" y="248" width="26" height="22" rx="2"/><rect x="442" y="248" width="26" height="22" rx="2"/><rect x="472" y="248" width="26" height="22" rx="2"/><rect x="502" y="248" width="26" height="22" rx="2"/><rect x="532" y="248" width="26" height="22" rx="2"/></g>
  <text x="712" y="263" font-size="10.5" fill="#5b21b6">Items[N] — the N slots</text>
  <rect x="878" y="234" width="190" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="973" y="258" text-anchor="middle" font-size="11" fill="#6b7280">scalar var…</text>

  <!-- ===== Container 3: action DTO ===== -->
  <text x="40" y="334" font-size="12.5" font-weight="700" fill="#92400e">Action collection — a field in the behavior action's parameter / working-state block</text>
  <rect x="40" y="342" width="1040" height="58" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <rect x="52" y="352" width="150" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="127" y="376" text-anchor="middle" font-size="11" fill="#6b7280">action params…</text>
  <rect x="214" y="348" width="560" height="46" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="224" y="362" font-size="10.5" fill="#92400e">FixedList (inline)</text>
  <rect x="224" y="366" width="58" height="22" rx="3" fill="#fde68a" stroke="#d97706"/><text x="253" y="381" text-anchor="middle" font-size="10" fill="#78350f">Count</text>
  <g fill="#ffffff" stroke="#fbbf24"><rect x="290" y="366" width="26" height="22" rx="2"/><rect x="320" y="366" width="26" height="22" rx="2"/><rect x="350" y="366" width="26" height="22" rx="2"/><rect x="380" y="366" width="26" height="22" rx="2"/><rect x="410" y="366" width="26" height="22" rx="2"/><rect x="440" y="366" width="26" height="22" rx="2"/></g>
  <text x="620" y="381" font-size="10.5" fill="#92400e">Items[N] — the N slots</text>
  <rect x="786" y="352" width="282" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="927" y="376" text-anchor="middle" font-size="11" fill="#6b7280">working state…</text>

  <!-- memcpy note -->
  <rect x="40" y="430" width="1040" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="456" font-size="13" font-weight="700" fill="#0369a1">Why "inline bytes" matters</text>
  <text x="60" y="480" font-size="12" fill="#374151">No pointers, no heap object, no garbage collection. Snapshot, record / playback and rewind copy the whole</text>
  <text x="60" y="498" font-size="12" fill="#374151">block verbatim (a plain <tspan font-family="ui-monospace, monospace" fill="#111827">memcpy</tspan>), so the collection is captured and restored automatically with everything else.</text>
  <text x="60" y="518" font-size="11.5" fill="#6b7280">This is exactly why the element type must be blittable — a reference-typed element would break the byte-copy guarantee.</text>
</svg>
