<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 706" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="706" fill="#f7f8fa"/>

  <text x="640" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Fixed collections — how they fit the stack</text>
  <text x="640" y="57" text-anchor="middle" font-size="13.5" fill="#6b7280">one <tspan font-family="ui-monospace, monospace" fill="#374151">[InlineArray(N)] + int Count</tspan> collection · three places it can live · shared read/write machinery</text>

  <g font-size="12.5" fill="#374151" text-anchor="middle">
    <text x="470" y="85">🖉 hand-written in C#</text>
    <text x="646" y="85">🧩 declared in the editor</text>
    <text x="840" y="85">⚙ generated by the compiler</text>
  </g>

  <g font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">
    <text x="240" y="118">AUTHORED BY</text>
    <text x="476" y="118">WHERE IT LIVES</text>
    <text x="749" y="118">BLUEPRINT GRAPH access</text>
    <text x="1087" y="118">C# ACTION / CONDITION access</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="362" y1="128" x2="362" y2="632"/>
    <line x1="590" y1="128" x2="590" y2="632"/>
    <line x1="908" y1="128" x2="908" y2="632"/>
  </g>

  <!-- Component collection -->
  <rect x="18" y="135" width="98" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="67" y="197" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Component</text>
  <text x="67" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">collection</text>
  <text x="67" y="236" text-anchor="middle" font-size="10" fill="#1e40af">on an ECS</text>
  <text x="67" y="249" text-anchor="middle" font-size="10" fill="#1e40af">component</text>

  <rect x="124" y="135" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="136" y="160" font-size="12.5" fill="#111827">🖉 hand-written C#</text>
  <text x="136" y="177" font-size="12.5" fill="#111827">component struct:</text>
  <text x="136" y="197" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">[InlineArray(N)] Items</text>
  <text x="136" y="212" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">int Count</text>
  <text x="136" y="236" font-size="12" fill="#111827">+ accessor class</text>
  <text x="136" y="253" font-size="11" fill="#6b7280">(read + write accessors)</text>

  <rect x="372" y="135" width="210" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="384" y="185" font-size="12.5" fill="#111827">on the ECS component,</text>
  <text x="384" y="202" font-size="12.5" fill="#111827">on the entity</text>
  <text x="384" y="228" font-size="12" fill="#6b7280">shared · persistent ·</text>
  <text x="384" y="244" font-size="12" fill="#6b7280">one per component type</text>

  <!-- Blueprint variable collection -->
  <rect x="18" y="300" width="98" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="67" y="362" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">Blueprint</text>
  <text x="67" y="378" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">variable</text>
  <text x="67" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">collection</text>

  <rect x="124" y="300" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="136" y="328" font-size="12.5" fill="#111827">🧩 declared in the editor:</text>
  <text x="136" y="349" font-size="12" fill="#374151">element type × capacity</text>
  <text x="136" y="365" font-size="12" fill="#374151">(container-mode dialog)</text>
  <text x="136" y="393" font-size="12.5" fill="#111827">⚙ compiler generates the</text>
  <text x="136" y="410" font-size="12.5" fill="#111827">wrapper + its storage</text>
  <text x="136" y="431" font-size="11" fill="#6b7280">no C# written by the designer</text>

  <rect x="372" y="300" width="210" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="384" y="345" font-size="12.5" fill="#111827">a field in the blueprint's</text>
  <text x="384" y="362" font-size="12.5" fill="#111827">own blackboard state</text>
  <text x="384" y="388" font-size="12" fill="#6b7280">private to one</text>
  <text x="384" y="404" font-size="12" fill="#6b7280">blueprint instance</text>

  <!-- Shared graph machinery -->
  <rect x="598" y="135" width="304" height="315" rx="8" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="750" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Shared graph machinery</text>
  <text x="750" y="174" text-anchor="middle" font-size="10.5" fill="#0369a1">(component &amp; blueprint-variable collections)</text>
  <line x1="612" y1="184" x2="888" y2="184" stroke="#bae6fd"/>
  <text x="612" y="206" font-size="12.5" fill="#111827">Read — consumer nodes</text>
  <text x="612" y="223" font-size="11.5" fill="#374151">ForEach · ItemGet · ItemCount</text>
  <text x="612" y="239" font-size="11.5" fill="#374151">Contains · Find</text>
  <text x="612" y="266" font-size="12.5" fill="#111827">Write — mutation nodes</text>
  <text x="612" y="283" font-size="11.5" fill="#374151">Add · Set · InsertAt · RemoveAt</text>
  <text x="612" y="299" font-size="11.5" fill="#374151">Clear · Resize</text>
  <line x1="612" y1="316" x2="888" y2="316" stroke="#e0f2fe"/>
  <text x="612" y="339" font-size="11.5" fill="#374151">component → via <tspan fill="#1e40af">GetComponent</tspan> out-pin</text>
  <text x="612" y="359" font-size="11.5" fill="#374151">blueprint var → via <tspan fill="#5b21b6">GetVariable</tspan> out-pin</text>
  <text x="612" y="387" font-size="11" fill="#6b7280">same nodes, same wiring — the</text>
  <text x="612" y="402" font-size="11" fill="#6b7280">designer works identically for both</text>
  <text x="612" y="428" font-size="11" fill="#6b7280">(the backing is chosen by the source pin)</text>

  <line x1="582" y1="210" x2="596" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="582" y1="375" x2="596" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="916" y="135" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="930" y="190" font-size="12.5" fill="#111827">any action/condition, by ref:</text>
  <text x="930" y="212" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">ctx.World.GetComponentRW&lt;C&gt;()</text>
  <text x="930" y="230" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">c.Items[i] = x;</text>
  <text x="930" y="255" font-size="11.5" fill="#6b7280">in place, zero copy</text>

  <rect x="916" y="300" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="930" y="358" font-size="12.5" fill="#111827">only when the blueprint itself is</text>
  <text x="930" y="376" font-size="12.5" fill="#111827">an action (its working state) —</text>
  <text x="930" y="394" font-size="12.5" fill="#111827">otherwise it stays private</text>
  <text x="930" y="420" font-size="11.5" fill="#6b7280">a blueprint's own variable isn't</text>
  <text x="930" y="436" font-size="11.5" fill="#6b7280">visible to unrelated actions</text>

  <!-- Action collection -->
  <rect x="18" y="465" width="98" height="150" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="67" y="527" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Action</text>
  <text x="67" y="543" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">collection</text>
  <text x="67" y="566" text-anchor="middle" font-size="10" fill="#92400e">in a behavior</text>
  <text x="67" y="579" text-anchor="middle" font-size="10" fill="#92400e">action's DTO</text>

  <rect x="124" y="465" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="136" y="492" font-size="12.5" fill="#111827">🖉 hand-written C#</text>
  <text x="136" y="509" font-size="12.5" fill="#111827">parameter / working-state</text>
  <text x="136" y="526" font-size="12.5" fill="#111827">struct with a field:</text>
  <text x="136" y="547" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">[InlineArray(N)] Items</text>
  <text x="136" y="562" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">int Count</text>
  <text x="136" y="586" font-size="11" fill="#6b7280">no accessor class needed —</text>
  <text x="136" y="601" font-size="11" fill="#6b7280">the action uses it directly</text>

  <rect x="372" y="465" width="210" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="384" y="515" font-size="12.5" fill="#111827">the action's own</text>
  <text x="384" y="532" font-size="12.5" fill="#111827">parameter / working block</text>
  <text x="384" y="558" font-size="12" fill="#6b7280">lives with the running</text>
  <text x="384" y="574" font-size="12" fill="#6b7280">behavior on the entity</text>

  <rect x="598" y="465" width="304" height="150" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="750" y="533" text-anchor="middle" font-size="12.5" fill="#9ca3af">— not a blueprint variable —</text>
  <text x="750" y="553" text-anchor="middle" font-size="11.5" fill="#9ca3af">no blueprint-graph access</text>

  <rect x="916" y="465" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="930" y="522" font-size="12.5" fill="#111827">the action, by ref (plain C#):</text>
  <text x="930" y="544" font-size="11.5" font-family="ui-monospace, monospace" fill="#374151">ref p → p.Items[i] = x;</text>
  <text x="930" y="566" font-size="11.5" fill="#6b7280">in place, zero copy — the</text>
  <text x="930" y="582" font-size="11.5" fill="#6b7280">collection is just a struct field</text>

  <text x="640" y="662" text-anchor="middle" font-size="12.5" fill="#0369a1">Same collection everywhere — only where it lives and who reaches it changes.</text>
  <text x="640" y="682" text-anchor="middle" font-size="11.5" fill="#6b7280">Blueprints read/write it through nodes; C# actions read/write it directly by ref.</text>
</svg>
