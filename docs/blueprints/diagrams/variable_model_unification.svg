<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="800" fill="#f7f8fa"/>

  <text x="640" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Blueprint variables — four bespoke lists, two orthogonal axes</text>
  <text x="640" y="59" text-anchor="middle" font-size="13.5" fill="#6b7280">the storage classes stay split at emission · only the <tspan font-weight="600" fill="#374151">model</tspan> unifies · <tspan font-family="ui-monospace, monospace" fill="#374151">Role</tspan> already exists on the BTree/HSM side</text>

  <!-- ─────────────── TODAY ─────────────── -->
  <text x="60" y="104" font-size="15" font-weight="700" fill="#334155">TODAY — four lists, each with its own rules</text>

  <g font-size="12.5">
    <!-- Parameters -->
    <rect x="60" y="120" width="400" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="76" y="142" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" fill="#1e40af">BlueprintAsset.Parameters</text>
    <text x="76" y="161" fill="#1e3a5f">AiPrimitive only · external input, per BTree-node instance</text>
    <text x="76" y="180" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">struct Params ← bb.BehaviorParameters[paramIndex]</text>

    <!-- WorkingState -->
    <rect x="60" y="208" width="400" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="76" y="230" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" fill="#92400e">BlueprintAsset.WorkingState</text>
    <text x="76" y="249" fill="#78350f">AiPrimitive only · private, persistent, per entity</text>
    <text x="76" y="268" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">struct WorkingState @ Blackboard1024+8 · __phase</text>

    <!-- Variables -->
    <rect x="60" y="296" width="400" height="76" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="76" y="318" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" fill="#065f46">BlueprintAsset.Variables</text>
    <text x="76" y="337" fill="#064e3b">Instance only · private, persistent, per entity</text>
    <text x="76" y="356" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">struct State · BlueprintLatentCursor Cursor</text>

    <!-- Locals -->
    <rect x="60" y="384" width="400" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="76" y="406" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" fill="#5b21b6">Graph.LocalVariables</text>
    <text x="76" y="425" fill="#4c1d95">any dispatch · per invocation · Batch 37</text>
    <text x="76" y="444" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">C# local · blackboard slot when the graph suspends</text>

    <!-- Graph.Inputs -->
    <rect x="60" y="472" width="400" height="62" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="76" y="494" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" fill="#334155">Graph.Inputs</text>
    <text x="76" y="513" fill="#475569">function parameters · <tspan font-style="italic">the fourth cell, already populated</tspan></text>
  </g>

  <!-- ⚠ callout -->
  <rect x="60" y="552" width="400" height="86" rx="8" fill="#fff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="76" y="574" font-size="13" font-weight="700" fill="#9f1239">⚠ Variables and WorkingState are the SAME concept</text>
  <text x="76" y="595" font-size="12.5" fill="#3f3f46">Both are private, persistent, per-entity storage carrying the</text>
  <text x="76" y="613" font-size="12.5" fill="#3f3f46">suspension bookkeeping (Cursor / __phase) plus the designer's</text>
  <text x="76" y="631" font-size="12.5" fill="#3f3f46">fields. Two names, one thing — kept apart only by a diagnostic.</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M466,158 C 560,158 590,196 636,196"/>
    <path d="M466,246 C 560,246 600,330 636,330"/>
    <path d="M466,334 C 540,334 600,338 636,338"/>
    <path d="M466,422 C 560,422 600,470 636,470"/>
    <path d="M466,500 C 540,500 590,250 636,250"/>
  </g>

  <!-- ─────────────── UNIFIED ─────────────── -->
  <text x="700" y="104" font-size="15" font-weight="700" fill="#334155">UNIFIED — one list, two tags per declaration</text>

  <!-- axis labels -->
  <text x="905" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Scope = Asset</text>
  <text x="1120" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Scope = Graph</text>
  <text x="676" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e" transform="rotate(-90 676 200)">Role = Input</text>
  <text x="676" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e" transform="rotate(-90 676 368)">Role = State</text>

  <!-- (Input, Asset) -->
  <rect x="700" y="152" width="410" height="0" fill="none"/>
  <rect x="700" y="152" width="205" height="96" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="716" y="176" font-size="13" font-weight="700" fill="#1e40af">Parameters</text>
  <text x="716" y="196" font-size="12" fill="#1e3a5f">the asset's input contract</text>
  <text x="716" y="215" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ struct Params</text>
  <text x="716" y="235" font-size="11.5" fill="#64748b">AiPrimitive only</text>

  <!-- (Input, Graph) -->
  <rect x="917" y="152" width="205" height="96" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="933" y="176" font-size="13" font-weight="700" fill="#334155">Graph inputs</text>
  <text x="933" y="196" font-size="12" fill="#475569">a function's parameters</text>
  <text x="933" y="215" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ method parameters</text>
  <text x="933" y="235" font-size="11.5" fill="#64748b">already exists · fold in later</text>

  <!-- (State, Asset) — the merge -->
  <rect x="700" y="264" width="205" height="140" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <path d="M700,300 L905,300" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="700" y="264" width="205" height="36" rx="8" fill="#fef3c7" stroke="none"/>
  <rect x="700" y="292" width="205" height="8" fill="#fef3c7" stroke="none"/>
  <text x="802" y="287" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">WorkingState  +  Variables</text>
  <text x="716" y="326" font-size="14" font-weight="700" fill="#065f46">⭐ ONE THING</text>
  <text x="716" y="347" font-size="12" fill="#064e3b">private persistent state</text>
  <text x="716" y="367" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ struct State  (Instance)</text>
  <text x="716" y="385" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ struct WorkingState  (AiPrim)</text>

  <!-- (State, Graph) -->
  <rect x="917" y="264" width="205" height="140" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="933" y="288" font-size="13" font-weight="700" fill="#5b21b6">Graph locals</text>
  <text x="933" y="308" font-size="12" fill="#4c1d95">reset per invocation</text>
  <text x="933" y="330" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ C# local</text>
  <text x="933" y="348" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">→ blackboard slot if it</text>
  <text x="933" y="366" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">   can suspend  (Q27-A3)</text>
  <text x="933" y="388" font-size="11.5" fill="#64748b">Batch 37 + 38</text>

  <!-- the role enum already exists -->
  <rect x="700" y="424" width="422" height="72" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="716" y="446" font-size="13" font-weight="700" fill="#155e75">⭐ Role is not a new abstraction</text>
  <text x="716" y="467" font-size="12" font-family="ui-monospace, monospace" fill="#164e63">enum BlackboardVariableRole { Input = 0, State = 1 }</text>
  <text x="716" y="486" font-size="12" fill="#155e75">already shipped in Hrot.AiEditor.Persistence, used by BTree/HSM</text>

  <!-- what happens to the rails -->
  <text x="700" y="530" font-size="14" font-weight="700" fill="#334155">What happens to the three dispatch rails</text>

  <g font-size="12.5">
    <rect x="700" y="544" width="422" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
    <text x="714" y="566" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#991b1b">BP1024</text>
    <text x="784" y="566" fill="#7f1d1d">AiPrimitive ≠ Variables — <tspan font-weight="700">DISAPPEARS</tspan>, it was pure naming</text>

    <rect x="700" y="586" width="422" height="34" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
    <text x="714" y="608" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#854d0e">BP1031</text>
    <text x="784" y="608" fill="#713f12">splits — half vanishes, half becomes "no Input channel"</text>

    <rect x="700" y="628" width="422" height="34" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
    <text x="714" y="650" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#14532d">BP1011</text>
    <text x="784" y="650" fill="#14532d">survives — Library genuinely has no Asset-scope storage</text>
  </g>

  <!-- BP-226 payoff -->
  <rect x="60" y="656" width="1062" height="58" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="78" y="679" font-size="13.5" font-weight="700" fill="#0f766e">⭐ BP-226 dissolves rather than being patched</text>
  <text x="78" y="701" font-size="12.5" fill="#334155">The finding asked for <tspan font-family="ui-monospace, monospace" fill="#0f766e">FindVariableIndex</tspan> to return a <tspan font-family="ui-monospace, monospace" fill="#0f766e">(storage-kind, index)</tspan> pair. With the tags on the declaration, the kind is what the declaration SAYS — the pair falls out instead of being bolted on.</text>

  <text x="640" y="748" text-anchor="middle" font-size="12.5" fill="#6b7280">⚠ The <tspan font-weight="700" fill="#374151">emission stays split</tspan> — the memory really is in two places (BTree parameter blob vs. blackboard). What goes away is the model pretending they are unrelated lists.</text>
  <text x="640" y="772" text-anchor="middle" font-size="12.5" fill="#6b7280">Staged A → B → C → D · every stage that does not touch the asset format lands first, so the JSON migration is the last and only variable.</text>
</svg>
