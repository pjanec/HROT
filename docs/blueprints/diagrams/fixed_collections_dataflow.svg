<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#f7f8fa"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Reading &amp; writing a collection in the graph — one pipeline, three emitted forms</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#6b7280">the graph is backing-agnostic; the emitted C# is chosen only at the final step, by the collection's kind</text>

  <!-- 1 source -->
  <rect x="24" y="110" width="196" height="150" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="122" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">source node</text>
  <line x1="38" y1="143" x2="206" y2="143" stroke="#c7d2fe"/>
  <text x="38" y="167" font-size="12" fill="#1e40af">GetComponent  (component)</text>
  <text x="38" y="187" font-size="12" fill="#5b21b6">GetVariable  (blueprint var)</text>
  <text x="38" y="215" font-size="11.5" fill="#374151">projects a collection</text>
  <text x="38" y="231" font-size="11.5" fill="#374151">out-pin (element-typed)</text>

  <!-- 2 out-pin -->
  <rect x="256" y="120" width="196" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="354" y="143" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">the out-pin carries</text>
  <line x1="270" y1="153" x2="438" y2="153" stroke="#e2e8f0"/>
  <text x="270" y="177" font-size="11.5" fill="#111827">the collection kind</text>
  <text x="270" y="197" font-size="11.5" fill="#374151">which backing to read</text>
  <text x="284" y="212" font-size="10.5" fill="#6b7280">(component type / var field)</text>
  <text x="270" y="232" font-size="11.5" fill="#374151">the element type</text>

  <!-- 3 node -->
  <rect x="488" y="96" width="210" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="593" y="119" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">consumer / mutation node</text>
  <line x1="502" y1="129" x2="684" y2="129" stroke="#e2e8f0"/>
  <text x="502" y="151" font-size="11.5" fill="#334155" font-weight="600">Read</text>
  <text x="502" y="168" font-size="11" fill="#374151">ForEach · ItemGet · ItemCount</text>
  <text x="502" y="183" font-size="11" fill="#374151">Contains · Find</text>
  <text x="502" y="209" font-size="11.5" fill="#334155" font-weight="600">Write</text>
  <text x="502" y="226" font-size="11" fill="#374151">Add · Set · InsertAt</text>
  <text x="502" y="241" font-size="11" fill="#374151">RemoveAt · Clear · Resize</text>
  <text x="502" y="263" font-size="10.5" fill="#6b7280">identical regardless of backing</text>

  <!-- 4 switch -->
  <rect x="734" y="130" width="150" height="110" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="809" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">compiler emit</text>
  <line x1="748" y1="168" x2="870" y2="168" stroke="#fed7aa"/>
  <text x="809" y="192" text-anchor="middle" font-size="11.5" fill="#111827">picks the form</text>
  <text x="809" y="210" text-anchor="middle" font-size="11.5" fill="#111827">by the</text>
  <text x="809" y="226" text-anchor="middle" font-size="11.5" fill="#9a3412">collection kind</text>

  <line x1="220" y1="185" x2="254" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="452" y1="185" x2="486" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="698" y1="185" x2="732" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 5 three emitted forms -->
  <rect x="918" y="86" width="266" height="82" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="932" y="107" font-size="12" font-weight="700" fill="#1e40af">component, curated accessors</text>
  <text x="932" y="128" font-size="11" font-family="ui-monospace, monospace" fill="#374151">Ops.Count(comp)</text>
  <text x="932" y="145" font-size="11" font-family="ui-monospace, monospace" fill="#374151">Ops.Item(comp, i)</text>
  <text x="932" y="161" font-size="10.5" fill="#6b7280">unmanaged component with a fixed buffer</text>

  <rect x="918" y="180" width="266" height="82" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="932" y="201" font-size="12" font-weight="700" fill="#1e40af">managed component member</text>
  <text x="932" y="222" font-size="11" font-family="ui-monospace, monospace" fill="#374151">list?.Count ?? 0</text>
  <text x="932" y="239" font-size="11" font-family="ui-monospace, monospace" fill="#374151">list![i]</text>
  <text x="932" y="255" font-size="10.5" fill="#6b7280">a List/IReadOnlyList/array field on a class</text>

  <rect x="918" y="274" width="266" height="82" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="932" y="295" font-size="12" font-weight="700" fill="#5b21b6">blueprint variable field</text>
  <text x="932" y="316" font-size="11" font-family="ui-monospace, monospace" fill="#374151">state.field.Count</text>
  <text x="932" y="333" font-size="11" font-family="ui-monospace, monospace" fill="#374151">state.field.Items[i]</text>
  <text x="932" y="349" font-size="10.5" fill="#6b7280">a fixed-list field in the blackboard state</text>

  <line x1="884" y1="185" x2="914" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="884" y1="185" x2="914" y2="221" stroke="#64748b" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="884" y1="185" x2="914" y2="315" stroke="#64748b" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- write note -->
  <rect x="24" y="330" width="860" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="354" font-size="12.5" font-weight="700" fill="#9a3412">Writes happen in place — never a whole-array copy.</text>
  <text x="40" y="376" font-size="12" fill="#374151"><tspan font-family="ui-monospace, monospace" fill="#111827">Add</tspan> → <tspan font-family="ui-monospace, monospace" fill="#111827">Items[Count++] = v;</tspan> against the live component or blackboard field, by ref.</text>
  <text x="40" y="393" font-size="11.5" fill="#6b7280">Overflow returns false with a diagnostic — never silent, never out of bounds (length is clamped to the capacity).</text>

  <!-- action aside -->
  <rect x="24" y="430" width="1160" height="86" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="454" font-size="12.5" font-weight="700" fill="#92400e">A behavior action's own collection skips this pipeline.</text>
  <text x="40" y="476" font-size="12" fill="#374151">The action holds it as a plain struct field and mutates it directly by ref: <tspan font-family="ui-monospace, monospace" fill="#111827">p.field.Items[i] = x;</tspan> — no nodes, no emit step.</text>
  <text x="40" y="497" font-size="11.5" fill="#6b7280">Same collection shape, a different consumer — C# instead of the blueprint graph.</text>

  <text x="600" y="556" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">The nodes, pins, and wiring are the same for every backing.</text>
  <text x="600" y="577" text-anchor="middle" font-size="12.5" fill="#374151">Only the final emitted expression differs — the graph author never sees which backing it is.</text>
</svg>
