<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .h1 { font-size:15px; fill:#1b1f24; font-weight:700; }
    .h2 { font-size:11.5px; fill:#ffffff; font-weight:700; letter-spacing:.3px; }
    .t  { font-size:11.5px; fill:#1b1f24; }
    .tb { font-size:11.5px; fill:#1b1f24; font-weight:600; }
    .s  { font-size:10px; fill:#57606a; }
    .m  { font-size:10.5px; fill:#0a3069; font-family:ui-monospace, Consolas, monospace; }
    .built { fill:#e9f5e9; stroke:#4a8a3c; stroke-width:1.4; rx:4; }
    .gap   { fill:#fff4e0; stroke:#bf8700; stroke-width:1.6; stroke-dasharray:5 3; rx:4; }
    .box   { fill:#ffffff; stroke:#8c959f; stroke-width:1.1; rx:4; }
    .in    { fill:#eef4fb; stroke:#2f6fbf; stroke-width:1.4; rx:4; }
    .st    { fill:#e9f5e9; stroke:#4a8a3c; stroke-width:1.4; rx:4; }
    .arr { stroke:#57606a; stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>

  <text x="16" y="24" class="h1">How inputs are supplied — tactical intent to blackboard bytes</text>
  <text x="16" y="42" class="s">Solid green = shipped. Dashed amber = designed, NOT built (Behavior_Parameter_Resolver_Detailed_Design §7, gaps G1–G7).</text>

  <!-- CHAIN -->
  <rect x="16" y="58" width="188" height="62" class="built"/>
  <text x="24" y="76" class="tb">Commander BTree</text>
  <text x="24" y="92" class="s">decides an intent for a</text>
  <text x="24" y="106" class="s">subordinate entity</text>

  <path class="arr" d="M208 89 L246 89"/>

  <rect x="250" y="58" width="230" height="62" class="built"/>
  <text x="258" y="76" class="tb">AssignTacticalIntentEvent</text>
  <text x="258" y="92" class="m">{ Entity, IntentId, JsonParams }</text>
  <text x="258" y="108" class="s">MissionAdapterSystem raises it</text>

  <path class="arr" d="M484 89 L522 89"/>

  <rect x="526" y="58" width="222" height="62" class="built"/>
  <text x="534" y="76" class="tb">TacticalIntentResolutionSystem</text>
  <text x="534" y="92" class="s">ITacticalOrderMapper.TryMap</text>
  <text x="534" y="108" class="s">optional intent → behavior translation</text>

  <path class="arr" d="M752 89 L790 89"/>

  <rect x="794" y="58" width="190" height="62" class="built"/>
  <text x="802" y="76" class="tb">AssignBehaviorEvent</text>
  <text x="802" y="92" class="m">{ BehaviorName, JsonParams }</text>
  <text x="802" y="108" class="s">name is the stable identity</text>

  <path class="arr" d="M889 124 L889 150 L500 150 L500 172"/>

  <!-- INGRESS -->
  <rect x="16" y="176" width="968" height="216" class="box"/>
  <rect x="16" y="176" width="968" height="18" fill="#57606a" rx="4"/>
  <text x="24" y="189" class="h2">BehaviorIngressSystem — ONE pass, ONE event. Assignment ≡ activation, so this runs exactly once per behavior lifetime.</text>

  <rect x="28" y="204" width="228" height="88" class="built"/>
  <text x="36" y="221" class="tb">1 · auto-deserialize</text>
  <text x="36" y="238" class="s">scenario/mission JSON → the</text>
  <text x="36" y="252" class="s">authored DTO (transient buffer)</text>
  <text x="36" y="272" class="s">editor defaults applied first,</text>
  <text x="36" y="286" class="tb">then JSON overlays — runtime wins</text>

  <rect x="266" y="204" width="228" height="88" class="gap"/>
  <text x="274" y="221" class="tb">2 · resolver runs once</text>
  <text x="274" y="238" class="s">authored shape → usable shape</text>
  <text x="274" y="252" class="s">geo→cartesian, netId→Entity,</text>
  <text x="274" y="266" class="s">derived fields. Identity by default.</text>
  <text x="274" y="286" class="s">⚠ today fused into ParseParams</text>

  <rect x="504" y="204" width="228" height="88" class="built"/>
  <text x="512" y="221" class="tb">3 · commit BehaviorState</text>
  <text x="512" y="238" class="s">active behavior, instance id, tier</text>
  <text x="512" y="262" class="s">⭐ steps 1–2 run BEFORE this, so a</text>
  <text x="512" y="276" class="s">parse failure leaves the entity 100%</text>
  <text x="512" y="290" class="s">on its old behavior (DEBT-035)</text>

  <rect x="742" y="204" width="230" height="88" class="built"/>
  <text x="750" y="221" class="tb">4 · provision + zero-init</text>
  <text x="750" y="238" class="s">ProvisionStatefulSlots reserves the</text>
  <text x="750" y="252" class="s">Role=State partitions and zeroes them</text>
  <text x="750" y="276" class="s">Scope decides the slot key:</text>
  <text x="750" y="290" class="s">Node / Behavior / Entity</text>

  <path class="arr" d="M142 300 L142 326"/>
  <path class="arr" d="M380 300 L380 326"/>
  <path class="arr" d="M857 300 L857 326"/>

  <rect x="28" y="330" width="466" height="50" class="in"/>
  <text x="36" y="348" class="tb">⇒ BrainBlackboard.BehaviorParameters — the Role=Input bytes</text>
  <text x="36" y="366" class="m">def.ParseParams(evt.JsonParams, dst, repo, evt.Entity)   // one production call site</text>

  <rect x="742" y="330" width="230" height="50" class="st"/>
  <text x="750" y="348" class="tb">⇒ the State partitions</text>
  <text x="750" y="366" class="s">Blackboard1024 / tiered blueprint slots</text>

  <!-- FOOTER -->
  <rect x="16" y="400" width="968" height="124" class="box"/>
  <rect x="16" y="400" width="968" height="18" fill="#bf8700" rx="4"/>
  <text x="24" y="413" class="h2">WHAT IS ALREADY TRUE, AND OFTEN MISSED</text>

  <text x="28" y="440" class="tb">The role enum has no "Param".</text>
  <text x="220" y="440" class="t">{ Input, State } only — Input IS the parameter role. There is nothing to unify at the model level.</text>

  <text x="28" y="462" class="tb">BTree/HSM already author multi-field variables.</text>
  <text x="308" y="462" class="t">VariablesPanelControl draws live Role/Scope combos; .btree.json carries "Role":"State","Scope":"Behavior".</text>

  <text x="28" y="484" class="tb">Blueprints cannot edit Role/Scope.</text>
  <text x="248" y="484" class="t">Ruled read-only for them (Q-k) — a blueprint's DeclarationKind already fixes the role. That is the asymmetry.</text>

  <text x="28" y="506" class="tb">A single struct-typed input is the degenerate case,</text>
  <text x="330" y="506" class="t">not a different model: one Role=Input variable whose type is a discovered [BlackboardDtoStruct].</text>
</svg>
