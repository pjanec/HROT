<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="420" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Ghost Promotion — Never Touch a Half-Built Entity</text>
<text x="40" y="68" font-size="14" fill="#6B7280">On a node that doesn't own it, a replica appears as a ghost and only activates once fully hydrated.</text><g filter="url(#soft)"><rect x="80" y="140" width="180" height="120" rx="12" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.7"/></g><text x="170" y="172" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Ghost</text><text x="170" y="200" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">bare shell</text><text x="170" y="224" font-size="10.5" fill="#6B7280" text-anchor="middle">tagged as ghost</text><text x="170" y="242" font-size="10.5" fill="#6B7280" text-anchor="middle">components not yet arrived</text><g filter="url(#soft)"><rect x="380" y="140" width="180" height="120" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="470" y="172" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Constructing</text><text x="470" y="200" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">promoting</text><text x="470" y="224" font-size="10.5" fill="#6B7280" text-anchor="middle">all mandatory</text><text x="470" y="242" font-size="10.5" fill="#6B7280" text-anchor="middle">components arrived</text><g filter="url(#soft)"><rect x="680" y="140" width="180" height="120" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="770" y="172" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Active</text><text x="770" y="200" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">live entity</text><text x="770" y="224" font-size="10.5" fill="#6B7280" text-anchor="middle">systems operate</text><text x="770" y="242" font-size="10.5" fill="#6B7280" text-anchor="middle">on it normally</text><line x1="260" y1="200" x2="380" y2="200" stroke="#C7A98C" stroke-width="2.6" marker-end="url(#ar)"/><text x="320" y="190" font-size="9.5" fill="#9b7d5e" font-weight="600" text-anchor="middle">all mandatory</text><text x="320" y="216" font-size="9.5" fill="#9b7d5e" text-anchor="middle">components in</text><line x1="560" y1="200" x2="680" y2="200" stroke="#C7A98C" stroke-width="2.6" marker-end="url(#ar)"/><text x="620" y="190" font-size="9.5" fill="#9b7d5e" font-weight="600" text-anchor="middle">materialize</text><g filter="url(#soft)"><rect x="80" y="300" width="500" height="84" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="330" y="328" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Why staged states matter</text><text x="330" y="352" font-size="11" fill="#6B7280" text-anchor="middle">A replica may learn about an entity before all its data arrives.</text><text x="330" y="371" font-size="11" fill="#6B7280" text-anchor="middle">Staging guarantees local systems only ever see complete entities.</text><g filter="url(#soft)"><rect x="600" y="300" width="260" height="84" rx="11" fill="#E8CFC9" stroke="#B5796B" stroke-width="1.4"/></g><text x="730" y="328" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Stale ghosts</text><text x="730" y="352" font-size="10.5" fill="#7a4f44" text-anchor="middle">no longer heard from →</text><text x="730" y="371" font-size="10.5" fill="#7a4f44" text-anchor="middle">timed out &amp; removed</text></svg>