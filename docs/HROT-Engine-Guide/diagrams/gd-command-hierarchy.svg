<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="440" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Command Hierarchy — Intent to Units</text>
<text x="40" y="68" font-size="14" fill="#6B7280">A commander broadcasts high-level tactical intent; mappers resolve it to concrete per-unit behavior by entity type.</text><g filter="url(#soft)"><rect x="360" y="110" width="200" height="70" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="460" y="138" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Commander</text><text x="460" y="160" font-size="10" fill="#7a4f6a" text-anchor="middle">broadcasts tactical intent</text><g filter="url(#soft)"><rect x="310" y="210" width="300" height="56" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="460" y="234" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Intent mapper</text><text x="460" y="253" font-size="10" fill="#6e5836" text-anchor="middle">resolves intent → behavior per type</text><line x1="460" y1="180" x2="460" y2="210" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><text x="560" y="200" font-size="10" fill="#9b7d5e" font-style="italic" text-anchor="start">"hull-down attack"</text><g filter="url(#soft)"><rect x="80" y="310" width="200" height="80" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="180" y="338" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Tank platoon</text><text x="180" y="360" font-size="10" fill="#6B7280" text-anchor="middle">→ hull-down positions</text><line x1="180" y1="310" x2="460" y2="266" stroke="#9AA3B0" stroke-width="1.1"/><g filter="url(#soft)"><rect x="360" y="310" width="200" height="80" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="460" y="338" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Infantry squad</text><text x="460" y="360" font-size="10" fill="#6B7280" text-anchor="middle">→ dismount &amp; assault</text><line x1="460" y1="310" x2="460" y2="266" stroke="#9AA3B0" stroke-width="1.1"/><g filter="url(#soft)"><rect x="640" y="310" width="200" height="80" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="740" y="338" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Recon element</text><text x="740" y="360" font-size="10" fill="#6B7280" text-anchor="middle">→ screen &amp; observe</text><line x1="740" y1="310" x2="460" y2="266" stroke="#9AA3B0" stroke-width="1.1"/><text x="460" y="420" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">Mapping respects entity type — a hull-down attack maps only to entities that can do it.</text></svg>