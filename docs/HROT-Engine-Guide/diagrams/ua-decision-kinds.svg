<rect width="920" height="470" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Utility AI — Four Decision Kinds</text>
<text x="40" y="68" font-size="14" fill="#6B7280">One scoring core, four jobs. Spatial candidate selection stays with EQS; Utility AI reads its results.</text><g filter="url(#soft)"><rect x="360" y="200" width="200" height="80" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="460" y="232" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Scoring core</text><text x="460" y="254" font-size="10.5" fill="#7a4f6a" text-anchor="middle">consideration → curve</text><text x="460" y="270" font-size="10.5" fill="#7a4f6a" text-anchor="middle">→ weight → aggregate</text><g filter="url(#soft)"><rect x="60" y="110" width="200" height="92" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="160" y="138" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Threat ranking</text><text x="160" y="160" font-size="10.3" fill="#46566e" text-anchor="middle">who to eliminate first</text><text x="160" y="182" font-size="10" fill="#46566e" font-style="italic" text-anchor="middle">dynamic list → ranked</text><g filter="url(#soft)"><rect x="660" y="110" width="200" height="92" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="760" y="138" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Weapon selection</text><text x="760" y="160" font-size="10.3" fill="#46566e" text-anchor="middle">which weapon for target</text><text x="760" y="182" font-size="10" fill="#46566e" font-style="italic" text-anchor="middle">dynamic list → ranked</text><g filter="url(#soft)"><rect x="60" y="300" width="200" height="92" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="160" y="328" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Combat posture</text><text x="160" y="350" font-size="10.3" fill="#4f5d44" text-anchor="middle">advance/cover/suppress/flee/hold</text><text x="160" y="372" font-size="10" fill="#4f5d44" font-style="italic" text-anchor="middle">fixed set → 1 winner</text><g filter="url(#soft)"><rect x="660" y="300" width="200" height="92" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="760" y="328" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Group fire</text><text x="760" y="350" font-size="10.3" fill="#4f5d44" text-anchor="middle">squad focus-fire</text><text x="760" y="372" font-size="10" fill="#4f5d44" font-style="italic" text-anchor="middle">leader assignment</text><line x1="260" y1="150" x2="360" y2="215" stroke="#C7A98C" stroke-width="2" marker-end="url(#ar)"/><line x1="660" y1="150" x2="560" y2="215" stroke="#C7A98C" stroke-width="2" marker-end="url(#ar)"/><line x1="260" y1="346" x2="360" y2="265" stroke="#C7A98C" stroke-width="2" marker-end="url(#ar)"/><line x1="660" y1="346" x2="560" y2="265" stroke="#C7A98C" stroke-width="2" marker-end="url(#ar)"/><g filter="url(#soft)"><rect x="360" y="330" width="200" height="70" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="356" font-size="12" fill="#3A4250" font-weight="700" text-anchor="middle">reads EQS result</text><text x="460" y="376" font-size="10.3" fill="#6B7280" text-anchor="middle">as one consideration</text><text x="460" y="391" font-size="10.3" fill="#6B7280" text-anchor="middle">(cover, retreat scores)</text><line x1="460" y1="330" x2="460" y2="280" stroke="#C7A98C" stroke-width="2" marker-end="url(#ar)"/></svg>