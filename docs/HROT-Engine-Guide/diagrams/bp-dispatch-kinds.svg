<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="450" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Blueprints — Three Dispatch Kinds</text>
<text x="40" y="68" font-size="14" fill="#6B7280">One visual scripting system, three runtime shapes. A primitive can be a tree leaf; an instance is a stateful actor.</text><g filter="url(#soft)"><rect x="60" y="110" width="250" height="210" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="185" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">AiPrimitive</text><circle cx="88" cy="168" r="3" fill="#5B7BA6"/><text x="102" y="172" font-size="11" fill="#46566e" text-anchor="start">single action or condition</text><circle cx="88" cy="198" r="3" fill="#5B7BA6"/><text x="102" y="202" font-size="11" fill="#46566e" text-anchor="start">params + working state</text><circle cx="88" cy="228" r="3" fill="#5B7BA6"/><text x="102" y="232" font-size="11" fill="#46566e" text-anchor="start">hosts as a BTree leaf</text><circle cx="88" cy="258" r="3" fill="#5B7BA6"/><text x="102" y="262" font-size="11" fill="#46566e" text-anchor="start">or HSM activity / guard</text><g filter="url(#soft)"><rect x="335" y="110" width="250" height="210" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="460" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Instance</text><circle cx="363" cy="168" r="3" fill="#7A916A"/><text x="377" y="172" font-size="11" fill="#4f5d44" text-anchor="start">full stateful actor</text><circle cx="363" cy="198" r="3" fill="#7A916A"/><text x="377" y="202" font-size="11" fill="#4f5d44" text-anchor="start">persistent variables</text><circle cx="363" cy="228" r="3" fill="#7A916A"/><text x="377" y="232" font-size="11" fill="#4f5d44" text-anchor="start">events + handlers</text><circle cx="363" cy="258" r="3" fill="#7A916A"/><text x="377" y="262" font-size="11" fill="#4f5d44" text-anchor="start">latent (coroutine) execution</text><g filter="url(#soft)"><rect x="610" y="110" width="250" height="210" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="735" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Library</text><circle cx="638" cy="168" r="3" fill="#B08C5E"/><text x="652" y="172" font-size="11" fill="#6e5836" text-anchor="start">reusable static functions</text><circle cx="638" cy="198" r="3" fill="#B08C5E"/><text x="652" y="202" font-size="11" fill="#6e5836" text-anchor="start">no state, no events</text><circle cx="638" cy="228" r="3" fill="#B08C5E"/><text x="652" y="232" font-size="11" fill="#6e5836" text-anchor="start">pure / shared logic</text><circle cx="638" cy="258" r="3" fill="#B08C5E"/><text x="652" y="262" font-size="11" fill="#6e5836" text-anchor="start">called by the other two</text><g filter="url(#soft)"><rect x="60" y="340" width="800" height="80" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="366" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Complementary, not competing</text><text x="460" y="390" font-size="11" fill="#6B7280" text-anchor="middle">An AiPrimitive Blueprint wires directly as a BTree leaf or HSM activity — visual scripting inside a tree-structured control policy.</text><text x="460" y="408" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">Use trees for control flow, Blueprints for custom logic and glue.</text></svg>