<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="420" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Flight Recorder — Cheap, Exact Capture</text>
<text x="40" y="68" font-size="14" fill="#6B7280">Reflection-free memory copy, keyframe+delta, async compression. The loop never waits on the disk.</text><g filter="url(#soft)"><rect x="60" y="120" width="200" height="96" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="160" y="150" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Live world</text><text x="160" y="174" font-size="10.5" fill="#46566e" text-anchor="middle">changed memory</text><text x="160" y="194" font-size="10.5" fill="#46566e" text-anchor="middle">+ event streams</text><g filter="url(#soft)"><rect x="290" y="120" width="200" height="96" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="390" y="150" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Capture</text><text x="390" y="174" font-size="10.5" fill="#4f5d44" text-anchor="middle">copy changed pages</text><text x="390" y="194" font-size="10.5" fill="#4f5d44" text-anchor="middle">skip unchanged blocks</text><g filter="url(#soft)"><rect x="520" y="120" width="200" height="96" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="620" y="150" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Async I/O</text><text x="620" y="174" font-size="10.5" fill="#6e5836" text-anchor="middle">background thread</text><text x="620" y="194" font-size="10.5" fill="#6e5836" text-anchor="middle">LZ4 + write</text><line x1="260" y1="168" x2="290" y2="168" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><line x1="490" y1="168" x2="520" y2="168" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><g filter="url(#soft)"><path d="M750,120 h90 a8,8 0 0 1 8,8 v80 a8,8 0 0 1 -8,8 h-90 a8,8 0 0 1 -8,-8 v-80 a8,8 0 0 1 8,-8 z" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.7"/></g><text x="795" y="152" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">.fdp</text><text x="795" y="174" font-size="10" fill="#6B7280" text-anchor="middle">+ schema</text><text x="795" y="188" font-size="10" fill="#6B7280" text-anchor="middle">manifest</text><line x1="720" y1="168" x2="742" y2="168" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><g filter="url(#soft)"><rect x="60" y="272" width="800" height="108" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="300" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Schema-hash guard — why replays are trustworthy</text><text x="460" y="326" font-size="11.5" fill="#6B7280" text-anchor="middle">Each recording stores a hash of every component's exact memory layout.</text><text x="460" y="346" font-size="11.5" fill="#6B7280" text-anchor="middle">On playback, the live layout is validated against the recording —</text><text x="460" y="366" font-size="11.5" fill="#6B7280" text-anchor="middle">playback aborts on drift, so analysis is never silently corrupt.</text></svg>