<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="420" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Two Egress Strategies</text>
<text x="40" y="68" font-size="14" fill="#6B7280">How owned state is published depends on how it changes. Both avoid sending data nobody needs.</text><g filter="url(#soft)"><rect x="60" y="120" width="380" height="200" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="250" y="150" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">SmartEgress</text><text x="250" y="172" font-size="10.5" fill="#46566e" font-style="italic" text-anchor="middle">for low-frequency state</text><text x="250" y="196" font-size="10.5" fill="#46566e" text-anchor="middle">mission · weapon · ownership</text><rect x="84" y="212" width="332" height="92" rx="8" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1.2"/><text x="250" y="234" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">O(1) dirty-flag check</text><text x="250" y="256" font-size="10.3" fill="#46566e" text-anchor="middle">a value is published only when</text><text x="250" y="272" font-size="10.3" fill="#46566e" text-anchor="middle">it's explicitly marked changed</text><text x="250" y="294" font-size="10" fill="#5B7BA6" font-style="italic" text-anchor="middle">cheap · event-driven</text><g filter="url(#soft)"><rect x="480" y="120" width="380" height="200" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="670" y="150" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Shadow-state</text><text x="670" y="172" font-size="10" fill="#4f5d44" font-style="italic" text-anchor="middle">for high-frequency kinematics (60 Hz)</text><text x="670" y="196" font-size="10.5" fill="#4f5d44" text-anchor="middle">position · velocity</text><rect x="504" y="212" width="332" height="92" rx="8" fill="#EAF0E3" stroke="#7A916A" stroke-width="1.2"/><text x="670" y="234" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">compare against a shadow copy</text><text x="670" y="256" font-size="10.3" fill="#4f5d44" text-anchor="middle">publish only past a delta threshold;</text><text x="670" y="272" font-size="10.3" fill="#4f5d44" text-anchor="middle">salted heartbeat refreshes periodically</text><text x="670" y="294" font-size="10" fill="#7A916A" font-style="italic" text-anchor="middle">bandwidth-aware · self-correcting</text><text x="460" y="360" font-size="11.5" fill="#6B7280" font-style="italic" text-anchor="middle">Low-frequency data shouldn't poll; high-frequency data shouldn't flood. Each strategy fits its data's rhythm.</text></svg>