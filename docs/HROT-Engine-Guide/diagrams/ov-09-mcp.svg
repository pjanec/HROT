<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="440" fill="#F7F8FA"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">AI Control via MCP — Drive &amp; Diagnose the Sim</text>
  <text x="40" y="68" font-size="14" fill="#6B7280">An AI agent drives the simulation through tools. Safety lives in the API; the MCP server stays a thin relay.</text>

  <!-- AI agent -->
  <g filter="url(#soft)"><rect x="60" y="160" width="160" height="100" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.8"/></g>
  <text x="140" y="200" font-size="15" font-weight="700" fill="#3A4250" text-anchor="middle">AI agent</text>
  <text x="140" y="224" font-size="11" fill="#7a4f6a" text-anchor="middle">coding agent</text>
  <text x="140" y="240" font-size="11" fill="#7a4f6a" text-anchor="middle">calls tools</text>

  <!-- MCP server -->
  <g filter="url(#soft)"><rect x="300" y="160" width="180" height="100" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.8"/></g>
  <text x="390" y="196" font-size="15" font-weight="700" fill="#3A4250" text-anchor="middle">MCP server</text>
  <text x="390" y="218" font-size="10.5" fill="#6e5836" text-anchor="middle">Node.js · thin relay</text>
  <text x="390" y="234" font-size="10.5" fill="#6e5836" text-anchor="middle">1:1 tool → endpoint</text>
  <text x="390" y="250" font-size="10.5" fill="#6e5836" text-anchor="middle">manages runner lifecycle</text>

  <!-- debug API inside runner -->
  <g filter="url(#soft)"><rect x="560" y="130" width="300" height="180" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.8"/></g>
  <text x="710" y="158" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">ClusterRunner (editor mode)</text>
  <text x="710" y="176" font-size="10.5" font-style="italic" fill="#5B7BA6" text-anchor="middle">single process · one shared world</text>
  <g><rect x="582" y="190" width="256" height="34" rx="7" fill="#DEE7F1" stroke="#88A2C4" stroke-width="1.2"/></g>
  <text x="710" y="212" font-size="11.5" font-weight="600" fill="#3A4250" text-anchor="middle">HTTP/JSON debug API — owns safety</text>
  <g><rect x="582" y="232" width="256" height="62" rx="7" fill="#EAEFF6" stroke="#A6B7CF" stroke-width="1.1"/></g>
  <text x="710" y="252" font-size="10.5" fill="#46566e" text-anchor="middle">wait-gating · main-thread marshalling</text>
  <text x="710" y="270" font-size="10.5" fill="#46566e" text-anchor="middle">Simulation world (ECS)</text>
  <text x="710" y="286" font-size="10.5" font-style="italic" fill="#5B7BA6" text-anchor="middle">inspect · control · experiment</text>

  <!-- arrows -->
  <line x1="220" y1="210" x2="300" y2="210" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a9)"/>
  <text x="260" y="200" font-size="10" font-weight="600" fill="#9b7d5e" text-anchor="middle">MCP</text>
  <line x1="480" y1="210" x2="560" y2="210" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a9)"/>
  <text x="520" y="200" font-size="10" font-weight="600" fill="#9b7d5e" text-anchor="middle">HTTP</text>

  <!-- tool groups footer -->
  <g><rect x="60" y="330" width="250" height="74" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.3"/></g>
  <text x="185" y="354" font-size="12.5" font-weight="700" fill="#3A4250" text-anchor="middle">Inspect</text>
  <text x="185" y="375" font-size="10" fill="#6B7280" text-anchor="middle">entities · events · logs</text>
  <text x="185" y="390" font-size="10" fill="#6B7280" text-anchor="middle">AI behavior traces</text>

  <g><rect x="335" y="330" width="250" height="74" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.3"/></g>
  <text x="460" y="354" font-size="12.5" font-weight="700" fill="#3A4250" text-anchor="middle">Control</text>
  <text x="460" y="375" font-size="10" fill="#6B7280" text-anchor="middle">play/pause/step · time scale</text>
  <text x="460" y="390" font-size="10" fill="#6B7280" text-anchor="middle">load/save · spawn · command</text>

  <g><rect x="610" y="330" width="250" height="74" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.3"/></g>
  <text x="735" y="354" font-size="12.5" font-weight="700" fill="#3A4250" text-anchor="middle">Experiment</text>
  <text x="735" y="375" font-size="10" fill="#6B7280" text-anchor="middle">data breakpoints · checkpoint</text>
  <text x="735" y="390" font-size="10" fill="#6B7280" text-anchor="middle">diff · record</text>
</svg>
