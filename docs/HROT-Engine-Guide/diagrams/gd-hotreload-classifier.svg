<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="400" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Hot-Reload — The Change Classifier</text>
<text x="40" y="68" font-size="14" fill="#6B7280">On reload, the change is graded; the grade decides how much running state survives the swap.</text><g filter="url(#soft)"><rect x="60" y="120" width="250" height="130" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="185" y="150" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Cosmetic</text><text x="185" y="178" font-size="11" fill="#4f5d44" font-style="italic" text-anchor="middle">layout / labels</text><text x="185" y="204" font-size="11" fill="#4f5d44" text-anchor="middle">state fully preserved</text><text x="185" y="224" font-size="11" fill="#4f5d44" text-anchor="middle">no entity impact</text><g filter="url(#soft)"><rect x="335" y="120" width="250" height="130" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="460" y="150" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Soft</text><text x="460" y="178" font-size="11" fill="#6e5836" font-style="italic" text-anchor="middle">logic tweak</text><text x="460" y="204" font-size="11" fill="#6e5836" text-anchor="middle">running state migrated</text><text x="460" y="224" font-size="11" fill="#6e5836" text-anchor="middle">entities keep going</text><g filter="url(#soft)"><rect x="610" y="120" width="250" height="130" rx="12" fill="#E8CFC9" stroke="#B5796B" stroke-width="1.7"/></g><text x="735" y="150" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Hard</text><text x="735" y="178" font-size="11" fill="#7a4f44" font-style="italic" text-anchor="middle">structural change</text><text x="735" y="204" font-size="11" fill="#7a4f44" text-anchor="middle">state can't be kept</text><text x="735" y="224" font-size="11" fill="#7a4f44" text-anchor="middle">entities re-initialized</text><g filter="url(#soft)"><rect x="60" y="288" width="800" height="84" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="314" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">The 60 Hz loop never stalls</text><text x="460" y="338" font-size="11" fill="#6B7280" text-anchor="middle">Heavy compile work runs on a background thread.</text><text x="460" y="357" font-size="11" fill="#6B7280" text-anchor="middle">Only an atomic pointer swap touches the main thread — applied at a safe frame boundary.</text></svg>