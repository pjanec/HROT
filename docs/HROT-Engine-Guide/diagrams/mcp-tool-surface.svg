<text x="40" y="68" font-size="14" fill="#6B7280">Three families of tools over one shared simulation world. Discovery tools let the agent learn the surface, then act.</text><g filter="url(#soft)"><rect x="60" y="110" width="250" height="250" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="185" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Inspect</text><circle cx="88" cy="168" r="3" fill="#5B7BA6"/><text x="102" y="172" font-size="11.5" fill="#46566e" text-anchor="start">list / dump entities</text><circle cx="88" cy="200" r="3" fill="#5B7BA6"/><text x="102" y="204" font-size="11.5" fill="#46566e" text-anchor="start">component-type discovery</text><circle cx="88" cy="232" r="3" fill="#5B7BA6"/><text x="102" y="236" font-size="11.5" fill="#46566e" text-anchor="start">event history</text><circle cx="88" cy="264" r="3" fill="#5B7BA6"/><text x="102" y="268" font-size="11.5" fill="#46566e" text-anchor="start">logs</text><circle cx="88" cy="296" r="3" fill="#5B7BA6"/><text x="102" y="300" font-size="11.5" fill="#46566e" text-anchor="start">AI behavior traces</text><g filter="url(#soft)"><rect x="335" y="110" width="250" height="250" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="460" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Control</text><circle cx="363" cy="168" r="3" fill="#7A916A"/><text x="377" y="172" font-size="11.5" fill="#4f5d44" text-anchor="start">play / pause / step</text><circle cx="363" cy="200" r="3" fill="#7A916A"/><text x="377" y="204" font-size="11.5" fill="#4f5d44" text-anchor="start">time scale</text><circle cx="363" cy="232" r="3" fill="#7A916A"/><text x="377" y="236" font-size="11.5" fill="#4f5d44" text-anchor="start">scenario load / save</text><circle cx="363" cy="264" r="3" fill="#7A916A"/><text x="377" y="268" font-size="11.5" fill="#4f5d44" text-anchor="start">spawn entity</text><circle cx="363" cy="296" r="3" fill="#7A916A"/><text x="377" y="300" font-size="11.5" fill="#4f5d44" text-anchor="start">generic commands</text><g filter="url(#soft)"><rect x="610" y="110" width="250" height="250" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="735" y="140" font-size="16" fill="#3A4250" font-weight="700" text-anchor="middle">Experiment</text><circle cx="638" cy="168" r="3" fill="#A86F8C"/><text x="652" y="172" font-size="11.5" fill="#7a4f6a" text-anchor="start">data-condition breakpoints</text><circle cx="638" cy="200" r="3" fill="#A86F8C"/><text x="652" y="204" font-size="11.5" fill="#7a4f6a" text-anchor="start">checkpoint / restore</text><circle cx="638" cy="232" r="3" fill="#A86F8C"/><text x="652" y="236" font-size="11.5" fill="#7a4f6a" text-anchor="start">diff world state</text><circle cx="638" cy="264" r="3" fill="#A86F8C"/><text x="652" y="268" font-size="11.5" fill="#7a4f6a" text-anchor="start">record runs</text><g filter="url(#soft)"><rect x="60" y="378" width="800" height="40" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="403" font-size="11.5" fill="#6B7280" font-style="italic" text-anchor="middle">Safety lives in the API (wait-gating · main-thread marshalling) — the MCP server is a thin relay. Scope: single-process editor.</text></svg>