<rect width="920" height="460" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">The Entity-as-Topics Model</text>
<text x="40" y="68" font-size="14" fill="#6B7280">An entity is not one network object. It's a set of independent descriptor topics sharing one key; ownership is per descriptor.</text><g filter="url(#soft)"><rect x="60" y="108" width="800" height="40" rx="10" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="133" font-size="12" fill="#6B7280" font-weight="700" text-anchor="middle">EntityId  —  the shared key across all descriptor topics</text><g filter="url(#soft)"><rect x="360" y="168" width="200" height="56" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="460" y="192" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">EntityMaster</text><text x="460" y="211" font-size="10" fill="#7a4f6a" text-anchor="middle">governs existence</text><text x="180" y="256" font-size="10.5" fill="#5B7BA6" font-weight="700" letter-spacing="0.5" text-anchor="middle">OWNED BY BRAIN</text><g><rect x="60" y="274" width="250" height="34" rx="8" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.3"/></g><text x="185" y="296" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">MissionState</text><line x1="310" y1="291" x2="360" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="60" y="316" width="250" height="34" rx="8" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.3"/></g><text x="185" y="338" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">NavigationIntent</text><line x1="310" y1="333" x2="360" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="60" y="358" width="250" height="34" rx="8" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.3"/></g><text x="185" y="380" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">TargetMemory</text><line x1="310" y1="375" x2="360" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="60" y="400" width="250" height="34" rx="8" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.3"/></g><text x="185" y="422" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">BehaviorState</text><line x1="310" y1="417" x2="360" y2="200" stroke="#9AA3B0" stroke-width="1"/><text x="740" y="256" font-size="10.5" fill="#7A916A" font-weight="700" letter-spacing="0.5" text-anchor="middle">OWNED BY MUSCLE</text><g><rect x="610" y="274" width="250" height="34" rx="8" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.3"/></g><text x="735" y="296" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">WorldPosition</text><line x1="610" y1="291" x2="560" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="610" y="316" width="250" height="34" rx="8" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.3"/></g><text x="735" y="338" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">Velocity</text><line x1="610" y1="333" x2="560" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="610" y="358" width="250" height="34" rx="8" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.3"/></g><text x="735" y="380" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">NavigationStatus</text><line x1="610" y1="375" x2="560" y2="200" stroke="#9AA3B0" stroke-width="1"/><g><rect x="610" y="400" width="250" height="34" rx="8" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.3"/></g><text x="735" y="422" font-size="11.5" fill="#3A4250" font-weight="600" text-anchor="middle">PhysicsState</text><line x1="610" y1="417" x2="560" y2="200" stroke="#9AA3B0" stroke-width="1"/><line x1="460" y1="148" x2="460" y2="168" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arS)"/><text x="460" y="462" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">Each descriptor is an optional facet on its own topic — so two nodes can own different parts of the same entity.</text></svg>