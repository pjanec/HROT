<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="440" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Navigation — Brain Asks, Muscle Solves</text>
<text x="40" y="68" font-size="14" fill="#6B7280">The Brain issues intent; the Muscle plans, follows, and silently replans. The Brain sees only the verdict.</text><text x="180" y="108" font-size="12" fill="#5B7BA6" font-weight="700" letter-spacing="1" text-anchor="middle">BRAIN (cognition)</text><text x="720" y="108" font-size="12" fill="#7A916A" font-weight="700" letter-spacing="1" text-anchor="middle">MUSCLE (execution)</text><line x1="460" y1="120" x2="460" y2="410" stroke="#9AA3B0" stroke-width="1" stroke-dasharray="4 5"/><g filter="url(#soft)"><rect x="60" y="150" width="230" height="92" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="175" y="178" font-size="14.5" fill="#3A4250" font-weight="700" text-anchor="middle">Action executor</text><text x="175" y="200" font-size="10.3" fill="#46566e" text-anchor="middle">MoveTo · Flee · FollowRoute</text><text x="175" y="216" font-size="10.3" fill="#46566e" text-anchor="middle">PlanRoute · FollowPath</text><text x="175" y="234" font-size="10" fill="#5B7BA6" font-style="italic" text-anchor="middle">writes NavigationIntent</text><g filter="url(#soft)"><rect x="630" y="150" width="230" height="92" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="745" y="178" font-size="14.5" fill="#3A4250" font-weight="700" text-anchor="middle">Path solver (~10 Hz)</text><text x="745" y="200" font-size="10.3" fill="#4f5d44" text-anchor="middle">navmesh A* · road Dijkstra</text><text x="745" y="216" font-size="10.3" fill="#4f5d44" text-anchor="middle">3D volumetric · hybrid</text><text x="745" y="234" font-size="10" fill="#7A916A" font-style="italic" text-anchor="middle">corridor following</text><line x1="290" y1="178" x2="630" y2="178" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#ar)"/><text x="460" y="170" font-size="11" fill="#9b7d5e" font-weight="600" text-anchor="middle">NavigationIntent  →</text><text x="460" y="134" font-size="9.5" fill="#6B7280" text-anchor="middle">mode · destination · route</text><line x1="630" y1="214" x2="290" y2="214" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#ar)"/><text x="460" y="232" font-size="11" fill="#9b7d5e" font-weight="600" text-anchor="middle">←  NavigationStatus</text><text x="460" y="258" font-size="9.5" fill="#6B7280" text-anchor="middle">result · phase · replan count · ETA</text><g filter="url(#soft)"><rect x="630" y="290" width="230" height="110" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="745" y="316" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Silent replanning</text><text x="745" y="338" font-size="10.3" fill="#6B7280" text-anchor="middle">frustration detected →</text><text x="745" y="354" font-size="10.3" fill="#6B7280" text-anchor="middle">replan up to a budget;</text><text x="745" y="370" font-size="10.3" fill="#6B7280" text-anchor="middle">Brain sees a hard failure</text><text x="745" y="388" font-size="10" fill="#7A916A" font-style="italic" text-anchor="middle">only if replanning exhausts</text><g filter="url(#soft)"><rect x="60" y="290" width="230" height="110" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="175" y="316" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Multi-modal agents</text><text x="175" y="338" font-size="10.3" fill="#6B7280" text-anchor="middle">infantry · wheeled · tracked</text><text x="175" y="354" font-size="10.3" fill="#6B7280" text-anchor="middle">naval · flying</text><text x="175" y="372" font-size="10" fill="#5B7BA6" font-style="italic" text-anchor="middle">off-mesh links → animation</text><text x="175" y="388" font-size="10" fill="#6B7280" text-anchor="middle">(jump · climb · door)</text></svg>