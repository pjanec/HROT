<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/>
    </marker>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="480" fill="#F7F8FA"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Utility AI — Scoring One Option</text>
  <text x="40" y="68" font-size="14" fill="#6B7280">Each consideration: raw input → response curve → weight. Aggregate to one 0–1 score. Highest-scoring option wins.</text>

  <!-- three considerations stacked -->
  <!-- consideration 1 -->
  <g filter="url(#s3)"><rect x="40" y="110" width="150" height="56" rx="10" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.6"/></g>
  <text x="115" y="134" font-size="12.5" font-weight="600" fill="#3A4250" text-anchor="middle">Input: health</text>
  <text x="115" y="152" font-size="10.5" fill="#46566e" text-anchor="middle">raw 0–1</text>

  <g filter="url(#s3)"><rect x="40" y="212" width="150" height="56" rx="10" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.6"/></g>
  <text x="115" y="236" font-size="12.5" font-weight="600" fill="#3A4250" text-anchor="middle">Input: range</text>
  <text x="115" y="254" font-size="10.5" fill="#46566e" text-anchor="middle">raw 0–1</text>

  <g filter="url(#s3)"><rect x="40" y="314" width="150" height="56" rx="10" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.6"/></g>
  <text x="115" y="338" font-size="12.5" font-weight="600" fill="#3A4250" text-anchor="middle">Input: ammo</text>
  <text x="115" y="356" font-size="10.5" fill="#46566e" text-anchor="middle">raw 0–1</text>

  <!-- curves -->
  <g filter="url(#s3)"><rect x="250" y="104" width="150" height="68" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g>
  <text x="325" y="122" font-size="10.5" fill="#6B7280" text-anchor="middle">curve: Linear</text>
  <polyline points="266,160 384,116" fill="none" stroke="#5B7BA6" stroke-width="2.2"/>

  <g filter="url(#s3)"><rect x="250" y="206" width="150" height="68" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g>
  <text x="325" y="224" font-size="10.5" fill="#6B7280" text-anchor="middle">curve: Bell</text>
  <path d="M266,262 Q325,222 384,262" fill="none" stroke="#7A916A" stroke-width="2.2"/>

  <g filter="url(#s3)"><rect x="250" y="308" width="150" height="68" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g>
  <text x="325" y="326" font-size="10.5" fill="#6B7280" text-anchor="middle">curve: Threshold</text>
  <path d="M266,364 L320,364 L320,332 L384,332" fill="none" stroke="#B08C5E" stroke-width="2.2"/>

  <!-- weights -->
  <text x="455" y="142" font-size="13" font-weight="700" fill="#9b7d5e" text-anchor="middle">× 0.7</text>
  <text x="455" y="244" font-size="13" font-weight="700" fill="#9b7d5e" text-anchor="middle">× 1.0</text>
  <text x="455" y="346" font-size="13" font-weight="700" fill="#9b7d5e" text-anchor="middle">× 0.9</text>

  <!-- aggregate -->
  <g filter="url(#s3)"><rect x="540" y="190" width="180" height="100" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.8"/></g>
  <text x="630" y="222" font-size="15" font-weight="700" fill="#3A4250" text-anchor="middle">Aggregate</text>
  <text x="630" y="244" font-size="11" fill="#7a4f6a" text-anchor="middle">WeightedProduct</text>
  <text x="630" y="260" font-size="11" fill="#7a4f6a" text-anchor="middle">(soft AND, default)</text>
  <text x="630" y="278" font-size="10" fill="#9b7d92" text-anchor="middle">or WeightedSum (soft OR)</text>

  <!-- score -->
  <g filter="url(#s3)"><rect x="772" y="206" width="110" height="68" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.8"/></g>
  <text x="827" y="234" font-size="13" font-weight="700" fill="#3A4250" text-anchor="middle">Score</text>
  <text x="827" y="256" font-size="11" fill="#4f5d44" text-anchor="middle">one 0–1 value</text>

  <!-- arrows input->curve -->
  <line x1="190" y1="138" x2="250" y2="138" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="190" y1="240" x2="250" y2="240" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="190" y1="342" x2="250" y2="342" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <!-- curve->aggregate (through weights) -->
  <line x1="400" y1="138" x2="540" y2="216" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="400" y1="240" x2="540" y2="240" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="400" y1="342" x2="540" y2="264" stroke="#C7A98C" stroke-width="2" marker-end="url(#a3)"/>
  <!-- aggregate->score -->
  <line x1="720" y1="240" x2="772" y2="240" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a3)"/>

  <!-- footer note -->
  <text x="460" y="430" font-size="12.5" fill="#6B7280" text-anchor="middle">This runs for every option (each target, weapon, or posture). The options are ranked; the winner is chosen — with hysteresis to avoid flip-flopping.</text>
  <text x="460" y="452" font-size="11.5" font-style="italic" fill="#9AA3B0" text-anchor="middle">Every weight and curve is tunable live at runtime.</text>
</svg>
