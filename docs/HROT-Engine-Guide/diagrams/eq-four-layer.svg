<rect width="920" height="460" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">EQS — The Standing-Query Model</text>
<text x="40" y="68" font-size="14" fill="#6B7280">The Brain declares a query; the Muscle solves it continuously; results stay fresh in a buffer the behavior reads instantly.</text><g filter="url(#soft)"><rect x="60" y="110" width="800" height="70" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="110" y="140" font-size="12" fill="#5B7BA6" font-weight="700" letter-spacing="1" text-anchor="start">BRAIN</text><text x="460" y="138" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Layer 1 — Sensor declaration</text><text x="460" y="160" font-size="10.5" fill="#46566e" text-anchor="middle">a standing query as a component · presence = subscription · refresh policy · priority</text><g filter="url(#soft)"><rect x="60" y="192" width="800" height="64" rx="12" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1.4"/></g><text x="460" y="218" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Layer 2 — Cognitive buffer</text><text x="460" y="238" font-size="10.3" fill="#46566e" text-anchor="middle">top-K results read synchronously by BTree / Utility nodes — no blocking</text><text x="460" y="278" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">▲ results   |   query config ▼     (DDS)</text><g filter="url(#soft)"><rect x="60" y="292" width="800" height="64" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="110" y="322" font-size="12" fill="#7A916A" font-weight="700" letter-spacing="1" text-anchor="start">MUSCLE</text><text x="460" y="318" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Layer 3 — Solver service (~10 Hz, time-sliced, budgeted)</text><text x="460" y="340" font-size="10.3" fill="#4f5d44" text-anchor="middle">generate → filter cheap → filter expensive → score cheap → score expensive → top-K</text><g filter="url(#soft)"><rect x="60" y="368" width="800" height="64" rx="12" fill="#EAF0E3" stroke="#7A916A" stroke-width="1.4"/></g><text x="460" y="394" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Layer 4 — Tactical world providers</text><text x="460" y="414" font-size="10.3" fill="#4f5d44" text-anchor="middle">spatial hash grid · cover provider · navmesh provider · line-of-sight service</text></svg>