<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="440" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">The Clean-Architecture Seam (ACL)</text>
<text x="40" y="68" font-size="14" fill="#6B7280">Each node = pure logic packs + translator packs. The same logic runs in-process or distributed, unchanged.</text><text x="245" y="108" font-size="12" fill="#7A916A" font-weight="700" letter-spacing="0.5" text-anchor="middle">IN-PROCESS  (no DDS)</text><g filter="url(#soft)"><rect x="60" y="130" width="370" height="90" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="245" y="160" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Pure logic pack</text><text x="245" y="182" font-size="10.5" fill="#4f5d44" text-anchor="middle">ECS systems on local memory</text><text x="245" y="200" font-size="10.5" fill="#4f5d44" text-anchor="middle">zero DDS dependency</text><g filter="url(#soft)"><rect x="60" y="232" width="370" height="54" rx="12" fill="#EAF0E3" stroke="#7A916A" stroke-width="1.3"/></g><text x="245" y="256" font-size="12" fill="#3A4250" font-weight="700" text-anchor="middle">Local event bus</text><text x="245" y="274" font-size="10" fill="#4f5d44" text-anchor="middle">events delivered directly</text><line x1="245" y1="220" x2="245" y2="232" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arS)"/><text x="675" y="108" font-size="12" fill="#5B7BA6" font-weight="700" letter-spacing="0.5" text-anchor="middle">DISTRIBUTED  (over DDS)</text><g filter="url(#soft)"><rect x="490" y="130" width="370" height="90" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="675" y="160" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Same pure logic pack</text><text x="675" y="182" font-size="10.5" fill="#46566e" text-anchor="middle">unchanged — identical code</text><text x="675" y="200" font-size="10.5" fill="#46566e" text-anchor="middle">still zero DDS dependency</text><g filter="url(#soft)"><rect x="490" y="232" width="370" height="54" rx="12" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1.3"/></g><text x="675" y="253" font-size="12" fill="#3A4250" font-weight="700" text-anchor="middle">Translator pack (ACL)</text><text x="675" y="271" font-size="10" fill="#46566e" text-anchor="middle">converts DDS wire structs ↔ ECS events</text><line x1="675" y1="220" x2="675" y2="232" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arS)"/><g filter="url(#soft)"><rect x="490" y="298" width="370" height="40" rx="9" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.3"/></g><text x="675" y="323" font-size="11.5" fill="#6B7280" font-weight="600" text-anchor="middle">DDS pub/sub  (CycloneDDS)</text><line x1="675" y1="286" x2="675" y2="298" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arS)"/><g filter="url(#soft)"><rect x="60" y="360" width="800" height="52" rx="10" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="382" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">The logic never knows which mode it's in.</text><text x="460" y="401" font-size="11" fill="#6B7280" text-anchor="middle">Adding/removing translators is the only difference between a single-process demo and a distributed cluster.</text></svg>