<rect width="920" height="460" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Perception — Sensors to Threat Memory</text>
<text x="40" y="68" font-size="14" fill="#6B7280">Broadphase narrows candidates, LOS confirms, tracks debounce, threats decay. Multi-modal and 3D.</text><g filter="url(#soft)"><rect x="60" y="150" width="170" height="96" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="145" y="178" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Sensor config</text><text x="145" y="202" font-size="10.3" fill="#46566e" text-anchor="middle">vision range · FOV</text><text x="145" y="222" font-size="10.3" fill="#46566e" text-anchor="middle">modalities</text><g filter="url(#soft)"><rect x="250" y="150" width="170" height="96" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="335" y="178" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Broadphase</text><text x="335" y="202" font-size="10.3" fill="#4f5d44" text-anchor="middle">spatial hash grid</text><text x="335" y="222" font-size="10.3" fill="#4f5d44" text-anchor="middle">cheap neighbor cull</text><g filter="url(#soft)"><rect x="440" y="150" width="170" height="96" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="525" y="178" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">LOS check</text><text x="525" y="202" font-size="10.3" fill="#4f5d44" text-anchor="middle">batched raycasts</text><text x="525" y="222" font-size="10.3" fill="#4f5d44" text-anchor="middle">confirm visibility</text><g filter="url(#soft)"><rect x="630" y="150" width="170" height="96" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="715" y="178" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Track update</text><text x="715" y="202" font-size="10.3" fill="#4f5d44" text-anchor="middle">debounce gain/loss</text><text x="715" y="222" font-size="10.3" fill="#4f5d44" text-anchor="middle">merge to output</text><line x1="230" y1="198" x2="250" y2="198" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><line x1="420" y1="198" x2="440" y2="198" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><line x1="610" y1="198" x2="630" y2="198" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><text x="145" y="290" font-size="10.5" fill="#6B7280" font-weight="700" letter-spacing="0.5" text-anchor="middle">MODALITIES</text><rect x="60" y="302" width="92" height="30" rx="15" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.2"/><text x="106" y="322" font-size="11" fill="#3A4250" font-weight="600" text-anchor="middle">Visual</text><rect x="164" y="302" width="92" height="30" rx="15" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.2"/><text x="210" y="322" font-size="11" fill="#3A4250" font-weight="600" text-anchor="middle">Acoustic</text><rect x="268" y="302" width="92" height="30" rx="15" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.2"/><text x="314" y="322" font-size="11" fill="#3A4250" font-weight="600" text-anchor="middle">Radar</text><rect x="372" y="302" width="92" height="30" rx="15" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.2"/><text x="418" y="322" font-size="11" fill="#3A4250" font-weight="600" text-anchor="middle">Thermal</text><g filter="url(#soft)"><rect x="540" y="288" width="320" height="120" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="700" y="316" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">TargetMemory</text><text x="700" y="338" font-size="10.5" fill="#7a4f6a" text-anchor="middle">ranked, decaying list of contacts</text><text x="700" y="356" font-size="10.5" fill="#7a4f6a" text-anchor="middle">3D position · last-seen · threat score</text><text x="700" y="374" font-size="10.5" fill="#7a4f6a" text-anchor="middle">modality bitmask per contact</text><text x="700" y="394" font-size="10" fill="#A86F8C" font-style="italic" text-anchor="middle">boosts active tracks · decays stale ones</text><line x1="715" y1="246" x2="715" y2="288" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/></svg>