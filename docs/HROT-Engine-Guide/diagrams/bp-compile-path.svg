<rect width="920" height="420" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Blueprints — Dual Compile Path</text>
<text x="40" y="68" font-size="14" fill="#6B7280">Same Blueprint, two paths: baked into the build for production, or live-compiled for fast iteration. It runs as real C#, not an interpreter.</text><g filter="url(#soft)"><path d="M360,120 h150 a8,8 0 0 1 8,8 v60 a8,8 0 0 1 -8,8 h-150 a8,8 0 0 1 -8,-8 v-60 a8,8 0 0 1 8,-8 z" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.7"/></g><text x="435" y="150" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Blueprint graph</text><text x="435" y="172" font-size="10.5" fill="#6B7280" text-anchor="middle">.bp.json</text><g filter="url(#soft)"><rect x="120" y="250" width="300" height="90" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="270" y="278" font-size="14.5" fill="#3A4250" font-weight="700" text-anchor="middle">Build-time</text><text x="270" y="300" font-size="10.5" fill="#6e5836" text-anchor="middle">Roslyn source generator</text><text x="270" y="316" font-size="10.5" fill="#6e5836" text-anchor="middle">compiled into the assembly</text><text x="270" y="334" font-size="10" fill="#B08C5E" font-style="italic" text-anchor="middle">zero runtime cost · production</text><g filter="url(#soft)"><rect x="500" y="250" width="300" height="90" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="650" y="278" font-size="14.5" fill="#3A4250" font-weight="700" text-anchor="middle">Runtime</text><text x="650" y="300" font-size="10.5" fill="#46566e" text-anchor="middle">in-process Roslyn compile</text><text x="650" y="316" font-size="10.5" fill="#46566e" text-anchor="middle">Quick Reload in the editor</text><text x="650" y="334" font-size="10" fill="#5B7BA6" font-style="italic" text-anchor="middle">seconds-long edit→run · iteration</text><line x1="420" y1="180" x2="270" y2="250" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><text x="300" y="212" font-size="10.5" fill="#9b7d5e" font-weight="600" text-anchor="middle">ship</text><line x1="450" y1="180" x2="650" y2="250" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#ar)"/><text x="600" y="212" font-size="10.5" fill="#9b7d5e" font-weight="600" text-anchor="middle">iterate</text><text x="460" y="388" font-size="11.5" fill="#6B7280" font-style="italic" text-anchor="middle">Both lower to generated C# that runs at full speed — the visual graph is authoring convenience, not a runtime layer.</text></svg>