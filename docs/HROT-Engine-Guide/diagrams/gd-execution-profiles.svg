<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/></marker>
<marker id="arS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#B5796B"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/></filter>
</defs>
<rect width="920" height="420" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Module Execution Profiles</text>
<text x="40" y="68" font-size="14" fill="#6B7280">Each module picks where it runs. Background work reads an isolated snapshot — no locks on the hot path.</text><g filter="url(#soft)"><rect x="60" y="120" width="380" height="120" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="250" y="150" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Main-thread modules</text><text x="250" y="176" font-size="11" fill="#4f5d44" text-anchor="middle">physics · the critical path</text><text x="250" y="198" font-size="11" fill="#4f5d44" text-anchor="middle">run synchronously every frame</text><text x="250" y="222" font-size="10.5" fill="#7A916A" font-style="italic" text-anchor="middle">authoritative simulation state</text><g filter="url(#soft)"><rect x="480" y="120" width="380" height="120" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="670" y="150" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Background modules</text><text x="670" y="176" font-size="10.5" fill="#46566e" text-anchor="middle">AI · pathfinding · perception · recording</text><text x="670" y="198" font-size="11" fill="#46566e" text-anchor="middle">run on a worker thread</text><text x="670" y="222" font-size="10.5" fill="#5B7BA6" font-style="italic" text-anchor="middle">against an isolated snapshot / replica</text><g filter="url(#soft)"><rect x="60" y="272" width="800" height="100" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="460" y="298" font-size="13.5" fill="#3A4250" font-weight="700" text-anchor="middle">Why it's safe without locks</text><text x="460" y="322" font-size="11" fill="#6B7280" text-anchor="middle">A background module reads a consistent snapshot taken at a frame boundary —</text><text x="460" y="341" font-size="11" fill="#6B7280" text-anchor="middle">so it never tears or races with the main loop mutating live state.</text><text x="460" y="361" font-size="11" fill="#6B7280" font-style="italic" text-anchor="middle">Results are handed back at the next safe boundary.</text><line x1="440" y1="180" x2="480" y2="180" stroke="#9AA3B0" stroke-width="1.2" stroke-dasharray="4 4"/></svg>