<rect width="920" height="430" fill="#F7F8FA"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">One Predicate Language — Search &amp; Breakpoints</text>
<text x="40" y="68" font-size="14" fill="#6B7280">The same composable conditions search a recording offline and break a live run. Skills transfer directly.</text><g filter="url(#soft)"><rect x="340" y="180" width="240" height="110" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="460" y="210" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Predicate DSL</text><text x="460" y="232" font-size="10.5" fill="#7a4f6a" text-anchor="middle">spatial · lifecycle</text><text x="460" y="248" font-size="10.5" fill="#7a4f6a" text-anchor="middle">structural · numeric · string</text><text x="460" y="264" font-size="10.5" fill="#7a4f6a" text-anchor="middle">event · behavior-param</text><text x="460" y="282" font-size="10" fill="#A86F8C" font-style="italic" text-anchor="middle">AND / OR composition</text><g filter="url(#soft)"><rect x="60" y="195" width="200" height="80" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="160" y="223" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Replay search</text><text x="160" y="245" font-size="10.5" fill="#4f5d44" text-anchor="middle">offline post-mortem</text><text x="160" y="261" font-size="10.5" fill="#4f5d44" text-anchor="middle">find when / what</text><g filter="url(#soft)"><rect x="660" y="195" width="200" height="80" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="760" y="223" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">Data breakpoint</text><text x="760" y="245" font-size="10.5" fill="#46566e" text-anchor="middle">run until condition</text><text x="760" y="261" font-size="10.5" fill="#46566e" text-anchor="middle">→ rewind &amp; pause</text><line x1="340" y1="235" x2="260" y2="235" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#ar)"/><line x1="580" y1="235" x2="660" y2="235" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#ar)"/><text x="460" y="360" font-size="12.5" fill="#6B7280" font-style="italic" text-anchor="middle">Author a condition once — use it to query history or to catch the exact frame live.</text></svg>