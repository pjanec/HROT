<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="450" fill="#F7F8FA"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Authoring &amp; Tooling — Edit to Running in Seconds</text>
  <text x="40" y="68" font-size="14" fill="#6B7280">Authors work visually; the round-trip from edit to running behavior is seconds, not a rebuild cycle.</text>

  <!-- the loop: author -> reload -> running -> observe -> back -->
  <g filter="url(#soft)"><rect x="70" y="110" width="200" height="80" rx="11" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g>
  <text x="170" y="138" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Visual editors</text>
  <text x="170" y="159" font-size="10.5" fill="#7a4f6a" text-anchor="middle">BTree · HSM · Blueprint</text>
  <text x="170" y="175" font-size="10.5" fill="#7a4f6a" text-anchor="middle">shared infra · refactoring</text>

  <g filter="url(#soft)"><rect x="650" y="110" width="200" height="80" rx="11" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g>
  <text x="750" y="138" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Running sim</text>
  <text x="750" y="159" font-size="10.5" fill="#46566e" text-anchor="middle">60 Hz · never pauses</text>
  <text x="750" y="175" font-size="10.5" fill="#46566e" text-anchor="middle">live entities keep state</text>

  <g filter="url(#soft)"><rect x="650" y="270" width="200" height="80" rx="11" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g>
  <text x="750" y="298" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">In-sim gizmos</text>
  <text x="750" y="319" font-size="10.5" fill="#4f5d44" text-anchor="middle">AI state · paths · perception</text>
  <text x="750" y="335" font-size="10.5" fill="#4f5d44" text-anchor="middle">batch-drawn overlays</text>

  <g filter="url(#soft)"><rect x="70" y="270" width="200" height="80" rx="11" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g>
  <text x="170" y="298" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Quick hot-reload</text>
  <text x="170" y="319" font-size="10.5" fill="#6e5836" text-anchor="middle">Cosmetic / Soft / Hard</text>
  <text x="170" y="335" font-size="10.5" fill="#6e5836" text-anchor="middle">preserves running state</text>

  <!-- loop arrows -->
  <line x1="270" y1="150" x2="650" y2="150" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a8)"/>
  <text x="460" y="142" font-size="11" font-weight="600" fill="#9b7d5e" text-anchor="middle">author behavior</text>
  <line x1="750" y1="190" x2="750" y2="270" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a8)"/>
  <text x="800" y="234" font-size="11" font-weight="600" fill="#9b7d5e" text-anchor="middle">observe</text>
  <line x1="650" y1="310" x2="270" y2="310" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a8)"/>
  <text x="460" y="302" font-size="11" font-weight="600" fill="#9b7d5e" text-anchor="middle">see what's wrong</text>
  <line x1="170" y1="270" x2="170" y2="190" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a8)"/>
  <text x="120" y="234" font-size="11" font-weight="600" fill="#9b7d5e" text-anchor="middle">reload live</text>

  <!-- center callout: dev modes -->
  <g filter="url(#soft)"><rect x="330" y="218" width="260" height="84" rx="12" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g>
  <text x="460" y="246" font-size="13" font-weight="700" fill="#3A4250" text-anchor="middle">Lightweight dev modes</text>
  <text x="460" y="268" font-size="10.5" fill="#6B7280" text-anchor="middle">IG-less: 2D map + simplified services</text>
  <text x="460" y="285" font-size="10.5" fill="#6B7280" text-anchor="middle">GPU-free mock node for CI</text>

  <!-- footer -->
  <text x="460" y="400" font-size="12.5" font-style="italic" fill="#9AA3B0" text-anchor="middle">The whole loop runs without restarting the simulation.</text>
</svg>
