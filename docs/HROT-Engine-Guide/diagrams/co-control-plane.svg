<text x="40" y="68" font-size="14" fill="#6B7280">One Orchestrator (master) coordinates; every node runs a slave that heartbeats and executes commands.</text><g filter="url(#soft)"><rect x="360" y="110" width="200" height="100" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="460" y="140" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Orchestrator</text><text x="460" y="162" font-size="10.5" fill="#7a4f6a" text-anchor="middle">cluster master</text><text x="460" y="178" font-size="10.5" fill="#7a4f6a" text-anchor="middle">2-phase commit coordinator</text><text x="460" y="196" font-size="10" fill="#A86F8C" font-style="italic" text-anchor="middle">state machine · asset gateway</text><g filter="url(#soft)"><rect x="60" y="300" width="170" height="70" rx="12" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.7"/></g><text x="145.0" y="332" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">SimHost</text><text x="145.0" y="353" font-size="9.5" fill="#6B7280" text-anchor="middle">slave: heartbeat + execute</text><line x1="145.0" y1="300" x2="460" y2="210" stroke="#9AA3B0" stroke-width="1.2"/><g filter="url(#soft)"><rect x="245" y="300" width="215" height="70" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="352.5" y="332" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">CGF</text><text x="352.5" y="353" font-size="9.5" fill="#6B7280" text-anchor="middle">slave: heartbeat + execute</text><line x1="352.5" y1="300" x2="460" y2="210" stroke="#9AA3B0" stroke-width="1.2"/><g filter="url(#soft)"><rect x="490" y="300" width="170" height="70" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="575.0" y="332" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">IG</text><text x="575.0" y="353" font-size="9.5" fill="#6B7280" text-anchor="middle">slave: heartbeat + execute</text><line x1="575.0" y1="300" x2="460" y2="210" stroke="#9AA3B0" stroke-width="1.2"/><g filter="url(#soft)"><rect x="675" y="300" width="170" height="70" rx="12" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.7"/></g><text x="760.0" y="332" font-size="14" fill="#3A4250" font-weight="700" text-anchor="middle">ExCon</text><text x="760.0" y="353" font-size="9.5" fill="#6B7280" text-anchor="middle">slave: heartbeat + execute</text><line x1="760.0" y1="300" x2="460" y2="210" stroke="#9AA3B0" stroke-width="1.2"/><text x="250" y="250" font-size="11" fill="#9b7d5e" font-weight="600" text-anchor="middle">NodeOpCommand  ↓</text><text x="670" y="250" font-size="11" fill="#9b7d5e" font-weight="600" text-anchor="middle">↑  NodeOpStatus / heartbeat</text><g filter="url(#soft)"><path d="M330,400 h260 a8,8 0 0 1 8,8 v30 a8,8 0 0 1 -8,8 h-260 a8,8 0 0 1 -8,-8 v-30 a8,8 0 0 1 8,-8 z" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.6"/></g><text x="460" y="425" font-size="10.5" fill="#6B7280" font-weight="600" text-anchor="middle">Central storage (NAS) — scenarios &amp; AAR recordings</text><line x1="460" y1="210" x2="460" y2="300" stroke="#9AA3B0" stroke-width="1.2"/></svg>