<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C7A98C"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A4250" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="440" fill="#F7F8FA"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">Diagnostics, AAR &amp; Replay</text>
  <text x="40" y="68" font-size="14" fill="#6B7280">Replays are exact, not approximate — because the simulation is deterministic.</text>

  <!-- Live sim -->
  <g filter="url(#soft)"><rect x="60" y="120" width="180" height="90" rx="11" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g>
  <text x="150" y="150" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Live simulation</text>
  <text x="150" y="172" font-size="10.5" fill="#46566e" text-anchor="middle">state + events</text>
  <text x="150" y="188" font-size="10.5" fill="#46566e" text-anchor="middle">at 60 Hz</text>

  <!-- recorder -->
  <g filter="url(#soft)"><rect x="320" y="120" width="180" height="90" rx="11" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g>
  <text x="410" y="146" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Flight recorder</text>
  <text x="410" y="167" font-size="10.5" fill="#6e5836" text-anchor="middle">async · keyframe+delta</text>
  <text x="410" y="183" font-size="10.5" fill="#6e5836" text-anchor="middle">never stalls the loop</text>
  <text x="410" y="199" font-size="10" font-style="italic" fill="#9b7d5e" text-anchor="middle">schema-hash guarded</text>

  <!-- recording file -->
  <g filter="url(#soft)"><path d="M580,120 h150 a8,8 0 0 1 8,8 v74 a8,8 0 0 1 -8,8 h-150 a8,8 0 0 1 -8,-8 v-74 a8,8 0 0 1 8,-8 z" fill="#E4E7EC" stroke="#9AA3B0" stroke-width="1.7"/></g>
  <text x="655" y="150" font-size="14" font-weight="700" fill="#3A4250" text-anchor="middle">Recording</text>
  <text x="655" y="172" font-size="10.5" fill="#6B7280" text-anchor="middle">exact, replayable</text>
  <text x="655" y="188" font-size="10.5" fill="#6B7280" text-anchor="middle">+ schema manifest</text>

  <line x1="240" y1="165" x2="320" y2="165" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a10)"/>
  <line x1="500" y1="165" x2="572" y2="165" stroke="#C7A98C" stroke-width="2.4" marker-end="url(#a10)"/>

  <!-- analysis row -->
  <text x="40" y="262" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="0.5">REPLAY BROWSER — turn a recording into an explanation</text>

  <g filter="url(#soft)"><rect x="60" y="278" width="195" height="96" rx="11" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.6"/></g>
  <text x="157" y="306" font-size="13.5" font-weight="700" fill="#3A4250" text-anchor="middle">Search</text>
  <text x="157" y="328" font-size="10.5" fill="#4f5d44" text-anchor="middle">composable predicates</text>
  <text x="157" y="344" font-size="10.5" fill="#4f5d44" text-anchor="middle">spatial · lifecycle ·</text>
  <text x="157" y="360" font-size="10.5" fill="#4f5d44" text-anchor="middle">behavior params</text>

  <g filter="url(#soft)"><rect x="267" y="278" width="195" height="96" rx="11" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.6"/></g>
  <text x="364" y="306" font-size="13.5" font-weight="700" fill="#3A4250" text-anchor="middle">Diff</text>
  <text x="364" y="328" font-size="10.5" fill="#4f5d44" text-anchor="middle">world state before/after</text>
  <text x="364" y="344" font-size="10.5" fill="#4f5d44" text-anchor="middle">as a tree</text>
  <text x="364" y="360" font-size="10.5" fill="#4f5d44" text-anchor="middle">what changed</text>

  <g filter="url(#soft)"><rect x="474" y="278" width="195" height="96" rx="11" fill="#D8E0CE" stroke="#7A916A" stroke-width="1.6"/></g>
  <text x="571" y="306" font-size="13.5" font-weight="700" fill="#3A4250" text-anchor="middle">Causality jump</text>
  <text x="571" y="328" font-size="10.5" fill="#4f5d44" text-anchor="middle">trace from an effect</text>
  <text x="571" y="344" font-size="10.5" fill="#4f5d44" text-anchor="middle">back toward</text>
  <text x="571" y="360" font-size="10.5" fill="#4f5d44" text-anchor="middle">its cause</text>

  <g filter="url(#soft)"><rect x="681" y="278" width="178" height="96" rx="11" fill="#E5D2DD" stroke="#A86F8C" stroke-width="1.6"/></g>
  <text x="770" y="306" font-size="13.5" font-weight="700" fill="#3A4250" text-anchor="middle">Data breakpoints</text>
  <text x="770" y="328" font-size="10.5" fill="#7a4f6a" text-anchor="middle">run until a condition</text>
  <text x="770" y="344" font-size="10.5" fill="#7a4f6a" text-anchor="middle">→ rewind &amp; pause</text>
  <text x="770" y="360" font-size="10" font-style="italic" fill="#A86F8C" text-anchor="middle">same DSL as search</text>

  <line x1="655" y1="210" x2="655" y2="278" stroke="#C7A98C" stroke-width="2.2" marker-end="url(#a10)"/>
</svg>
