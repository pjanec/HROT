<text x="40" y="44" font-size="22" font-weight="700" fill="#3A4250">TKB — Data-Driven Entities</text>
<text x="40" y="68" font-size="14" fill="#6B7280">A template defines an entity type by its components and defaults; spawning assembles an instance from it.</text><g filter="url(#soft)"><rect x="60" y="120" width="260" height="200" rx="12" fill="#E6D9C7" stroke="#B08C5E" stroke-width="1.7"/></g><text x="190" y="148" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">TKB template</text><text x="190" y="168" font-size="10.5" fill="#6e5836" font-style="italic" text-anchor="middle">e.g. M1 Abrams</text><rect x="84" y="179" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="194" font-size="10.5" fill="#6e5836" text-anchor="middle">transform · collider</text><rect x="84" y="205" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="220" font-size="10.5" fill="#6e5836" text-anchor="middle">sensors · weapons</text><rect x="84" y="231" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="246" font-size="10.5" fill="#6e5836" text-anchor="middle">vehicle physics</text><rect x="84" y="257" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="272" font-size="10.5" fill="#6e5836" text-anchor="middle">default behavior</text><rect x="84" y="283" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="298" font-size="10.5" fill="#6e5836" text-anchor="middle">unit composition</text><rect x="84" y="309" width="212" height="22" rx="5" fill="#F2E9DC" stroke="#B08C5E" stroke-width="1"/><text x="190" y="324" font-size="10.5" fill="#6e5836" text-anchor="middle">visual / LOD</text><line x1="320" y1="220" x2="400" y2="220" stroke="#C7A98C" stroke-width="2.6" marker-end="url(#ar)"/><text x="360" y="210" font-size="10.5" fill="#9b7d5e" font-weight="600" text-anchor="middle">apply</text><g filter="url(#soft)"><rect x="420" y="120" width="200" height="200" rx="12" fill="#C9D6E8" stroke="#5B7BA6" stroke-width="1.7"/></g><text x="520" y="148" font-size="15" fill="#3A4250" font-weight="700" text-anchor="middle">Spawned entity</text><text x="520" y="172" font-size="10.5" fill="#46566e" text-anchor="middle">= kind from template</text><text x="520" y="190" font-size="10.5" fill="#46566e" text-anchor="middle">+ instance specifics</text><rect x="444" y="206" width="152" height="26" rx="6" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1"/><text x="520" y="224" font-size="10.5" fill="#46566e" text-anchor="middle">position · heading</text><rect x="444" y="238" width="152" height="26" rx="6" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1"/><text x="520" y="256" font-size="10.5" fill="#46566e" text-anchor="middle">behavior assignment</text><rect x="444" y="270" width="152" height="26" rx="6" fill="#DEE7F1" stroke="#5B7BA6" stroke-width="1"/><text x="520" y="288" font-size="10.5" fill="#46566e" text-anchor="middle">relationships</text><g filter="url(#soft)"><rect x="680" y="120" width="180" height="200" rx="11" fill="#FBFCFD" stroke="#9AA3B0" stroke-width="1.4"/></g><text x="770" y="148" font-size="13" fill="#3A4250" font-weight="700" text-anchor="middle">Spawn authority</text><text x="770" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">one node (Brain)</text><text x="770" y="192" font-size="10.5" fill="#6B7280" text-anchor="middle">is the default</text><text x="770" y="208" font-size="10.5" fill="#6B7280" text-anchor="middle">processor for</text><text x="770" y="224" font-size="10.5" fill="#6B7280" text-anchor="middle">create requests</text><text x="770" y="254" font-size="10.3" fill="#5B7BA6" font-style="italic" text-anchor="middle">central network-ID</text><text x="770" y="270" font-size="10.3" fill="#5B7BA6" font-style="italic" text-anchor="middle">allocation —</text><text x="770" y="286" font-size="10.3" fill="#5B7BA6" font-style="italic" text-anchor="middle">no collisions</text><line x1="620" y1="220" x2="680" y2="220" stroke="#9AA3B0" stroke-width="1.2" stroke-dasharray="4 4"/><text x="460" y="390" font-size="12" fill="#6B7280" font-style="italic" text-anchor="middle">New platforms, sensors, and weapons become template / data changes — not engine rewrites.</text></svg>