<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="580" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">CQB test house (BR-1 proposal) — 14 × 10 m, one storey, 1 m = 40 px</text>
  <g transform="translate(60,70)" stroke="#333" stroke-width="3" fill="none">
    <!-- outer walls -->
    <rect x="0" y="0" width="560" height="400" fill="#f6f6f6"/>
    <!-- hallway walls y=4..6 m (north wall at y=160 px from top = 6 m from south) -->
    <line x1="0" y1="160" x2="560" y2="160"/>
    <line x1="0" y1="240" x2="560" y2="240"/>
    <!-- north rooms split at x=7 m -->
    <line x1="280" y1="0" x2="280" y2="160"/>
    <!-- south rooms: C x0..9, D x9..11.8, E x11.8..14 -->
    <line x1="360" y1="240" x2="360" y2="400"/>
    <line x1="472" y1="240" x2="472" y2="400"/>
  </g>
  <g transform="translate(60,70)" stroke="#ffffff" stroke-width="5">
    <!-- door gaps (white over the wall) -->
    <line x1="0" y1="185" x2="0" y2="215"/>       <!-- front door, west -->
    <line x1="560" y1="185" x2="560" y2="215"/>   <!-- back door, east -->
    <line x1="125" y1="160" x2="155" y2="160"/>   <!-- A -->
    <line x1="405" y1="160" x2="435" y2="160"/>   <!-- B -->
    <line x1="165" y1="240" x2="195" y2="240"/>   <!-- C -->
    <line x1="400" y1="240" x2="430" y2="240"/>   <!-- D -->
    <line x1="472" y1="305" x2="472" y2="335"/>   <!-- E from D -->
    <line x1="200" y1="0" x2="230" y2="0"/>       <!-- side door north, into A -->
    <line x1="40" y1="400" x2="70" y2="400"/>     <!-- side door south, into C -->
  </g>
  <g transform="translate(60,70)" stroke="#3a7bd5" stroke-width="5">
    <!-- windows -->
    <line x1="80" y1="0" x2="140" y2="0"/>
    <line x1="400" y1="0" x2="460" y2="0"/>
    <line x1="560" y1="50" x2="560" y2="110"/>
    <line x1="0" y1="290" x2="0" y2="350"/>
    <line x1="120" y1="400" x2="180" y2="400"/>
    <line x1="390" y1="400" x2="440" y2="400"/>
  </g>
  <g transform="translate(60,70)" fill="#222" font-size="14" font-weight="bold">
    <text x="105" y="85">A · 28 m²</text>
    <text x="385" y="85">B · 28 m²</text>
    <text x="215" y="205">HALLWAY (danger area)</text>
    <text x="130" y="325">C · 36 m²</text>
    <text x="366" y="318" font-size="12">D · 11 m²</text>
    <text x="366" y="334" font-size="11" font-weight="normal">2-man entry</text>
    <text x="478" y="318" font-size="12">E · closet</text>
    <text x="478" y="334" font-size="11" font-weight="normal">only via D</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="0" y="262">front</text><text x="0" y="276">door ▶</text>
    <text x="626" y="262">◀ back</text><text x="626" y="276">door</text>
  </g>
  <g transform="translate(60,500)" font-size="12" fill="#333">
    <rect x="0" y="-10" width="22" height="5" fill="#3a7bd5"/><text x="30" y="-4">window (support squad fires only into rooms not yet Cleared)</text>
    <rect x="0" y="12" width="22" height="5" fill="#ffffff" stroke="#333"/><text x="30" y="18">doorway (portal between two rooms)</text>
    <text x="0" y="42">doors: front (W, hallway) · back (E, hallway) · side N into A · side S into C — the support squad watches four exits.</text>
    <text x="0" y="58">what it exercises: a hallway cleared as a room · two-man entry (D) · a room reached only through another room (E) · corner-fed doors (A, D)</text>
  </g>
</svg>
