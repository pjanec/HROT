<text x='240' y='806' fill='#C8C8D0' font-size='11.5' font-family='Roboto, Segoe UI, Arial, sans-serif' text-anchor='start' font-weight='normal' xml:space='preserve'>Band 1 — eye-safe rangefinder (1 540 nm): drawn in NO view (D-159). Only the device's own HUD shows the range it measured.</text>
<text x='240' y='828' fill='#C8C8D0' font-size='11.5' font-family='Roboto, Segoe UI, Arial, sans-serif' text-anchor='start' font-weight='normal' xml:space='preserve'>Thermal (8–12 µm) sees none of these bands: the thermal column draws nothing — the man is hot, the beam is not.</text>
<text x='240' y='842' fill='#C8C8D0' font-size='11.5' font-family='Roboto, Segoe UI, Arial, sans-serif' text-anchor='start' font-weight='normal' xml:space='preserve'>Band 2 under night vision is FAINT (× 0.25: the tube's tail at 1 064 nm); bands 0 and 3 are bright. Every night-vision draw is white (SceneSensors.Emissive) and blooms.</text>
<text x='240' y='876' fill='#C8C8D0' font-size='11.5' font-family='Roboto, Segoe UI, Arial, sans-serif' text-anchor='start' font-weight='normal' xml:space='preserve'>THE BEAM is its scatter off haze: alpha = table × power × aerosol, fading along the line with exp(−d / visibility).</text>
<text x='240' y='890' fill='#C8C8D0' font-size='11.5' font-family='Roboto, Segoe UI, Arial, sans-serif' text-anchor='start' font-weight='normal' xml:space='preserve'>THE SPOT is a surface return: alpha = table × the spot's strength — it needs no haze. A Preview spot (paused) is drawn the same way.</text>
</svg>