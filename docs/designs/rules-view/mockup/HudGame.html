<!doctype html>

      <span style="width: 30px; height: 30px; border-radius: 6px; background: #2f6fd6; display: flex; align-items: center; justify-content: center; font-weight: 800;">A</span>

    <span style="color: #c9ccd2; font-size: 12px;">rifle · auto</span>
