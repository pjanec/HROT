<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" font-family="Inter, Arial, sans-serif" font-size="12">
  <title>An imported pitched roof in 3-D — the cap drawn as a gable (DESIGN_Map_3D_Mode §6ai R-1…R-4, CE-4377)</title>
  <defs>
    <pattern id="tiles" width="12" height="9" patternUnits="userSpaceOnUse">
      <rect width="12" height="9" fill="#96563F"/>
      <rect y="6" width="12" height="3" fill="#6E3E2E"/>
      <line x1="6" y1="0" x2="6" y2="6" stroke="#7E4636" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="260" fill="#7896C0"/>
  <rect y="210" width="600" height="50" fill="#708E56"/>
  <line x1="300" y1="0" x2="300" y2="260" stroke="#1D2F48" stroke-width="2"/>

  <!-- BEFORE: the house + a flat-topped cap box -->
  <text x="20" y="22" fill="#FFFFFF" font-weight="bold">before — the cap is a box</text>
  <text x="20" y="40" fill="#E8EEF6">a building prism, no floors, "&lt;id&gt;-roof", eaves → ridge</text>
  <polygon points="60,130 200,130 240,110 100,110" fill="#8A8C90"/>
  <rect x="60" y="130" width="140" height="80" fill="#A0563E"/>
  <polygon points="200,130 240,110 240,190 200,210" fill="#7E4430"/>
  <rect x="60" y="88" width="140" height="42" fill="#A0563E"/>
  <polygon points="60,88 200,88 240,68 100,68" fill="#8A8C90"/>
  <polygon points="200,88 240,68 240,110 200,130" fill="#7E4430"/>
  <g fill="#2C3E55"><rect x="78" y="150" width="16" height="20"/><rect x="112" y="150" width="16" height="20"/><rect x="146" y="150" width="16" height="20"/></g>
  <text x="20" y="236" fill="#FFFFFF">reads as one more storey</text>

  <!-- AFTER: the same house, the cap drawn as a gable with tiles -->
  <text x="320" y="22" fill="#FFFFFF" font-weight="bold">after — a gable over the cap (R-1)</text>
  <text x="320" y="40" fill="#E8EEF6">ridge along the longest side at the cap's top; tiles (R-2)</text>
  <rect x="360" y="130" width="140" height="80" fill="#A0563E"/>
  <polygon points="500,130 540,110 540,190 500,210" fill="#7E4430"/>
  <!-- the slope facing us, then the gable end (wall material) -->
  <polygon points="360,130 500,130 520,78 380,78" fill="url(#tiles)"/>
  <polygon points="500,130 540,110 520,78" fill="#8E4C36"/>
  <line x1="380" y1="78" x2="520" y2="78" stroke="#5A2E22" stroke-width="2"/>
  <g fill="#2C3E55"><rect x="378" y="150" width="16" height="20"/><rect x="412" y="150" width="16" height="20"/><rect x="446" y="150" width="16" height="20"/></g>
  <text x="320" y="236" fill="#FFFFFF">sight and fire keep the box (R-3); facades unchanged (R-4)</text>
</svg>
