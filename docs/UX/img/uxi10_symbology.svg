<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .cap   { font-size: 13px; font-weight: 600; fill: #111; }
    .box   { fill: #eef2f7; stroke: #7d8ea0; stroke-width: 1.2; }
    .boxok { fill: #e8f2e6; stroke: #4b8b3b; stroke-width: 1.2; }
    .boxbad{ fill: #fdeaea; stroke: #c62828; stroke-width: 1.2; }
    .t     { font-size: 11.5px; fill: #222; }
    .ts    { font-size: 10.5px; fill: #555; }
    .bad   { font-size: 12px; font-weight: 600; fill: #c62828; }
    .arr   { stroke: #4a5a6a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5a6a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- LEFT: resolution pipeline -->
  <text x="16" y="20" class="cap">Resolution pipeline — built, merged, network-aware</text>

  <rect x="16" y="32"  width="150" height="34" class="box"/>
  <text x="26" y="52"  class="t">TKB default</text><text x="26" y="63" class="ts">VisualData at spawn</text>

  <rect x="16" y="76"  width="150" height="34" class="box" stroke-dasharray="4 3"/>
  <text x="26" y="96"  class="t">DDS override</text><text x="26" y="107" class="ts">IgSymbolOverride — IG only</text>
  <text x="172" y="97" class="ts">← production map only;</text>
  <text x="172" y="109" class="ts">service maps skip this layer</text>

  <rect x="16" y="120" width="150" height="34" class="box"/>
  <text x="26" y="140" class="t">Operator config</text><text x="26" y="151" class="ts">MapUserConfig</text>

  <path class="arr" marker-end="url(#a)" d="M91,110 L91,120"/>
  <path class="arr" marker-end="url(#a)" d="M91,66 L91,76"/>
  <path class="arr" marker-end="url(#a)" d="M91,154 L91,174"/>

  <rect x="16" y="174" width="150" height="58" class="boxok"/>
  <text x="26" y="192" class="t" font-weight="600">StyleResolutionSystem</text>
  <text x="26" y="206" class="ts">278 lines · 3-layer merge</text>
  <text x="26" y="220" class="ts">writes ResolvedStyle</text>

  <rect x="16" y="248" width="150" height="76" class="boxok"/>
  <text x="26" y="266" class="t" font-weight="600">ResolvedStyle</text>
  <text x="26" y="280" class="ts">Tint · Affiliation</text>
  <text x="26" y="293" class="ts">DamageLevel</text>
  <text x="26" y="306" class="ts">TextureName · Label</text>
  <text x="26" y="319" class="ts">ShowTrail · ShowSensors</text>
  <path class="arr" marker-end="url(#a)" d="M91,232 L91,248"/>

  <rect x="16" y="344" width="150" height="46" class="box"/>
  <text x="26" y="362" class="t">Inspector text</text>
  <text x="26" y="376" class="ts">History trail · tooltip</text>
  <path class="arr" marker-end="url(#a)" d="M91,324 L91,344"/>
  <text x="100" y="338" class="ts">the only readers</text>

  <!-- MIDDLE: the break -->
  <path stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 6" fill="none"
        marker-end="url(#ar)" d="M172,278 L470,278"/>
  <text x="215" y="268" class="bad">no connection — the tint is never applied</text>
  <line x1="316" y1="252" x2="336" y2="304" stroke="#c62828" stroke-width="3"/>
  <line x1="336" y1="252" x2="316" y2="304" stroke="#c62828" stroke-width="3"/>

  <!-- RIGHT: render pipeline -->
  <text x="478" y="20" class="cap">Render pipeline — fed a DIS number and one hardcoded colour</text>

  <rect x="478" y="32" width="180" height="60" class="boxbad"/>
  <text x="488" y="50" class="t" font-weight="600">3 presentation gizmos</text>
  <text x="488" y="64" class="ts">Ig · SimHost · CGF — forked</text>
  <text x="488" y="78" class="ts">Editor registers two of them</text>

  <rect x="690" y="32" width="174" height="60" class="boxbad"/>
  <text x="700" y="50" class="t" font-weight="600">colour</text>
  <text x="700" y="64" class="ts">Rgba32(100,220,255) —</text>
  <text x="700" y="78" class="ts">hardcoded; CGF gets alpha 0</text>
  <path class="arr" marker-end="url(#a)" d="M658,62 L690,62"/>

  <rect x="478" y="112" width="180" height="60" class="box"/>
  <text x="488" y="130" class="t" font-weight="600">DebugPrimitive</text>
  <text x="488" y="144" class="ts">ProfileId (DIS) · Length/Width</text>
  <text x="488" y="158" class="ts">ConditionMask · Color</text>
  <path class="arr" marker-end="url(#a)" d="M568,92 L568,112"/>

  <rect x="478" y="192" width="180" height="60" class="box"/>
  <text x="488" y="210" class="t" font-weight="600">IEntityShapeLibrary</text>
  <text x="488" y="224" class="ts">GetShape(name, disType)</text>
  <text x="488" y="238" class="bad">name is always null</text>
  <path class="arr" marker-end="url(#a)" d="M568,172 L568,192"/>

  <rect x="690" y="192" width="174" height="60" class="boxbad"/>
  <text x="700" y="210" class="t" font-weight="600">DefaultEntityShapeLibrary</text>
  <text x="700" y="224" class="ts">4 shapes, hardcoded</text>
  <text x="700" y="238" class="ts">all 4 hosts pass this</text>
  <path class="arr" marker-end="url(#a)" d="M658,222 L690,222"/>

  <rect x="478" y="300" width="180" height="46" class="box"/>
  <text x="488" y="318" class="t">polylines on the map</text>
  <text x="488" y="332" class="ts">or a grey fallback rectangle</text>
  <path class="arr" marker-end="url(#a)" d="M568,252 L568,300"/>

  <text x="478" y="376" class="bad">Every entity: same shape family, same cyan,</text>
  <text x="478" y="392" class="bad">friend and hostile indistinguishable.</text>
  <text x="478" y="412" class="ts">ForceId's own XML doc says "Rendered as green / blue / red".</text>
</svg>
