<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .cap  { font-size: 13px; font-weight: 600; fill: #111; }
    .t    { font-size: 11.5px; fill: #222; }
    .ts   { font-size: 10.5px; fill: #666; }
    .ok   { fill: #e8f2e6; stroke: #4b8b3b; stroke-width: 1.2; }
    .dead { fill: #f2f2f2; stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bad  { fill: #fdeaea; stroke: #c62828; stroke-width: 1.2; }
    .badt { font-size: 11px; font-weight: 600; fill: #c62828; }
    .arr  { stroke: #4a5a6a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5a6a"/>
    </marker>
  </defs>

  <text x="16" y="20" class="cap">What a primitive passes through before it is drawn — five gates, one of them empty</text>

  <rect x="16"  y="40" width="118" height="62" class="ok"/>
  <text x="24" y="58" class="t" font-weight="600">1. Layer object</text>
  <text x="24" y="72" class="ts">LayerBitIndex vs</text>
  <text x="24" y="84" class="ts">ActiveLayerMask (32b)</text>
  <text x="24" y="97" class="ts">gizmo layer = bit 31</text>

  <rect x="156" y="40" width="130" height="62" class="bad"/>
  <text x="164" y="58" class="t" font-weight="600">2. SetLayerMask</text>
  <text x="164" y="74" class="badt">{ } — empty body</text>
  <text x="164" y="90" class="ts">the canvas mask dies here</text>

  <rect x="308" y="40" width="126" height="62" class="ok"/>
  <text x="316" y="58" class="t" font-weight="600">3. TargetView</text>
  <text x="316" y="74" class="ts">Map2D vs other</text>
  <text x="316" y="90" class="ts">pipelines</text>

  <rect x="456" y="40" width="140" height="62" class="ok"/>
  <text x="464" y="58" class="t" font-weight="600">4. DebugLayer byte</text>
  <text x="464" y="74" class="ts">vs LayerMask256</text>
  <text x="464" y="90" class="badt">3 of 256 bits used</text>

  <rect x="618" y="40" width="126" height="62" class="ok"/>
  <text x="626" y="58" class="t" font-weight="600">5. Zoom LOD</text>
  <text x="626" y="74" class="ts">Min/MaxZoomLod</text>
  <text x="626" y="90" class="ts">per primitive</text>

  <path class="arr" marker-end="url(#a)" d="M134,71 L156,71"/>
  <path class="arr" marker-end="url(#a)" d="M286,71 L308,71"/>
  <path class="arr" marker-end="url(#a)" d="M434,71 L456,71"/>
  <path class="arr" marker-end="url(#a)" d="M596,71 L618,71"/>
  <path class="arr" marker-end="url(#a)" d="M681,102 L681,126"/>
  <text x="694" y="120" class="t">drawn</text>

  <!-- disconnected -->
  <text x="16" y="164" class="cap">…and what never reaches the symbol at all</text>

  <rect x="16" y="180" width="200" height="66" class="dead"/>
  <text x="24" y="198" class="t" font-weight="600">MapDisplayComponent.LayerMask</text>
  <text x="24" y="214" class="ts">5 named layers, recomputed per</text>
  <text x="24" y="226" class="ts">entity every 3 s — read only by</text>
  <text x="24" y="238" class="ts">selection rings and picking</text>

  <rect x="240" y="180" width="184" height="66" class="dead"/>
  <text x="248" y="198" class="t" font-weight="600">GlobalDebugSettings</text>
  <text x="248" y="214" class="ts">DebugLayerMask (16 bits)</text>
  <text x="248" y="226" class="ts">+ ForceAllGizmosVisible</text>
  <text x="248" y="238" class="ts">"deferred to GZ015" — dead</text>

  <rect x="448" y="180" width="184" height="66" class="dead"/>
  <text x="456" y="198" class="t" font-weight="600">IGizmoVisibilityPolicy</text>
  <text x="456" y="214" class="ts">per-gizmo-type gate</text>
  <text x="456" y="226" class="ts">Always / Never only</text>
  <text x="456" y="238" class="ts">⭐ UXI-10 §3.4 starts using it</text>

  <rect x="656" y="180" width="148" height="66" class="ok"/>
  <text x="664" y="198" class="t" font-weight="600">CullingState</text>
  <text x="664" y="214" class="ts">viewport + LOD</text>
  <text x="664" y="226" class="ts">the real gate on the</text>
  <text x="664" y="238" class="ts">entity symbol today</text>

  <text x="16" y="274" class="ts">Four independent sources define what a "layer" even is: a hardcoded 5-entry registry, a DDS LayerTreeJson mirror of it,</text>
  <text x="16" y="288" class="ts">seven hardcoded ImGui checkboxes, and a three-field DTO with unrelated names.</text>
</svg>
