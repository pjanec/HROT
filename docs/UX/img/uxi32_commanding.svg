<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .cap  { font-size: 13px; font-weight: 600; fill: #111; }
    .sub  { font-size: 11px; fill: #666; }
    .t    { font-size: 11.5px; fill: #222; }
    .tb   { font-size: 11.5px; fill: #222; font-weight: 600; }
    .ts   { font-size: 10.5px; fill: #666; }
    .ok   { fill: #e8f2e6; stroke: #4b8b3b; stroke-width: 1.2; }
    .hub  { fill: #fff6d9; stroke: #c9a227; stroke-width: 2; }
    .dead { fill: #f2f2f2; stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bad  { fill: #fdeaea; stroke: #c62828; stroke-width: 1.2; }
    .badt { font-size: 10.5px; font-weight: 600; fill: #c62828; }
    .goldt{ font-size: 10.5px; font-weight: 600; fill: #8a6d1a; }
    .arr  { stroke: #4a5a6a; stroke-width: 1.6; fill: none; }
    .arrq { stroke: #c62828; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5a6a"/>
    </marker>
    <marker id="aq" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="16" y="20" class="cap">How a command reaches an entity brain — one choke point, and the nine ids that never reach it</text>
  <text x="16" y="37" class="sub">every link below was read in source · gold = the seam · red dashed = the open question</text>

  <!-- ── the established chain, left column ── -->
  <rect x="16" y="56" width="250" height="52" class="ok"/>
  <text x="26" y="74" class="tb">MissionControlCommand</text>
  <text x="26" y="89" class="ts">EntityId · CommandType · MissionPlan?</text>
  <text x="26" y="102" class="ts">"a mission plan OR imperative"</text>

  <rect x="16" y="124" width="250" height="52" class="ok"/>
  <text x="26" y="142" class="tb">MissionPlanQueue (ECS)</text>
  <text x="26" y="157" class="ts">≤ 8 phases · NoSave</text>
  <text x="26" y="170" class="ts">phase = behavior + ONE trigger</text>

  <rect x="16" y="192" width="250" height="52" class="ok"/>
  <text x="26" y="210" class="tb">MissionDirector → MissionAdapter</text>
  <text x="26" y="225" class="ts">trigger fires → phase advances</text>
  <text x="26" y="238" class="ts">never writes BehaviorState itself</text>

  <line x1="141" y1="108" x2="141" y2="120" class="arr" marker-end="url(#a)"/>
  <line x1="141" y1="176" x2="141" y2="188" class="arr" marker-end="url(#a)"/>

  <!-- ── the hub ── -->
  <rect x="16" y="268" width="560" height="60" class="hub"/>
  <text x="26" y="288" class="tb">AssignTacticalIntentEvent { Entity, string IntentId, string JsonParams }</text>
  <text x="26" y="305" class="goldt">THE CHOKE POINT — any node may publish; both gates already exist</text>
  <text x="26" y="320" class="ts">a mission phase and an operator's right-click can converge here</text>

  <line x1="141" y1="244" x2="141" y2="264" class="arr" marker-end="url(#a)"/>

  <!-- ── complementary gates ── -->
  <rect x="16" y="348" width="270" height="56" class="ok"/>
  <text x="26" y="366" class="tb">owner: HasAuthority&lt;BehaviorState&gt;</text>
  <text x="26" y="381" class="ts">TacticalIntentResolutionSystem</text>
  <text x="26" y="395" class="ts">→ mapper, or pass-through by name</text>

  <rect x="306" y="348" width="270" height="56" class="ok"/>
  <text x="316" y="366" class="tb">non-owner: !HasAuthority</text>
  <text x="316" y="381" class="ts">TacticalIntentEgressTranslator</text>
  <text x="316" y="395" class="ts">→ TacticalIntentRequest over DDS</text>

  <line x1="151" y1="328" x2="151" y2="344" class="arr" marker-end="url(#a)"/>
  <line x1="441" y1="328" x2="441" y2="344" class="arr" marker-end="url(#a)"/>

  <rect x="16" y="424" width="560" height="52" class="ok"/>
  <text x="26" y="442" class="tb">AssignBehaviorEvent → BehaviorIngressSystem (Input phase)</text>
  <text x="26" y="457" class="ts">the SOLE writer of BehaviorState — nothing else may touch it</text>
  <text x="26" y="470" class="ts">≥ 1 frame latency by design</text>

  <line x1="151" y1="404" x2="151" y2="420" class="arr" marker-end="url(#a)"/>

  <!-- ── right column: the nine ids ── -->
  <rect x="616" y="56" width="248" height="112" class="bad"/>
  <text x="626" y="74" class="tb">The nine menu ids</text>
  <text x="626" y="91" class="ts">MoveHere · Engage · Stop</text>
  <text x="626" y="106" class="ts">Repair · Reinforce · Resupply · Transfer</text>
  <text x="626" y="121" class="ts">Properties · Teleport</text>
  <text x="626" y="140" class="badt">ZERO are a registered intent,</text>
  <text x="626" y="154" class="badt">a mapper, or a behavior name</text>

  <rect x="616" y="188" width="248" height="76" class="dead"/>
  <text x="626" y="206" class="tb">Registered mappers, in production</text>
  <text x="626" y="223" class="ts">DefendArea · HullDownAttack</text>
  <text x="626" y="238" class="ts">— that is the whole vocabulary</text>
  <text x="626" y="256" class="ts">CGF and Editor register the same pair</text>

  <path d="M740,168 L740,184" class="arr" marker-end="url(#a)"/>
  <path d="M740,264 L740,290 L582,290" class="arrq" marker-end="url(#aq)"/>
  <text x="596" y="279" class="badt">Q: mission mutation, or direct intent?</text>

  <rect x="616" y="348" width="248" height="128" class="dead"/>
  <text x="626" y="366" class="tb">Three kinds, not one</text>
  <text x="626" y="384" class="ts">orders → this chain</text>
  <text x="626" y="399" class="ts">MoveHere · Engage · Stop</text>
  <text x="626" y="418" class="ts">sustainment → state, not behavior</text>
  <text x="626" y="433" class="ts">Repair · Reinforce · Resupply · Transfer</text>
  <text x="626" y="452" class="ts">not commands at all</text>
  <text x="626" y="467" class="ts">Properties (UI) · Teleport (pose)</text>
</svg>
