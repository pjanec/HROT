<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="560" fill="#f6f7f9"/>
  <!-- toolbar -->
  <rect x="10" y="10" width="940" height="44" rx="4" fill="#2f3b4c"/>
  <text x="22" y="37" fill="#fff" font-weight="bold">File  Edit  View</text>
  <rect x="170" y="18" width="130" height="28" rx="14" fill="#3f8f4f"/>
  <text x="186" y="37" fill="#fff">● EDIT ▾  (mode)</text>
  <text x="318" y="37" fill="#fff">▶  ⏸  ⏭  ■   1×</text>
  <text x="470" y="37" fill="#cfd8e3">Tools: ⬚ select · ✚ place · ⟋ route · ▱ area · ✎ draw · ⟲ rotate</text>
  <!-- outliner -->
  <rect x="10" y="62" width="200" height="380" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="20" y="82" font-weight="bold">Outliner</text>
  <text x="20" y="102" fill="#667">🔍 search · Command | Layers</text>
  <text x="24" y="126">▾ Blue force</text>
  <text x="40" y="146">▾ 1st Platoon HQ</text>
  <text x="56" y="166" fill="#1d5fbf">▸ Alpha squad (selected)</text>
  <text x="56" y="186">▸ Bravo squad</text>
  <text x="24" y="210">▸ Red force</text>
  <text x="24" y="230">▸ Civilians</text>
  <text x="24" y="254">▾ Layers</text>
  <text x="40" y="274">👁 🔒 Routes</text>
  <text x="40" y="294">👁 🔒 Objectives</text>
  <text x="40" y="314">👁 🔒 Weather regions</text>
  <!-- map -->
  <rect x="218" y="62" width="452" height="380" rx="4" fill="#dfe8d6" stroke="#c9ced6"/>
  <text x="228" y="82" font-weight="bold">Map  (2-D / 3-D)</text>
  <circle cx="420" cy="240" r="9" fill="#1d5fbf"/>
  <circle cx="420" cy="240" r="16" fill="none" stroke="#f0a020" stroke-width="2"/>
  <path d="M420 240 L500 200 L560 230" stroke="#1d5fbf" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <circle cx="590" cy="150" r="9" fill="#c0392b"/>
  <text x="300" y="420" fill="#556">select · drag · right-click = actions</text>
  <!-- details -->
  <rect x="678" y="62" width="272" height="380" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="688" y="82" font-weight="bold">Details — Alpha squad</text>
  <rect x="688" y="92" width="50" height="22" fill="#2f3b4c"/><text x="696" y="108" fill="#fff">Unit</text>
  <rect x="740" y="92" width="62" height="22" fill="#e3e7ec"/><text x="746" y="108">Orders</text>
  <rect x="804" y="92" width="52" height="22" fill="#e3e7ec"/><text x="810" y="108">Brain</text>
  <rect x="858" y="92" width="84" height="22" fill="#e3e7ec"/><text x="864" y="108">Rules  ⋯</text>
  <text x="690" y="140">Name / callsign  [ Alpha 1-1      ]</text>
  <text x="690" y="164">Side             [ Friendly    ▾ ]</text>
  <text x="690" y="188">Type             [ Rifle squad ▾ ]</text>
  <text x="690" y="212">Posture at start [ Prone       ▾ ]</text>
  <text x="690" y="236">Strength   8 / 9   ▮▮▮▮▮▮▮▮▯</text>
  <text x="690" y="260">Ammunition 85 %  [ Resupply… ]</text>
  <text x="690" y="284">Playable         [✓]  slot [ A1 ]</text>
  <text x="690" y="320" fill="#667">Edit: undoable (Ctrl+Z)</text>
  <text x="690" y="340" fill="#667">Live: confirm, then ✓ applied</text>
  <text x="690" y="360" fill="#667">Review: read-only + notes</text>
  <text x="690" y="420" fill="#99a">Components (debug) is the last tab</text>
  <!-- timeline / messages -->
  <rect x="10" y="450" width="660" height="100" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="20" y="470" font-weight="bold">Timeline  (Live / Review)</text>
  <line x1="20" y1="505" x2="660" y2="505" stroke="#8895a7" stroke-width="2"/>
  <line x1="400" y1="485" x2="400" y2="525" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="500">◆ contact</text><text x="250" y="500">◆ objective taken</text><text x="430" y="500">🔖 note</text>
  <text x="20" y="540" fill="#667">events · bookmarks · notes · director tracks (when used)</text>
  <rect x="678" y="450" width="272" height="100" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="688" y="470" font-weight="bold">Messages</text>
  <text x="688" y="494">✓ Move applied (owned by CGF)</text>
  <text x="688" y="516" fill="#c0392b">✗ Delete refused — unit is a player</text>
  <text x="688" y="538" fill="#667">⏳ Weather change pending</text>
</svg>
