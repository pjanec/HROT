<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="520" fill="#f6f7f9"/>
  <!-- map -->
  <rect x="10" y="10" width="560" height="500" rx="4" fill="#dfe8d6" stroke="#c9ced6"/>
  <text x="20" y="30" font-weight="bold">Map — the selected unit's plan drawn on it</text>
  <circle cx="90" cy="420" r="10" fill="#1d5fbf"/><text x="70" y="448">Alpha 1-1</text>
  <path d="M90 420 L210 330 L330 300" stroke="#1d5fbf" stroke-width="2.5" fill="none"/>
  <circle cx="210" cy="330" r="12" fill="#fff" stroke="#1d5fbf" stroke-width="2"/><text x="205" y="335" font-weight="bold">1</text>
  <circle cx="330" cy="300" r="12" fill="#fff" stroke="#1d5fbf" stroke-width="2"/><text x="325" y="305" font-weight="bold">2</text>
  <text x="300" y="335" fill="#1d5fbf">Hold until Phase 2</text>
  <path d="M330 300 L450 170" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="7 4"/>
  <polygon points="450,170 436,176 446,186" fill="#c0392b"/>
  <circle cx="400" cy="225" r="12" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="395" y="230" font-weight="bold">3</text>
  <rect x="440" y="120" width="80" height="50" fill="none" stroke="#c0392b" stroke-width="2"/><text x="446" y="112" fill="#c0392b">OBJ BLUE</text>
  <line x1="160" y1="60" x2="160" y2="490" stroke="#7a4fa0" stroke-width="2" stroke-dasharray="10 6"/><text x="166" y="76" fill="#7a4fa0">PL RED</text>
  <text x="20" y="500" fill="#556">right-click: Add task ▸ Move here · Hold here … · drag a marker to move it</text>
  <!-- details orders tab -->
  <rect x="580" y="10" width="370" height="330" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="590" y="30" font-weight="bold">Details — Alpha 1-1 · Orders</text>
  <text x="590" y="52" fill="#667">Plan  (3 tasks)              ▶ running · task 2</text>
  <rect x="590" y="62" width="350" height="50" fill="#eef3fb" stroke="#c9d6ea"/>
  <text x="598" y="80" font-weight="bold">1  Move</text><text x="660" y="80">to  ◎ grid 3412 · on roads</text>
  <text x="598" y="100" fill="#3f8f4f">✓ done</text><text x="660" y="100" fill="#667">then: when there</text>
  <rect x="590" y="116" width="350" height="50" fill="#fff7e6" stroke="#f0c36d"/>
  <text x="598" y="134" font-weight="bold">2  Hold</text><text x="660" y="134">at  ◎ grid 3618</text>
  <text x="598" y="154" fill="#b07800">▶ now</text><text x="660" y="154">then: when Phase 2 begins</text>
  <rect x="590" y="170" width="350" height="50" fill="#fff" stroke="#d5d9df"/>
  <text x="598" y="188" font-weight="bold">3  Attack</text><text x="660" y="188">OBJ BLUE  (area)</text>
  <text x="598" y="208" fill="#667">planned</text><text x="660" y="208">then: when cleared · give up after 20 min</text>
  <text x="598" y="244" fill="#1d5fbf">+ Add task ▾   (Move · Hold · Attack · Defend · Recon · …)</text>
  <text x="598" y="266" fill="#667">Advanced: run a specific behaviour…</text>
  <text x="598" y="296" fill="#667">Live: Jump to task · Stop plan     (edits apply at once)</text>
  <text x="598" y="320" fill="#99a">▸ Details for experts (ids, version)</text>
  <!-- timeline sync -->
  <rect x="580" y="350" width="370" height="160" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="590" y="370" font-weight="bold">Timeline — Tasks (all units, by phase)</text>
  <text x="590" y="394" fill="#7a4fa0">Phase 1 Approach</text><text x="760" y="394" fill="#7a4fa0">Phase 2 Assault</text>
  <line x1="750" y1="380" x2="750" y2="500" stroke="#7a4fa0" stroke-dasharray="4 3"/>
  <text x="590" y="420">Alpha 1-1</text><rect x="660" y="408" width="50" height="16" fill="#cfe0f7"/><rect x="712" y="408" width="36" height="16" fill="#ffe2a8"/><rect x="752" y="408" width="120" height="16" fill="#f5c6c0"/>
  <text x="590" y="446">Bravo 1-2</text><rect x="660" y="434" width="86" height="16" fill="#cfe0f7"/><rect x="752" y="434" width="90" height="16" fill="#f5c6c0"/>
  <text x="590" y="472">Mortar sec</text><rect x="660" y="460" width="86" height="16" fill="#ffe2a8"/><rect x="752" y="460" width="60" height="16" fill="#e2d4f0"/>
  <text x="590" y="500" fill="#667">blue move · amber hold · red attack · purple fire</text>
</svg>
