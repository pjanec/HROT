<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <rect width="960" height="600" fill="#ffffff"/>
  <!-- title bar -->
  <rect x="0" y="0" width="960" height="26" fill="#2b3a4a"/>
  <text x="10" y="17" fill="#ffffff" font-weight="bold">Replay Browser — Director workspace (the same panel docks in the editor)</text>
  <text x="700" y="17" fill="#b8c7d6">recording: exercise 7f3a… · take: main</text>

  <!-- bin -->
  <rect x="8" y="34" width="170" height="300" fill="#f4f6f8" stroke="#9aa7b3"/>
  <text x="16" y="52" font-weight="bold">Bin</text>
  <text x="16" y="72">▸ Takes (this recording)</text>
  <text x="28" y="90" fill="#1f5fa8">main ●</text>
  <text x="28" y="106">wide</text>
  <text x="28" y="122">sniper-pov</text>
  <text x="16" y="146">▸ Reels (films/)</text>
  <text x="28" y="164">features</text>
  <text x="28" y="180">civilians</text>
  <text x="16" y="208" fill="#6b7785">[ Promote to scenario take ]</text>
  <text x="16" y="228" fill="#6b7785">[ Scout recording ]</text>
  <text x="16" y="248" fill="#6b7785">[ Render… ]</text>

  <!-- viewport -->
  <rect x="186" y="34" width="560" height="300" fill="#dfe8df" stroke="#9aa7b3"/>
  <text x="196" y="52" font-weight="bold">Viewport — 3-D / 2-D map</text>
  <text x="560" y="52" fill="#a33">PILOT camera  [P] ⇄ PROGRAM</text>
  <rect x="250" y="80" width="430" height="242" fill="none" stroke="#c08a00" stroke-dasharray="6 4"/>
  <text x="256" y="94" fill="#c08a00">16:9 safe frame</text>
  <!-- camera path -->
  <path d="M290 280 C 360 200, 460 300, 560 170 S 650 120, 660 110" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <polygon points="290,280 276,270 280,288" fill="#1f5fa8"/>
  <polygon points="430,236 416,226 420,244" fill="#1f5fa8"/>
  <polygon points="560,170 546,160 550,178" fill="#1f5fa8"/>
  <polygon points="660,110 646,100 650,118" fill="#1f5fa8"/>
  <text x="296" y="300" fill="#1f5fa8">K1</text>
  <text x="436" y="256" fill="#1f5fa8">K2</text>
  <text x="566" y="190" fill="#1f5fa8">K3</text>
  <text x="666" y="130" fill="#1f5fa8">K4</text>
  <!-- unit + film graphic -->
  <rect x="470" y="250" width="22" height="12" fill="#556b2f"/>
  <text x="498" y="261">Tank 1</text>
  <circle cx="481" cy="256" r="20" fill="none" stroke="#d0342c" stroke-width="2"/>
  <line x1="500" y1="240" x2="600" y2="215" stroke="#d0342c" stroke-width="2"/>
  <polygon points="600,215 588,212 591,222" fill="#d0342c"/>
  <text x="560" y="236" fill="#d0342c">film arrow</text>
  <rect x="330" y="300" width="270" height="18" fill="#000000" fill-opacity="0.55"/>
  <text x="340" y="313" fill="#ffffff">The platoon crosses phase line BLUE</text>

  <!-- inspector -->
  <rect x="754" y="34" width="198" height="300" fill="#f4f6f8" stroke="#9aa7b3"/>
  <text x="762" y="52" font-weight="bold">Inspector — key K3</text>
  <text x="762" y="74">at:  cross(Tank 1, BLUE) −0.5</text>
  <text x="762" y="92">camera: over Tank 1 → Enemy</text>
  <text x="762" y="110">tied to: Tank 1 (relative)</text>
  <text x="762" y="128">fov: 50°</text>
  <text x="762" y="150" font-weight="bold">transition in</text>
  <text x="762" y="168">(•) fly  2.0 s  ease InOut</text>
  <text x="762" y="186">( ) cut</text>
  <text x="762" y="204">( ) dip  0.4 / 0.4 s  black</text>
  <text x="762" y="226">[x] still → regression artefact</text>
  <text x="762" y="252" fill="#6b7785">[Update from view]  [Go to]</text>

  <!-- transport -->
  <rect x="8" y="342" width="944" height="28" fill="#e9edf1" stroke="#9aa7b3"/>
  <text x="16" y="361">|◀  ◀◀  ▶  ▶▶  ▶|   J K L   I / O   K = key</text>
  <text x="330" y="361">(•) PROGRAM  ( ) SOURCE</text>
  <text x="560" y="361">film 01:42.3 / 03:10.0   ·   exercise 00:12:31.4</text>

  <!-- timeline -->
  <rect x="8" y="376" width="944" height="216" fill="#fbfcfd" stroke="#9aa7b3"/>
  <line x1="110" y1="388" x2="944" y2="388" stroke="#9aa7b3"/>
  <text x="110" y="384" font-size="10" fill="#6b7785">0:00</text>
  <text x="300" y="384" font-size="10" fill="#6b7785">0:30</text>
  <text x="490" y="384" font-size="10" fill="#6b7785">1:00</text>
  <text x="680" y="384" font-size="10" fill="#6b7785">1:30</text>
  <text x="870" y="384" font-size="10" fill="#6b7785">2:00</text>
  <!-- labels -->
  <g font-weight="bold">
    <text x="16" y="406">Markers</text>
    <text x="16" y="432">Time</text>
    <text x="16" y="458">Camera</text>
    <text x="16" y="484">Subtitles</text>
    <text x="16" y="510">View</text>
    <text x="16" y="536">Graphics</text>
    <text x="16" y="562">Audio</text>
  </g>
  <!-- markers -->
  <g fill="#c08a00">
    <polygon points="180,400 186,406 180,412 174,406"/>
    <polygon points="240,400 246,406 240,412 234,406"/>
    <polygon points="420,400 426,406 420,412 414,406"/>
    <polygon points="610,400 616,406 610,412 604,406"/>
    <polygon points="760,400 766,406 760,412 754,406"/>
  </g>
  <text x="250" y="410" font-size="10" fill="#6b7785">shot · blast · death · cross · enter · bookmark</text>
  <!-- time track -->
  <rect x="110" y="422" width="250" height="16" fill="#9cc3e6"/>
  <rect x="360" y="422" width="40" height="16" fill="#cccccc"/>
  <text x="362" y="434" font-size="9">skip ×8</text>
  <rect x="400" y="422" width="160" height="16" fill="#9cc3e6"/>
  <rect x="560" y="422" width="90" height="16" fill="#f2c6a0"/>
  <text x="566" y="434" font-size="10">0.25× slow</text>
  <rect x="650" y="422" width="290" height="16" fill="#9cc3e6"/>
  <!-- camera keys -->
  <line x1="110" y1="456" x2="940" y2="456" stroke="#1f5fa8" stroke-dasharray="2 3"/>
  <g fill="#1f5fa8">
    <rect x="114" y="450" width="10" height="12"/>
    <rect x="300" y="450" width="10" height="12"/>
    <rect x="566" y="450" width="10" height="12"/>
    <rect x="700" y="450" width="10" height="12"/>
  </g>
  <rect x="200" y="452" width="100" height="8" fill="#1f5fa8" fill-opacity="0.25"/>
  <text x="220" y="472" font-size="9" fill="#1f5fa8">fly 2.0 s</text>
  <text x="560" y="472" font-size="9" fill="#1f5fa8">cut</text>
  <rect x="688" y="450" width="12" height="12" fill="#000000"/>
  <text x="712" y="472" font-size="9">dip</text>
  <!-- subtitles -->
  <rect x="150" y="476" width="160" height="14" fill="#d9d2e9"/>
  <text x="156" y="487" font-size="10">Title: Crossing BLUE</text>
  <rect x="420" y="476" width="200" height="14" fill="#d9d2e9"/>
  <text x="426" y="487" font-size="10">The platoon crosses…</text>
  <!-- view -->
  <rect x="110" y="502" width="190" height="14" fill="#cfe2cf"/>
  <text x="116" y="513" font-size="10">2-D · symbols on</text>
  <rect x="300" y="502" width="640" height="14" fill="#b7d7b7"/>
  <text x="306" y="513" font-size="10">3-D · layers off</text>
  <!-- graphics -->
  <rect x="440" y="528" width="160" height="14" fill="#f4b6b2"/>
  <text x="446" y="539" font-size="10">ring + arrow</text>
  <!-- audio -->
  <rect x="110" y="554" width="830" height="14" fill="#e8e8e8"/>
  <rect x="560" y="554" width="90" height="14" fill="#f2c6a0"/>
  <text x="566" y="565" font-size="9">cues at film time</text>
  <!-- playhead -->
  <line x1="590" y1="388" x2="590" y2="590" stroke="#d0342c" stroke-width="2"/>
  <polygon points="584,388 596,388 590,396" fill="#d0342c"/>
</svg>
