<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1000" height="600" fill="#1e1f22"/>

  <!-- ===== A. LIVE ===== -->
  <text x="20" y="28" fill="#9aa0a6" font-size="14" font-weight="bold">A · LIVE (playing) — the toolbar and the timeline on a live cluster host</text>
  <rect x="20" y="40" width="960" height="34" rx="4" fill="#2b2d31" stroke="#3c3f44"/>
  <text x="34" y="62" fill="#e8eaed">⏸</text>
  <text x="58" y="62" fill="#e8eaed">⏭</text>
  <text x="82" y="62" fill="#e8eaed">■</text>
  <text x="110" y="62" fill="#e8eaed">12:31.4</text>
  <text x="172" y="62" fill="#e8eaed">1×</text>
  <rect x="210" y="47" width="96" height="20" rx="3" fill="#3a4a63" stroke="#5b7bb0"/>
  <text x="222" y="62" fill="#cfe0ff">⟲ Review</text>
  <rect x="320" y="47" width="86" height="20" rx="3" fill="#2b2d31" stroke="#5f6368"/>
  <rect x="321" y="48" width="42" height="18" rx="2" fill="#4c5a70"/>
  <text x="330" y="62" fill="#ffffff">SIM</text>
  <text x="370" y="62" fill="#9aa0a6">wall</text>
  <text x="430" y="62" fill="#81c995">● LIVE</text>

  <rect x="20" y="82" width="960" height="70" rx="4" fill="#26282c" stroke="#3c3f44"/>
  <line x1="40" y1="100" x2="900" y2="100" stroke="#5f6368"/>
  <text x="40" y="96" fill="#9aa0a6" font-size="11">0:00</text>
  <text x="460" y="96" fill="#9aa0a6" font-size="11">6:00</text>
  <text x="880" y="96" fill="#9aa0a6" font-size="11">12:31</text>
  <rect x="40" y="108" width="860" height="10" fill="#3a3c40"/>
  <circle cx="200" cy="113" r="3" fill="#f28b82"/><circle cx="420" cy="113" r="3" fill="#f28b82"/><circle cx="610" cy="113" r="3" fill="#f28b82"/>
  <rect x="40" y="124" width="860" height="10" fill="#3a3c40"/>
  <circle cx="300" cy="129" r="3" fill="#fdd663"/><circle cx="700" cy="129" r="3" fill="#fdd663"/>
  <line x1="900" y1="100" x2="900" y2="140" stroke="#81c995" stroke-width="2"/>
  <text x="906" y="122" fill="#81c995" font-size="11">now</text>
  <text x="560" y="148" fill="#9aa0a6" font-size="11">click in the past → ENTERS A REVIEW there (R10) · the history is appended live</text>

  <!-- ===== B. REVIEW, SIM ===== -->
  <text x="20" y="190" fill="#9aa0a6" font-size="14" font-weight="bold">B · REVIEW, SIM axis — paused stretches collapsed to ticks, played over</text>
  <rect x="20" y="202" width="960" height="34" rx="4" fill="#3a2e1c" stroke="#e8a33d"/>
  <rect x="26" y="208" width="64" height="22" rx="3" fill="#e8a33d"/>
  <text x="33" y="224" fill="#1e1f22" font-weight="bold">REVIEW</text>
  <text x="100" y="224" fill="#e8eaed">▶</text>
  <text x="124" y="224" fill="#e8eaed">⏭</text>
  <text x="150" y="224" fill="#e8eaed">07:04.0</text>
  <text x="212" y="224" fill="#9aa0a6">/ 12:31.4  (−05:27)</text>
  <text x="352" y="224" fill="#e8eaed">2×</text>
  <rect x="380" y="209" width="86" height="20" rx="3" fill="#2b2d31" stroke="#5f6368"/>
  <rect x="381" y="210" width="42" height="18" rx="2" fill="#4c5a70"/>
  <text x="390" y="224" fill="#ffffff">SIM</text>
  <text x="430" y="224" fill="#9aa0a6">wall</text>
  <rect x="480" y="209" width="122" height="20" rx="3" fill="#2d4a35" stroke="#81c995"/>
  <text x="490" y="224" fill="#c8f0d3">● Back to live</text>

  <rect x="20" y="244" width="960" height="84" rx="4" fill="#26282c" stroke="#3c3f44"/>
  <line x1="40" y1="262" x2="900" y2="262" stroke="#5f6368"/>
  <text x="40" y="258" fill="#9aa0a6" font-size="11">0:00 sim</text>
  <text x="880" y="258" fill="#9aa0a6" font-size="11">10:02 sim</text>
  <rect x="40" y="270" width="860" height="10" fill="#3a3c40"/>
  <circle cx="230" cy="275" r="3" fill="#f28b82"/><circle cx="470" cy="275" r="3" fill="#f28b82"/><circle cx="680" cy="275" r="3" fill="#f28b82"/>
  <!-- collapsed pauses -->
  <line x1="180" y1="266" x2="180" y2="300" stroke="#bdc1c6" stroke-width="2"/>
  <circle cx="180" cy="303" r="4" fill="none" stroke="#bdc1c6" stroke-width="1.5"/>
  <line x1="520" y1="266" x2="520" y2="300" stroke="#bdc1c6" stroke-width="2"/>
  <circle cx="520" cy="303" r="4" fill="#bdc1c6"/>
  <text x="528" y="306" fill="#bdc1c6" font-size="11">pause with edits — they appear here at once</text>
  <!-- checkpoint -->
  <path d="M 360 266 L 360 286 L 372 280 Z" fill="#8ab4f8"/>
  <text x="376" y="284" fill="#8ab4f8" font-size="11">before-assault</text>
  <!-- playhead and live point -->
  <line x1="620" y1="262" x2="620" y2="310" stroke="#e8a33d" stroke-width="2"/>
  <line x1="900" y1="262" x2="900" y2="310" stroke="#81c995" stroke-width="3"/>
  <text x="906" y="290" fill="#81c995" font-size="11">live point</text>
  <text x="40" y="322" fill="#9aa0a6" font-size="11">scrub / click = seek in the review · reaching the live point pauses · ◯ unchanged pause · ● changed pause</text>

  <!-- ===== C. REVIEW, WALL ===== -->
  <text x="20" y="366" fill="#9aa0a6" font-size="14" font-weight="bold">C · REVIEW, WALL axis — the same session after the switch: pauses as shaded spans, played through</text>
  <rect x="20" y="378" width="960" height="34" rx="4" fill="#3a2e1c" stroke="#e8a33d"/>
  <rect x="26" y="384" width="64" height="22" rx="3" fill="#e8a33d"/>
  <text x="33" y="400" fill="#1e1f22" font-weight="bold">REVIEW</text>
  <text x="100" y="400" fill="#e8eaed">▶</text>
  <text x="124" y="400" fill="#e8eaed">⏭</text>
  <text x="150" y="400" fill="#e8eaed">09:17.6</text>
  <text x="212" y="400" fill="#9aa0a6">/ 14:58.0  (−05:40)</text>
  <rect x="380" y="385" width="86" height="20" rx="3" fill="#2b2d31" stroke="#5f6368"/>
  <rect x="423" y="386" width="42" height="18" rx="2" fill="#4c5a70"/>
  <text x="390" y="400" fill="#9aa0a6">SIM</text>
  <text x="430" y="400" fill="#ffffff">wall</text>
  <rect x="480" y="385" width="122" height="20" rx="3" fill="#2d4a35" stroke="#81c995"/>
  <text x="490" y="400" fill="#c8f0d3">● Back to live</text>

  <rect x="20" y="420" width="960" height="84" rx="4" fill="#26282c" stroke="#3c3f44"/>
  <line x1="40" y1="438" x2="900" y2="438" stroke="#5f6368"/>
  <text x="40" y="434" fill="#9aa0a6" font-size="11">0:00 wall</text>
  <text x="870" y="434" fill="#9aa0a6" font-size="11">14:58 wall</text>
  <rect x="150" y="440" width="70" height="44" fill="#5f6368" opacity="0.35"/>
  <text x="152" y="496" fill="#9aa0a6" font-size="11">paused 1:12</text>
  <rect x="440" y="440" width="130" height="44" fill="#bdc1c6" opacity="0.35"/>
  <text x="442" y="496" fill="#bdc1c6" font-size="11">paused 2:08, edited</text>
  <rect x="40" y="446" width="860" height="10" fill="#3a3c40" opacity="0.8"/>
  <circle cx="250" cy="451" r="3" fill="#f28b82"/><circle cx="590" cy="451" r="3" fill="#f28b82"/><circle cx="760" cy="451" r="3" fill="#f28b82"/>
  <line x1="700" y1="438" x2="700" y2="486" stroke="#e8a33d" stroke-width="2"/>
  <line x1="900" y1="438" x2="900" y2="486" stroke="#81c995" stroke-width="3"/>
  <text x="906" y="466" fill="#81c995" font-size="11">live point</text>

  <!-- legend -->
  <text x="20" y="540" fill="#9aa0a6" font-size="12">The switch (SIM / wall) is one session setting held by the cluster master (R-3058): it changes the ruler, what a seek means and whether playback skips paused stretches —</text>
  <text x="20" y="558" fill="#9aa0a6" font-size="12">for every operator at once. It keeps the frame on screen. The time readout shows the playhead and the live point on the active axis.</text>
  <text x="20" y="582" fill="#5f6368" font-size="11">Mock-up of DESIGN_Replay_Time_Axis_And_Review.md §9 — not a screenshot.</text>
</svg>
