<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1010" viewBox="0 0 1040 1010" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1040" height="1010" fill="#ffffff"/>
  <style>
    .bar { fill:#f1f3f4; stroke:#80868b; }
    .btn { fill:#ffffff; stroke:#5f6368; }
    .on  { fill:#d2e3fc; stroke:#1a73e8; }
    .lbl { fill:#202124; }
    .dim { fill:#9aa0a6; }
    .num { fill:#ffffff; font-size:10px; font-weight:bold; }
    .dot { fill:#d93025; }
    .h   { font-size:15px; font-weight:bold; fill:#202124; }
    .s   { font-size:11px; fill:#5f6368; }
  </style>

  <!-- ========== 1. Anatomy ========== -->
  <text x="20" y="26" class="h">1 · The time-controls bar — ONE component on every host (live cluster hosts, a cluster replay, the Replay Browser)</text>
  <rect x="20" y="40" width="1000" height="40" rx="4" class="bar"/>
  <!-- chip -->
  <rect x="28" y="48" width="70" height="24" rx="3" fill="#e6f4ea" stroke="#188038"/><text x="42" y="65" fill="#188038" font-weight="bold">● LIVE</text>
  <!-- jumps / history -->
  <rect x="108" y="48" width="26" height="24" rx="3" class="btn"/><text x="114" y="65" class="lbl">⏮</text>
  <rect x="138" y="48" width="26" height="24" rx="3" class="btn"/><text x="145" y="65" class="lbl">◀︎</text>
  <rect x="168" y="48" width="26" height="24" rx="3" class="btn"/><text x="175" y="65" class="lbl">▶︎</text>
  <!-- transport -->
  <rect x="206" y="48" width="26" height="24" rx="3" class="btn"/><text x="212" y="65" class="lbl">⏴|</text>
  <rect x="236" y="48" width="30" height="24" rx="3" class="btn"/><text x="244" y="65" class="lbl">⏸</text>
  <rect x="270" y="48" width="26" height="24" rx="3" class="btn"/><text x="275" y="65" class="lbl">|⏵</text>
  <rect x="300" y="48" width="26" height="24" rx="3" class="btn"/><text x="307" y="65" class="lbl">■</text>
  <!-- readout -->
  <text x="338" y="58" class="lbl" font-size="15" font-weight="bold">12:31.4</text>
  <text x="338" y="72" class="s">sim · now</text>
  <!-- rate -->
  <rect x="412" y="48" width="40" height="24" rx="3" class="btn"/><text x="422" y="65" class="lbl">1×</text>
  <!-- axis -->
  <rect x="464" y="48" width="92" height="24" rx="3" class="btn"/>
  <rect x="465" y="49" width="45" height="22" rx="2" class="on"/><text x="474" y="65" class="lbl" font-weight="bold">SIM</text>
  <text x="518" y="65" class="dim">wall</text>
  <!-- review -->
  <rect x="568" y="48" width="96" height="24" rx="3" class="btn"/><text x="580" y="65" class="lbl">⟲ Review…</text>
  <!-- numbers -->
  <circle cx="63" cy="92" r="8" fill="#1a73e8"/><text x="60" y="96" class="num">1</text>
  <circle cx="121" cy="92" r="8" fill="#1a73e8"/><text x="118" y="96" class="num">2</text>
  <circle cx="166" cy="92" r="8" fill="#1a73e8"/><text x="163" y="96" class="num">3</text>
  <circle cx="219" cy="92" r="8" fill="#1a73e8"/><text x="216" y="96" class="num">4</text>
  <circle cx="251" cy="92" r="8" fill="#1a73e8"/><text x="248" y="96" class="num">5</text>
  <circle cx="283" cy="92" r="8" fill="#1a73e8"/><text x="280" y="96" class="num">6</text>
  <circle cx="313" cy="92" r="8" fill="#1a73e8"/><text x="310" y="96" class="num">7</text>
  <circle cx="365" cy="92" r="8" fill="#1a73e8"/><text x="362" y="96" class="num">8</text>
  <circle cx="432" cy="92" r="8" fill="#1a73e8"/><text x="429" y="96" class="num">9</text>
  <circle cx="510" cy="92" r="8" fill="#1a73e8"/><text x="504" y="96" class="num">10</text>
  <circle cx="616" cy="92" r="8" fill="#1a73e8"/><text x="610" y="96" class="num">11</text>

  <text x="20" y="122" class="s">① state chip LIVE / REVIEW / REPLAY / PREVIEW   ② jump to start (review, replay)   ③ seek history back / forward (review, replay — the Timeline's ◀ ▶)</text>
  <text x="20" y="138" class="s">④ step back (review, replay)   ⑤ play / pause   ⑥ step forward   ⑦ stop (live, preview: end the run · replay: leave it · hidden in a review)</text>
  <text x="20" y="154" class="s">⑧ time on the active axis + its caption   ⑨ rate   ⑩ axis switch SIM | wall (R-3058 — the session's, shown everywhere)   ⑪ Review… (live) / ● Back to live (review)</text>

  <!-- ========== 2. The bar per mode ========== -->
  <text x="20" y="190" class="h">2 · The same bar in each mode</text>

  <!-- live paused -->
  <text x="20" y="214" class="s">LIVE, paused — ② ③ ④ hidden (the live run has no past to jump in; the past is reached through ⑪)</text>
  <rect x="20" y="222" width="1000" height="36" rx="4" class="bar"/>
  <rect x="28" y="228" width="70" height="24" rx="3" fill="#e6f4ea" stroke="#188038"/><text x="42" y="245" fill="#188038" font-weight="bold">● LIVE</text>
  <rect x="108" y="228" width="30" height="24" rx="3" class="btn"/><text x="116" y="245" class="lbl">⏵</text>
  <rect x="142" y="228" width="26" height="24" rx="3" class="btn"/><text x="147" y="245" class="lbl">|⏵</text>
  <rect x="172" y="228" width="26" height="24" rx="3" class="btn"/><text x="179" y="245" class="lbl">■</text>
  <text x="210" y="245" class="lbl" font-weight="bold">12:31.4</text><text x="272" y="245" class="s">paused</text>
  <rect x="320" y="228" width="40" height="24" rx="3" class="btn"/><text x="330" y="245" class="lbl">1×</text>
  <rect x="372" y="228" width="92" height="24" rx="3" class="btn"/><rect x="373" y="229" width="45" height="22" rx="2" class="on"/><text x="382" y="245" class="lbl" font-weight="bold">SIM</text><text x="426" y="245" class="dim">wall</text>
  <rect x="476" y="228" width="96" height="24" rx="3" class="btn"/><text x="488" y="245" class="lbl">⟲ Review…</text>

  <!-- review -->
  <text x="20" y="280" class="s">REVIEW (of the live run) — the readout adds the live point and the distance to it; ⑪ becomes Back to live; ⑦ hidden</text>
  <rect x="20" y="288" width="1000" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00"/>
  <rect x="28" y="294" width="76" height="24" rx="3" fill="#f9ab00"/><text x="36" y="311" fill="#202124" font-weight="bold">⟲ REVIEW</text>
  <rect x="112" y="294" width="26" height="24" rx="3" class="btn"/><text x="118" y="311" class="lbl">⏮</text>
  <rect x="142" y="294" width="26" height="24" rx="3" class="btn"/><text x="149" y="311" class="lbl">◀︎</text>
  <rect x="172" y="294" width="26" height="24" rx="3" class="btn"/><text x="179" y="311" class="lbl">▶︎</text>
  <rect x="208" y="294" width="26" height="24" rx="3" class="btn"/><text x="214" y="311" class="lbl">⏴|</text>
  <rect x="238" y="294" width="30" height="24" rx="3" class="btn"/><text x="246" y="311" class="lbl">⏵</text>
  <rect x="272" y="294" width="26" height="24" rx="3" class="btn"/><text x="277" y="311" class="lbl">|⏵</text>
  <text x="312" y="304" class="lbl" font-weight="bold">07:04.0</text><text x="312" y="318" class="s">/ live 12:31.4 (−05:27)</text>
  <rect x="452" y="294" width="40" height="24" rx="3" class="btn"/><text x="462" y="311" class="lbl">2×</text>
  <rect x="504" y="294" width="92" height="24" rx="3" class="btn"/><rect x="505" y="295" width="45" height="22" rx="2" class="on"/><text x="514" y="311" class="lbl" font-weight="bold">SIM</text><text x="558" y="311" class="dim">wall</text>
  <rect x="608" y="294" width="120" height="24" rx="3" fill="#e6f4ea" stroke="#188038"/><text x="618" y="311" fill="#188038" font-weight="bold">● Back to live</text>

  <!-- cluster replay -->
  <text x="20" y="346" class="s">REPLAY (a finished exercise, cluster) — the readout adds the length; ⑦ leaves the replay; no ⑪</text>
  <rect x="20" y="354" width="1000" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
  <rect x="28" y="360" width="76" height="24" rx="3" fill="#1a73e8"/><text x="38" y="377" fill="#ffffff" font-weight="bold">▶ REPLAY</text>
  <rect x="112" y="360" width="26" height="24" rx="3" class="btn"/><text x="118" y="377" class="lbl">⏮</text>
  <rect x="142" y="360" width="26" height="24" rx="3" class="btn"/><text x="149" y="377" class="lbl">◀︎</text>
  <rect x="172" y="360" width="26" height="24" rx="3" class="btn"/><text x="179" y="377" class="lbl">▶︎</text>
  <rect x="208" y="360" width="26" height="24" rx="3" class="btn"/><text x="214" y="377" class="lbl">⏴|</text>
  <rect x="238" y="360" width="30" height="24" rx="3" class="btn"/><text x="246" y="377" class="lbl">⏸</text>
  <rect x="272" y="360" width="26" height="24" rx="3" class="btn"/><text x="277" y="377" class="lbl">|⏵</text>
  <rect x="302" y="360" width="26" height="24" rx="3" class="btn"/><text x="309" y="377" class="lbl">■</text>
  <text x="340" y="370" class="lbl" font-weight="bold">03:12.7</text><text x="340" y="384" class="s">/ 18:40.0</text>
  <rect x="452" y="360" width="40" height="24" rx="3" class="btn"/><text x="462" y="377" class="lbl">1×</text>
  <rect x="504" y="360" width="92" height="24" rx="3" class="btn"/><rect x="551" y="361" width="44" height="22" rx="2" class="on"/><text x="514" y="377" class="dim">SIM</text><text x="558" y="377" class="lbl" font-weight="bold">wall</text>

  <!-- replay browser -->
  <text x="20" y="412" class="s">REPLAY BROWSER (offline, local) — the SAME bar; its own extras stay in its own panels (node / merged view, export)</text>
  <rect x="20" y="420" width="1000" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
  <rect x="28" y="426" width="76" height="24" rx="3" fill="#1a73e8"/><text x="38" y="443" fill="#ffffff" font-weight="bold">▶ REPLAY</text>
  <rect x="112" y="426" width="26" height="24" rx="3" class="btn"/><text x="118" y="443" class="lbl">⏮</text>
  <rect x="142" y="426" width="26" height="24" rx="3" class="btn"/><text x="149" y="443" class="lbl">◀︎</text>
  <rect x="172" y="426" width="26" height="24" rx="3" class="btn"/><text x="179" y="443" class="lbl">▶︎</text>
  <rect x="208" y="426" width="26" height="24" rx="3" class="btn"/><text x="214" y="443" class="lbl">⏴|</text>
  <rect x="238" y="426" width="30" height="24" rx="3" class="btn"/><text x="246" y="443" class="lbl">⏵</text>
  <rect x="272" y="426" width="26" height="24" rx="3" class="btn"/><text x="277" y="443" class="lbl">|⏵</text>
  <rect x="302" y="426" width="26" height="24" rx="3" class="btn"/><text x="309" y="443" class="lbl">■</text>
  <text x="340" y="436" class="lbl" font-weight="bold">00:41.2</text><text x="340" y="450" class="s">/ 09:58.3</text>
  <rect x="452" y="426" width="40" height="24" rx="3" class="btn"/><text x="462" y="443" class="lbl">4×</text>
  <rect x="504" y="426" width="92" height="24" rx="3" class="btn"/><rect x="505" y="427" width="45" height="22" rx="2" class="on"/><text x="514" y="443" class="lbl" font-weight="bold">SIM</text><text x="558" y="443" class="dim">wall</text>
  <text x="620" y="443" class="s">(the axis here is the viewer's — no cluster)</text>

  <!-- ========== 3. Timeline + context menu ========== -->
  <text x="20" y="498" class="h">3 · The timeline — a left click never changes the state; seeking is in the right-click menu (and the playhead drag in a review / replay)</text>

  <!-- live timeline -->
  <text x="20" y="522" class="s">LIVE — right click in the past</text>
  <rect x="20" y="530" width="490" height="120" rx="4" class="bar"/>
  <line x1="36" y1="550" x2="470" y2="550" stroke="#5f6368"/>
  <text x="36" y="546" class="s">0:00</text><text x="440" y="546" class="s">12:31</text>
  <rect x="36" y="558" width="434" height="9" fill="#dadce0"/>
  <circle cx="120" cy="562" r="3" class="dot"/><circle cx="260" cy="562" r="3" class="dot"/><circle cx="380" cy="562" r="3" class="dot"/>
  <rect x="36" y="574" width="434" height="9" fill="#dadce0"/>
  <line x1="470" y1="550" x2="470" y2="600" stroke="#188038" stroke-width="3"/>
  <line x1="230" y1="550" x2="230" y2="600" stroke="#5f6368" stroke-dasharray="3,2"/>
  <rect x="236" y="586" width="236" height="58" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="246" y="603" class="lbl">⟲ Review from 05:41</text>
  <text x="246" y="620" class="lbl">⟲ Review from 05:41 and play</text>
  <text x="246" y="637" class="dim">⟲ Review from the event (shot 05:47)</text>

  <!-- review timeline -->
  <text x="530" y="522" class="s">REVIEW / REPLAY — right click; drag the playhead to scrub</text>
  <rect x="530" y="530" width="490" height="200" rx="4" class="bar"/>
  <line x1="546" y1="550" x2="980" y2="550" stroke="#5f6368"/>
  <text x="546" y="546" class="s">0:00 sim</text><text x="930" y="546" class="s">10:02</text>
  <rect x="546" y="558" width="434" height="9" fill="#dadce0"/>
  <circle cx="640" cy="562" r="3" class="dot"/><circle cx="770" cy="562" r="3" class="dot"/><circle cx="900" cy="562" r="3" class="dot"/>
  <line x1="700" y1="552" x2="700" y2="578" stroke="#5f6368" stroke-width="2"/><circle cx="700" cy="581" r="3.5" fill="#5f6368"/>
  <line x1="610" y1="550" x2="610" y2="600" stroke="#f9ab00" stroke-width="2"/>
  <path d="M 604 548 L 616 548 L 610 556 Z" fill="#f9ab00"/>
  <line x1="980" y1="550" x2="980" y2="600" stroke="#188038" stroke-width="3"/>
  <line x1="770" y1="550" x2="770" y2="600" stroke="#5f6368" stroke-dasharray="3,2"/>
  <rect x="776" y="590" width="236" height="134" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="786" y="607" class="lbl">Seek here (06:22)</text>
  <text x="786" y="624" class="lbl">Play from here</text>
  <text x="786" y="641" class="lbl">Seek to this event (hit, 06:22.4)</text>
  <text x="786" y="658" class="lbl">◀ Previous event in this lane</text>
  <text x="786" y="675" class="lbl">▶ Next event in this lane</text>
  <line x1="786" y1="683" x2="1002" y2="683" stroke="#dadce0"/>
  <text x="786" y="700" class="lbl">⏭ Seek to the live point</text>
  <text x="786" y="717" class="dim">Copy the time</text>
  <text x="546" y="622" class="s">on a pause tick (Sim axis) the menu adds:</text>
  <text x="546" y="638" class="s">  · Seek to before the pause's edits</text>
  <text x="546" y="654" class="s">  · Seek to after them (the unpause)</text>

  <!-- ========== 4. From any host ========== -->
  <text x="20" y="772" class="h">4 · Every control works from any host — it publishes an intent; the master decides; every host draws the cluster's status</text>
  <rect x="20" y="786" width="210" height="60" rx="4" fill="#ffffff" stroke="#5f6368"/>
  <text x="32" y="806" class="lbl" font-weight="bold">any host (CGF, IG, SimHost,</text><text x="32" y="822" class="lbl" font-weight="bold">editor, ExCon)</text><text x="32" y="838" class="s">bar · timeline · cluster panel</text>
  <rect x="290" y="786" width="210" height="60" rx="4" fill="#ffffff" stroke="#5f6368"/>
  <text x="302" y="806" class="lbl" font-weight="bold">ClusterOpEgressTranslator</text><text x="302" y="822" class="s">intent → ClusterOpRequest</text><text x="302" y="838" class="s">over DDS (exists)</text>
  <rect x="560" y="786" width="210" height="60" rx="4" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="572" y="806" class="lbl" font-weight="bold">ClusterMaster</text><text x="572" y="822" class="s">validates · plans · drives</text><text x="572" y="838" class="s">the replay clock</text>
  <rect x="810" y="786" width="210" height="60" rx="4" fill="#ffffff" stroke="#5f6368"/>
  <text x="822" y="806" class="lbl" font-weight="bold">cluster status topic</text><text x="822" y="822" class="s">state · axis · sim seconds ·</text><text x="822" y="838" class="s">live point → ClusterUiCache</text>
  <line x1="230" y1="816" x2="290" y2="816" stroke="#202124" marker-end="url(#a)"/>
  <line x1="500" y1="816" x2="560" y2="816" stroke="#202124" marker-end="url(#a)"/>
  <line x1="770" y1="816" x2="810" y2="816" stroke="#202124" marker-end="url(#a)"/>
  <path d="M 915 846 L 915 876 L 125 876 L 125 846" fill="none" stroke="#202124" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="400" y="892" class="s">every host re-draws from the status — ⛔ no host keeps its own idea of the time, the axis or the review</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#202124"/></marker></defs>

  <text x="20" y="930" class="s">The Replay Browser is offline: the same bar and timeline, bound to its local transport instead of the master (R-4080).</text>
  <text x="20" y="950" class="s">Wireframes of DESIGN_Replay_Time_Axis_And_Review.md §9 — layout and behaviour, not final visuals.</text>
</svg>
